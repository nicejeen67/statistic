<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>다중회귀분석 사이버 스캔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: 16:9 cinematic stage (canvas, 1280x720 logical) + control strip below. Single dark "cyber HUD" look. */
:root{
  --bg:#03060c; --panel:#0a1322; --line:#18324d;
  --cyan:#38e8ff; --mag:#ff3fa4; --amber:#ffc24a;
  --fg:#d7f6ff; --dim:#6f8ea8;
  --f-display:'Orbitron','JetBrains Mono',ui-monospace,monospace;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);overflow:hidden}
.stage:fullscreen{border:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(160,240,255,.045) 0 1px,transparent 1px 3px)}
.vig{pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px}
.grp{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:8px 12px;cursor:pointer;border-radius:2px}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button[aria-pressed="true"]{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
#scrub{flex:1 1 200px;min-width:0;accent-color:var(--cyan)}
#tc{color:var(--dim);font-variant-numeric:tabular-nums;min-width:7ch}
.hint{color:var(--dim);font-size:12px;line-height:1.6;margin:0}
.hint b{color:var(--cyan);font-weight:400}
body.rec .controls,body.rec .hint,body.rec .script,body.rec .scenes{display:none}
.scenes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:640px){.scenes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.scenes button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;min-width:0}
.scenes button .n{font-family:var(--f-display);font-size:11px;color:var(--amber);letter-spacing:.08em}
.scenes button .l{font-family:var(--f-body);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.scenes button[aria-current="true"]{border-color:var(--cyan);background:rgba(56,232,255,.12);color:var(--cyan)}
.scenes button[aria-current="true"] .n{color:var(--cyan)}
.script{border:1px solid var(--line);background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.script .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.script .tag{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;color:var(--amber)}
.script h2{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
.script .now{margin:0;font-size:17px;line-height:1.85;max-width:70ch;color:var(--fg)}
.script .tip{margin:0;font-size:13px;color:var(--dim);line-height:1.6}
.script details{border-top:1px solid var(--line);padding-top:10px}
.script summary{cursor:pointer;color:var(--cyan);font-size:14px}
.script ol{margin:10px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px}
.script li{line-height:1.75;font-size:14px;max-width:75ch;cursor:pointer}
.script li b{color:var(--cyan)}
.script li.on{color:var(--cyan)}
.script textarea{position:absolute;left:-9999px}
</style></head><body>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="scan"></div><div class="vig"></div>
  </div>
  <nav class="scenes" id="scenes" aria-label="장면 선택"></nav>
  <div class="controls">
    <div class="grp">
      <button id="auto" aria-pressed="true" title="각 장면이 끝나면 자동으로 멈춥니다">장면마다 멈춤</button>
      <button id="prev" title="이전 장면 (←)">◀◀</button>
      <button id="play" title="재생/일시정지 (Space)">❚❚ 일시정지</button>
      <button id="next" title="다음 장면 (→)">▶▶</button>
      <button id="restart">⟲ 처음부터</button>
    </div>
    <input type="range" id="scrub" min="0" max="53" step="0.01" value="0" aria-label="타임라인">
    <span id="tc">00:00</span>
    <div class="grp" role="group" aria-label="설명 수준">
      <button id="lvMid" aria-pressed="true">중학생 수준</button>
      <button id="lvUni" aria-pressed="false">대학 수준</button>
    </div>
    <div class="grp">
      <button id="sq" aria-pressed="true">잔차 제곱 ■</button>
      <button id="spd">속도 1×</button>
      <button id="fs">전체화면</button>
      <button id="rec">녹화 모드 (H)</button>
    </div>
  </div>
  <section class="script" aria-live="polite">
    <div class="head">
      <span class="tag" id="sTag">SCENE 01 · 설명 대본</span>
      <button id="copy">전체 대본 복사</button>
    </div>
    <h2 id="sTitle"></h2>
    <p class="now" id="sNow"></p>
    <p class="tip" id="sTip"></p>
    <details>
      <summary>전체 시나리오 보기 (항목을 누르면 그 장면으로 이동)</summary>
      <ol id="sAll"></ol>
    </details>
  </section>
  <p class="hint">녹화 모드에서는 아래 조작판이 사라집니다. <b>H</b> 키로 다시 표시 · <b>Space</b> 재생/정지 · <b>← →</b> 장면 이동. 데이터는 설명용 가상 예시(아파트 48건)입니다. 면적·건축연령으로 매매가를 설명합니다.</p>
</div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const LW=1280,LH=720;
function resize(){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));}
addEventListener('resize',resize);resize();

/* 가상 아파트 자료: 면적과 건축연령으로 가격을 설명한다. */
let seed=20261112;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const N=48,A=[],G=[],Y=[];
for(let i=0;i<N;i++){const a=40+rnd()*90,g=2+rnd()*28;A.push(a);G.push(g);Y.push(1.5+.065*a-.09*g+(rnd()+rnd()+rnd()-1.5)*.9)}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length,am=mean(A),gm=mean(G),ym=mean(Y);
let aa=0,gg=0,ag=0,ay=0,gy=0;for(let i=0;i<N;i++){const a=A[i]-am,g=G[i]-gm,y=Y[i]-ym;aa+=a*a;gg+=g*g;ag+=a*g;ay+=a*y;gy+=g*y}
const det=aa*gg-ag*ag,b1=(ay*gg-gy*ag)/det,b2=(gy*aa-ay*ag)/det,b0=ym-b1*am-b2*gm;
const predict=(a,g)=>b0+b1*a+b2*g,YH=A.map((a,i)=>predict(a,G[i])),E=Y.map((y,i)=>y-YH[i]);
const SST=Y.reduce((s,y)=>s+(y-ym)**2,0),SSE=E.reduce((s,e)=>s+e*e,0),SSR=SST-SSE,DF=N-3,MSE=SSE/DF,R2=1-SSE/SST,ADJ=1-(1-R2)*(N-1)/DF,F=(SSR/2)/MSE;
const SE=[Math.sqrt(MSE*gg/det),Math.sqrt(MSE*aa/det)],T=[b1/SE[0],b2/SE[1]],VIF=1/(1-ag*ag/(aa*gg));
// Regularized incomplete beta gives stable two-sided t and upper-tail F probabilities.
function lgamma(z){const c=[676.5203681218851,-1259.1392167224028,771.3234287776531,-176.6150291621406,12.5073432786869,-.13857109526572,9.984369578019572e-6,1.505632735149312e-7];if(z<.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-lgamma(1-z);z--;let x=.9999999999998099;for(let i=0;i<c.length;i++)x+=c[i]/(z+i+1);const t=z+7.5;return .5*Math.log(2*Math.PI)+(z+.5)*Math.log(t)-t+Math.log(x)}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;function cf(a,b,x){let c=1,d=1-(a+b)*x/(a+1);d=1/d;let h=d;for(let m=1;m<=200;m++){let q=m*(b-m)*x/((a+2*m-1)*(a+2*m));d=1+q*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+q/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;q=-(a+m)*(a+b+m)*x/((a+2*m)*(a+2*m+1));d=1+q*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+q/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const v=d*c;h*=v;if(Math.abs(v-1)<3e-14)break}return h}const f=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log1p(-x));return x<(a+1)/(a+b+2)?f*cf(a,b,x)/a:1-f*cf(b,a,1-x)/b}
const pval=t=>ibeta(DF/(DF+t*t),DF/2,.5),PF=ibeta(DF/(DF+2*F),DF/2,1),fmtp=p=>p<.001?'< .001':p.toFixed(3);
let low=0,high=20;for(let i=0;i<70;i++){const m=(low+high)/2;if(pval(m)>.05)low=m;else high=m}const TCR=(low+high)/2;
const PRED=predict(84,10),da=84-am,dg=10-gm,h0=1/N+(gg*da*da-2*ag*da*dg+aa*dg*dg)/det,margin=TCR*Math.sqrt(MSE*(1+h0)),PI=[PRED-margin,PRED+margin];
const S=[0,6,15,24,33,43,53,64],END=64;
let t=0,playing=true,speed=1,level='mid',showSq=false;
const SHORT=['다중회귀 개념','회귀평면','계수 해석','설명력·수정 R²','t검정·F검정','진단·VIF','결과·예측'];
const TXT={mid:{scenes:['여러 조건으로 가격 설명하기','직선에서 평면으로','다른 조건이 같다면?','변수를 늘리면 더 좋을까?','각 변수와 모형 전체의 검정','오차와 변수의 겹침 점검','두 조건을 넣어 가격 예측']},uni:{scenes:['다중선형회귀모형','OLS와 회귀평면','편회귀계수 해석','R²와 수정 R²','계수 t검정과 전체 F검정','잔차 진단과 다중공선성','결과 보고와 95% 예측구간']}};
const equation=`ŷ = ${b0.toFixed(2)} + ${b1.toFixed(3)} × 면적 − ${Math.abs(b2).toFixed(3)} × 연령`;
const SCRIPT={mid:[
{s:'집값은 면적 하나로만 정해지지 않아요. 면적과 건축연령처럼 여러 설명변수를 함께 넣어 가격과의 관계를 살펴보는 방법이 다중회귀분석입니다. 여기서는 가상 아파트 48채를 사용합니다.',tip:'설명변수가 2개 이상이어도 예측하는 결과변수는 가격 하나입니다.'},
{s:'면적과 건축연령을 바닥의 두 축, 가격을 높이로 나타내면 점들이 공간에 놓입니다. 점과 평면 사이의 세로 오차를 제곱해 모두 더한 값이 가장 작은 평면을 찾습니다. 분홍 세로선은 실제 가격과 예측 가격의 차이입니다.',tip:'평면 위의 높이가 두 조건을 함께 고려한 예측 가격입니다.'},
{s:`건축연령이 같은 아파트끼리 비교하면 면적이 1㎡ 클 때 예측 가격은 약 ${Math.round(b1*10000)}만 원 높습니다. 반대로 면적이 같을 때 건축연령이 1년 늘면 예측 가격은 약 ${Math.round(Math.abs(b2)*10000)}만 원 낮습니다. 다른 조건을 같게 두는 것이 해석의 핵심입니다.`,tip:'관찰 자료의 관계만으로 원인과 결과가 입증되는 것은 아닙니다.'},
{s:`평균 가격만 쓰는 것보다 오차를 얼마나 줄였는지 나타내는 R²는 ${(R2*100).toFixed(1)}%입니다. 변수를 추가하면 같은 자료의 R²는 작아지지 않습니다. 그래서 변수 수에 벌점을 주는 수정 R²도 함께 보며, 이번 값은 ${ADJ.toFixed(3)}입니다.`,tip:'실제 새 집에 대한 예측 성능은 별도 검증 자료로 확인합니다.'},
{s:`t검정은 다른 변수를 고려한 뒤 각 계수가 0인지 확인합니다. 면적의 t값은 ${T[0].toFixed(2)}, 건축연령은 ${T[1].toFixed(2)}입니다. F검정은 두 기울기가 모두 0이라는 가설을 확인하며 F값은 ${F.toFixed(2)}입니다. p값은 귀무가설과 모형 가정 아래 이 정도로 극단적인 통계량이 나올 확률입니다.`,tip:'작은 p값이 효과의 크기나 인과관계를 뜻하지는 않습니다.'},
{s:`잔차도에서 곡선이나 깔때기 모양이 있는지 살펴봅니다. 변수끼리 지나치게 비슷한 정보를 담으면 개별 계수의 추정이 불안정해질 수 있어요. 이를 다중공선성이라 하며, 이번 두 변수의 VIF는 ${VIF.toFixed(2)}로 1에 가깝습니다.`,tip:'잔차도 하나만으로 모든 가정이 확인되지는 않습니다.'},
{s:`면적 84㎡, 건축연령 10년을 식에 넣으면 예상 가격은 ${PRED.toFixed(2)}억 원입니다. 같은 조건에서도 집마다 차이가 있어서 개별 아파트의 95% 예측구간은 ${PI[0].toFixed(2)}~${PI[1].toFixed(2)}억 원입니다. 이 범위는 모형 가정이 적절하다는 전제 아래 계산합니다.`,tip:'가상 자료로 만든 교육용 모형이며 실제 시세 추정이 아닙니다.'}
],uni:[
{s:'Y = β₀ + β₁X₁ + β₂X₂ + ε에서 X₁은 전용면적, X₂는 건축연령입니다. 조건부 평균의 선형성, 오차의 조건부 평균 0, 독립성, 등분산성, 완전한 다중공선성이 없음을 전제합니다. 여기서 사용하는 소표본 t·F 추론에는 오차의 정규성도 가정합니다.',tip:'설명변수와 오차항의 관련성은 잔차도만으로 확인할 수 없습니다.'},
{s:`OLS는 SSE = Σ(yᵢ − ŷᵢ)²를 최소화합니다. 설계행렬의 열이 선형독립이면 b = (X′X)⁻¹X′y입니다. 추정식은 ${equation}입니다. n = ${N}, 추정 모수 수는 절편을 포함해 3이며 잔차 자유도는 ${DF}입니다.`,tip:'두 설명변수에서는 회귀평면, 더 많은 변수에서는 초평면이 됩니다.'},
{s:`편회귀계수 b₁ = ${b1.toFixed(4)}억/㎡는 건축연령을 통제한 면적과 가격의 관계이고, b₂ = ${b2.toFixed(4)}억/년은 면적을 통제한 건축연령과 가격의 관계입니다. 절편 ${b0.toFixed(3)}은 면적과 연령이 모두 0인 경우로 자료 범위 밖이어서 실질적 해석에 주의합니다.`,tip:'통제는 포함된 변수에 한정되며 누락변수 편향이 사라지는 것은 아닙니다.'},
{s:`절편을 포함한 OLS에서 SST = SSR + SSE입니다. SST = ${SST.toFixed(3)}, SSR = ${SSR.toFixed(3)}, SSE = ${SSE.toFixed(3)}이며 R² = ${R2.toFixed(4)}입니다. 수정 R² = 1 − [SSE/(n−k−1)]/[SST/(n−1)] = ${ADJ.toFixed(4)}이고 k = 2입니다.`,tip:'R²는 표본 내 적합도이며 일반화 성능을 보장하지 않습니다.'},
{s:`각 H₀: βⱼ = 0에 대해 t = bⱼ/SE(bⱼ), df = ${DF}입니다. 면적: SE = ${SE[0].toFixed(4)}, t = ${T[0].toFixed(2)}, p ${fmtp(pval(T[0]))}; 연령: SE = ${SE[1].toFixed(4)}, t = ${T[1].toFixed(2)}, p ${fmtp(pval(T[1]))}. 전체 H₀: β₁ = β₂ = 0에 대해 F(2, ${DF}) = ${F.toFixed(2)}, p ${fmtp(PF)}입니다.`,tip:'설명변수가 둘이므로 전체 F값을 특정 계수의 t²와 같다고 해석하지 않습니다.'},
{s:`잔차 대 적합값으로 비선형성과 이분산의 징후를 점검합니다. VIFⱼ = 1/(1−Rⱼ²)이며 보조회귀의 Rⱼ²는 해당 설명변수를 나머지 설명변수로 회귀해 구합니다. 이번 두 변수의 VIF는 모두 ${VIF.toFixed(3)}입니다. 정규성은 Q-Q plot, 독립성은 자료 수집 구조와 잔차의 시간·공간 패턴으로 추가 점검합니다.`,tip:'VIF 기준은 맥락에 따라 해석하며 영향점과 누락변수도 별도로 검토합니다.'},
