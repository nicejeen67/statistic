<title>가설 설정 사이버 스캔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: 16:9 cinematic stage (canvas, 1280x720 logical) + control strip below. Single dark "cyber HUD" look. */
:root{
  --bg:#03060c; --panel:#0a1322; --line:#18324d;
  --cyan:#38e8ff; --mag:#ff3fa4; --amber:#ffc24a;
  --fg:#d7f6ff; --dim:#6f8ea8;
  --f-display:'Orbitron','JetBrains Mono',ui-monospace,monospace;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);overflow:hidden}
.stage:fullscreen{border:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(160,240,255,.045) 0 1px,transparent 1px 3px)}
.vig{pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px}
.grp{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:8px 12px;cursor:pointer;border-radius:2px}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button[aria-pressed="true"]{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
#scrub{flex:1 1 200px;min-width:0;accent-color:var(--cyan)}
#tc{color:var(--dim);font-variant-numeric:tabular-nums;min-width:7ch}
.hint{color:var(--dim);font-size:12px;line-height:1.6;margin:0}
.hint b{color:var(--cyan);font-weight:400}
body.rec .controls,body.rec .hint,body.rec .script,body.rec .scenes{display:none}
.scenes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:640px){.scenes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.scenes button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;min-width:0}
.scenes button .n{font-family:var(--f-display);font-size:11px;color:var(--amber);letter-spacing:.08em}
.scenes button .l{font-family:var(--f-body);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.scenes button[aria-current="true"]{border-color:var(--cyan);background:rgba(56,232,255,.12);color:var(--cyan)}
.scenes button[aria-current="true"] .n{color:var(--cyan)}
.script{border:1px solid var(--line);background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.script .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.script .tag{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;color:var(--amber)}
.script h2{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
.script .now{margin:0;font-size:17px;line-height:1.85;max-width:70ch;color:var(--fg)}
.script .tip{margin:0;font-size:13px;color:var(--dim);line-height:1.6}
.script details{border-top:1px solid var(--line);padding-top:10px}
.script summary{cursor:pointer;color:var(--cyan);font-size:14px}
.script ol{margin:10px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px}
.script li{line-height:1.75;font-size:14px;max-width:75ch;cursor:pointer}
.script li b{color:var(--cyan)}
.script li.on{color:var(--cyan)}
.script textarea{position:absolute;left:-9999px}
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="scan"></div><div class="vig"></div>
  </div>
  <nav class="scenes" id="scenes" aria-label="장면 선택"></nav>
  <div class="controls">
    <div class="grp">
      <button id="auto" aria-pressed="true" title="각 장면이 끝나면 자동으로 멈춥니다">장면마다 멈춤</button>
      <button id="prev" title="이전 장면 (←)">◀◀</button>
      <button id="play" title="재생/일시정지 (Space)">❚❚ 일시정지</button>
      <button id="next" title="다음 장면 (→)">▶▶</button>
      <button id="restart">⟲ 처음부터</button>

    <div class="grp" role="group" aria-label="설명 수준">
      <button id="lvMid" aria-pressed="true">중학생 수준</button>
      <button id="lvUni" aria-pressed="false">대학 수준</button>
    </div>
    <div class="grp">
      <button id="sq" aria-pressed="true">잔차 제곱 ■</button>
      <button id="spd">속도 1×</button>
      <button id="fs">전체화면</button>
      <button id="rec">녹화 모드 (H)</button>
    </div>
  </div>
  <section class="script" aria-live="polite">
    <div class="head">
      <span class="tag" id="sTag">SCENE 01 · 설명 대본</span>
      <button id="copy">전체 대본 복사</button>

    <h2 id="sTitle"></h2>
    <p class="now" id="sNow"></p>

    <details>
      <summary>전체 시나리오 보기 (항목을 누르면 그 장면으로 이동)</summary>
      <ol id="sAll"></ol>
    </details>
  </section>
  <p class="hint">녹화 모드에서는 아래 조작판이 사라집니다. <b>H</b> 키로 다시 표시 · <b>Space</b> 재생/정지 · <b>← →</b> 장면 이동. 예시는 설명용입니다.</p>
</div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const LW=1280,LH=720;
function resize(){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));}
addEventListener('resize',resize);resize();
let seed=1031;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
const P={x0:150,x1:890,y0:120,y1:600};
const S=[0,7,16,28,37,47,56,66,75,86],END=90;
let t=0,playing=true,speed=1,level='mid';
const TXT={
 mid:{scenes:['가설이란? 재판으로 이해하기','가설 세우는 3단계','질문을 가설로 바꿔 보기','양측검정과 단측검정','분석 방법별 가설 모음','주의 ① 등호와 결론 표현','주의 ② 순서와 "전체"','판단의 두 가지 실수','가설 설정 체크리스트']},
 uni:{scenes:['귀무가설 H₀와 대립가설 H₁','가설 설정 절차','연구문제의 가설화','양측검정 vs 단측검정','검정 방법별 H₀ · H₁','등호 규칙과 결론 진술','사전 설정 · 모수 서술 · 다중성','제1종 · 제2종 오류와 검정력','가설 설정 체크리스트']}
};
/* ---------- 유틸 ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>{v=clamp(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const sceneIdx=tt=>{for(let k=S.length-2;k>=0;k--)if(tt>=S[k])return k;return 0};
const prog=(k,tt)=>clamp((tt-S[k])/(S[k+1]-S[k]));
const F_={d:'Orbitron, "JetBrains Mono", monospace',m:'"JetBrains Mono", Consolas, monospace',b:'"Noto Sans KR", "Malgun Gothic", sans-serif'};
function txt(s,x,y,{f=F_.m,sz=14,c='#d7f6ff',a=1,al='left',w='400',glow=0}={}){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.font=`${w} ${sz}px ${f}`;ctx.fillStyle=c;ctx.textAlign=al;if(glow){ctx.shadowColor=c;ctx.shadowBlur=glow}ctx.fillText(s,x,y);ctx.restore()}
function corners(x,y,w,h,len,c,a){ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=c;ctx.lineWidth=2;ctx.shadowColor=c;ctx.shadowBlur=8;ctx.beginPath();
 [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([cx,cy,dx,dy])=>{ctx.moveTo(cx+dx*len,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+dy*len)});ctx.stroke();ctx.restore()}
function orb(x,y,r,c,a){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;const g=ctx.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r*2.6);
 g.addColorStop(0,'#ffffff');g.addColorStop(.25,c);g.addColorStop(.5,c+'55');g.addColorStop(1,c+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.6,0,7);ctx.fill();ctx.restore()}
function seg(x1,y1,x2,y2,c,w,a,dash){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.shadowColor=c;ctx.shadowBlur=8;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
const clipP=()=>{ctx.beginPath();ctx.rect(P.x0,P.y0,P.x1-P.x0,P.y1-P.y0);ctx.clip()};

const stars=[...Array(140)].map(()=>({x:rnd()*LW,y:rnd()*LH,z:.2+rnd()*.8,p:rnd()*6}));
function bg(tt){
 const g=ctx.createLinearGradient(0,0,0,LH);g.addColorStop(0,'#02040a');g.addColorStop(.55,'#061226');g.addColorStop(1,'#02050b');
 ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
 const hz=ctx.createRadialGradient(640,560,10,640,560,700);hz.addColorStop(0,'rgba(56,232,255,.13)');hz.addColorStop(1,'rgba(56,232,255,0)');ctx.fillStyle=hz;ctx.fillRect(0,0,LW,LH);
 for(const s of stars){const tw=.35+.65*Math.abs(Math.sin(tt*1.3+s.p));ctx.fillStyle=`rgba(180,240,255,${.5*s.z*tw})`;const x=(s.x+tt*8*s.z)%LW;ctx.fillRect(x,s.y,1.6*s.z,1.6*s.z)}
 const hy=470;ctx.save();ctx.beginPath();ctx.rect(0,hy,LW,LH-hy);ctx.clip();ctx.strokeStyle='rgba(56,232,255,.16)';ctx.lineWidth=1;
 for(let i=-24;i<=24;i++){ctx.beginPath();ctx.moveTo(640+i*14,hy);ctx.lineTo(640+i*150,LH);ctx.stroke()}
 const off=(tt*0.35)%1;for(let k=0;k<14;k++){const z=(k+off)/14;const y=hy+Math.pow(z,2.2)*(LH-hy);ctx.globalAlpha=z;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(LW,y);ctx.stroke()}
 ctx.restore();
}
function frameBox(a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(8,18,34,.72)';ctx.fillRect(P.x0-60,P.y0-40,P.x1-P.x0+90,P.y1-P.y0+95);ctx.restore();corners(P.x0-60,P.y0-40,P.x1-P.x0+90,P.y1-P.y0+95,22,'#38e8ff',a)}
function axesMain(a,L){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='rgba(56,232,255,.07)';ctx.lineWidth=1;
 for(let x=40;x<=140;x+=10){ctx.beginPath();ctx.moveTo(px(x),P.y0);ctx.lineTo(px(x),P.y1);ctx.stroke()}
 for(let y=0;y<=11;y++){ctx.beginPath();ctx.moveTo(P.x0,py(y));ctx.lineTo(P.x1,py(y));ctx.stroke()}
 ctx.strokeStyle='rgba(56,232,255,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(P.x0,P.y0);ctx.lineTo(P.x0,P.y1);ctx.lineTo(P.x1,P.y1);ctx.stroke();ctx.restore();
 for(let x=40;x<=140;x+=20)txt(String(x),px(x),P.y1+22,{sz:13,c:'#6f8ea8',al:'center',a});
 for(let y=0;y<=10;y+=2)txt(String(y),P.x0-12,py(y)+5,{sz:13,c:'#6f8ea8',al:'right',a});
 txt(L.x,(P.x0+P.x1)/2,P.y1+46,{f:F_.b,sz:15,c:'#9fdcef',al:'center',a});
 ctx.save();ctx.translate(P.x0-48,(P.y0+P.y1)/2);ctx.rotate(-Math.PI/2);txt(L.y,0,0,{f:F_.b,sz:15,c:'#9fdcef',al:'center',a});ctx.restore()}
function axesRes(a,L){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='rgba(56,232,255,.07)';ctx.lineWidth=1;
 for(let f=Math.ceil(FMIN);f<=FMAX;f++){ctx.beginPath();ctx.moveTo(rx(f),P.y0);ctx.lineTo(rx(f),P.y1);ctx.stroke()}
 for(let e=-EM;e<=EM+1e-9;e+=.5){ctx.beginPath();ctx.moveTo(P.x0,ry(e));ctx.lineTo(P.x1,ry(e));ctx.stroke()}
 ctx.strokeStyle='rgba(56,232,255,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(P.x0,P.y0);ctx.lineTo(P.x0,P.y1);ctx.lineTo(P.x1,P.y1);ctx.stroke();ctx.restore();
 seg(P.x0,ry(0),P.x1,ry(0),'#ffc24a',2,a,[8,6]);
 for(let f=Math.ceil(FMIN);f<=FMAX;f++)txt(String(f),rx(f),P.y1+22,{sz:13,c:'#6f8ea8',al:'center',a});
 for(let e=-EM;e<=EM+1e-9;e+=1)txt((e>0?'+':'')+e.toFixed(1),P.x0-12,ry(e)+5,{sz:13,c:'#6f8ea8',al:'right',a});
 txt(L.rxl,(P.x0+P.x1)/2,P.y1+46,{f:F_.b,sz:15,c:'#9fdcef',al:'center',a});
 ctx.save();ctx.translate(P.x0-48,(P.y0+P.y1)/2);ctx.rotate(-Math.PI/2);txt(L.ryl,0,0,{f:F_.b,sz:15,c:'#9fdcef',al:'center',a});ctx.restore()}
function beam(a,tt){if(a<=0)return;ctx.save();clipP();const xa=px(XMIN),ya=py(yhat(XMIN)),xb=px(XMAX),yb=py(yhat(XMAX));ctx.lineCap='round';
 ctx.strokeStyle='#38e8ff';ctx.globalAlpha=a*.18;ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(xb,yb);ctx.stroke();
 ctx.globalAlpha=a;ctx.shadowColor='#38e8ff';ctx.shadowBlur=18;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(xb,yb);ctx.stroke();
 ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(xb,yb);ctx.stroke();
 const f=(tt*.45)%1;orb(xa+(xb-xa)*f,ya+(yb-ya)*f,4,'#38e8ff',a);ctx.restore()}
function band(fn,a,c,grow){if(a<=0)return;ctx.save();clipP();ctx.globalAlpha=a;ctx.beginPath();const st=60;
 for(let i=0;i<=st;i++){const x=XMIN+(XMAX-XMIN)*i/st;const y=py(yhat(x)+fn(x)*grow);i?ctx.lineTo(px(x),y):ctx.moveTo(px(x),y)}
 for(let i=st;i>=0;i--){const x=XMIN+(XMAX-XMIN)*i/st;ctx.lineTo(px(x),py(yhat(x)-fn(x)*grow))}
 ctx.closePath();const g=ctx.createLinearGradient(0,P.y0,0,P.y1);g.addColorStop(0,c+'40');g.addColorStop(1,c+'18');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=c+'aa';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function wrap(s,maxw,font){ctx.save();ctx.font=font;const out=[];let line='';for(const wd of s.split(' ')){const tst=line?line+' '+wd:wd;if(ctx.measureText(tst).width>maxw&&line){out.push(line);line=wd}else line=tst}out.push(line);ctx.restore();return out}

/* ---------- 공통 ---------- */
const C1='#ff3fa4',C0='#38e8ff',AM='#ffc24a',WH='#eafcff',DIM='#9fdcef',MU='#6f8ea8';
const MX0=118,MX1=892;
function rbox(x,y,w,h,c,a,fill='rgba(8,18,34,.85)',lw=1.2,glow=8){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.shadowColor=c;ctx.shadowBlur=glow;ctx.strokeRect(x,y,w,h);ctx.restore()}
function wtxt(s,x,y,w,o={}){const sz=o.sz||14,lh=o.lh||Math.round(sz*1.5),f=o.f||F_.b,wt=o.w||'400';const ls=wrap(s,w,`${wt} ${sz}px ${f}`);ls.forEach((l,i)=>txt(l,x,y+i*lh,Object.assign({},o,{f,sz,w:wt})));return y+ls.length*lh}
function arrowR(x1,y,x2,c,a){seg(x1,y,x2,y,c,2,a);ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x2,y);ctx.lineTo(x2-10,y-6);ctx.lineTo(x2-10,y+6);ctx.fill();ctx.restore()}
function arrowD(x,y1,y2,c,a){seg(x,y1,x,y2,c,2,a);ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y2);ctx.lineTo(x-6,y2-10);ctx.lineTo(x+6,y2-10);ctx.fill();ctx.restore()}
function stamp(s,x,y,c,a,rot=-.08,sz=18){if(a<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;ctx.font=`900 ${sz}px ${F_.b}`;const w=ctx.measureText(s).width+20;ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.shadowColor=c;ctx.shadowBlur=12;ctx.strokeRect(-w/2,-sz*.9,w,sz*1.6);ctx.fillStyle=c;ctx.textAlign='center';ctx.fillText(s,0,sz*.35);ctx.restore()}
const npdf=z=>Math.exp(-z*z/2);
function bell(x0,w,base,h,shade,a,label){const zx=z=>x0+(z+3.5)/7*w,zy=z=>base-npdf(z)*h;if(a<=0)return{zx,zy};
 ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(255,63,164,.55)';ctx.shadowColor=C1;ctx.shadowBlur=12;
 for(let z=-3.5;z<3.5;z+=.02){if(shade(z)){ctx.fillRect(zx(z),zy(z),w/350+.6,base-zy(z))}}ctx.restore();
 ctx.save();ctx.globalAlpha=a;ctx.beginPath();for(let z=-3.5;z<=3.5;z+=.05){const X=zx(z),Y=zy(z);z===-3.5?ctx.moveTo(X,Y):ctx.lineTo(X,Y)}ctx.strokeStyle=C0;ctx.shadowColor=C0;ctx.shadowBlur=12;ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
 seg(x0,base,x0+w,base,C0,1,a*.6);return{zx,zy}}

/* ---------- 패널 내용 (h: 제목, b: 굵게, n: 보통, m: 분홍, c: 하늘, a: 노랑, '': 빈 줄, late: 늦게) ---------- */
const PANEL={
 mid:[

  {s:'분석 방법이 달라도 가설의 모양은 늘 같아요. t검정은 "두 평균이 같다", 분산분석은 "모든 평균이 같다", 상관분석은 "상관이 0이다", 회귀분석은 "기울기가 0이다", 카이제곱 검정은 "두 변수는 관계없다", 로지스틱 회귀는 "오즈비가 1이다"가 H₀예요. 즉 H₀는 항상 "같다, 없다, 0이다"이고, H₁은 그 반대입니다. 이 패턴만 기억하면 어떤 분석이든 가설을 쉽게 쓸 수 있어요.',tip:'지금까지 배운 회귀분석 영상들의 "기울기 = 0 검정"과 연결해 주세요.'},
  {s:'가설을 쓸 때 꼭 지켜야 할 규칙이 있어요. 첫째, 등호(=, 같다)는 항상 H₀에 들어갑니다. "H₀: 두 평균은 다르다"처럼 쓰면 틀린 거예요. 둘째, 결론을 쓸 때 조심하세요. p값이 0.05보다 크게 나와도 "H₀가 맞다, 차이가 없음이 증명됐다"고 쓰면 안 돼요. "H₀를 기각할 수 없다", "차이가 있다고 말할 증거가 부족하다"라고 써야 합니다. 재판에서 무죄 판결이 "결백이 증명됐다"는 뜻은 아닌 것과 같아요.',tip:'시험에 자주 나오는 부분입니다. 오른쪽 ✓ 표현을 따라 읽게 해 보세요.'},
  {s:'순서도 중요해요. 가설과 판단 기준(0.05)은 반드시 데이터를 보기 전에 정해야 합니다. 데이터를 먼저 보고 유리한 쪽으로 가설이나 방향을 바꾸면 결과를 믿을 수 없게 돼요. 또 가설은 내가 조사한 15채가 아니라 "서울 역세권 아파트 전체"에 대한 주장이에요. 15채의 평균은 계산하면 바로 알 수 있으니 검정할 필요가 없죠. 마지막으로, 가설을 여러 개 동시에 검정하면 우연히 하나쯤 맞을 확률이 커지므로 기준을 더 엄격하게 해야 합니다.',tip:'"15채 평균은 이미 아는데 왜 검정하죠?"라고 되물으면 모집단 개념이 잘 잡힙니다.'},
  {s:'가설 검정의 판단에는 두 가지 실수가 있을 수 있어요. 실제로는 차이가 없는데 "있다"고 판단하는 것이 1종 오류예요. 이 실수를 할 확률이 바로 우리가 정한 기준 0.05입니다. 반대로 실제로 차이가 있는데 놓치는 것이 2종 오류예요. 재판으로 보면 1종 오류는 죄 없는 사람을 유죄로, 2종 오류는 범인을 무죄로 판단하는 거죠. 두 실수를 동시에 없앨 수는 없지만, 조사하는 표본 수를 늘리면 2종 오류를 줄일 수 있어요.',tip:'부동산 투자 사례(잘못된 투자 vs 놓친 기회)로 두 오류의 비용 차이를 토론해 보세요.'},
  {s:'마지막으로 가설을 세울 때 확인할 체크리스트예요. 질문을 한 문장으로 썼는지, 비교 대상과 숫자를 정했는지, H₀에 "같다"가 들어갔는지, H₁이 그 반대인지와 양측·단측을 정했는지, 데이터를 보기 전에 정했는지, 전체에 대한 가설인지, 기준 0.05를 미리 정했는지, 결론을 "기각 또는 증거 부족"으로 쓸 준비가 됐는지 확인하세요. 오른쪽 연습 문제도 직접 풀어 보세요.',tip:'연습 문제의 정답이 나오기 전에 영상을 멈추고 학생들이 직접 써 보게 하세요.'}
 ],
 uni:[
  {s:'통계적 가설검정은 모수에 대한 두 개의 상호배타적 가설을 설정하는 것에서 시작합니다. 귀무가설 H₀는 효과가 없음(차이 없음, 모수 = 특정값)을 나타내고, 대립가설 H₁은 연구자가 입증하고자 하는 연구가설입니다. 검정은 H₀가 참이라는 가정 하에서 수행되며, 관측 자료가 H₀와 양립하기 어려울 때(p ≤ α) H₀를 기각합니다. 이는 무죄추정 원칙과 같은 구조로, 입증 책임은 H₁에 있습니다.',tip:'귀무(歸無)라는 용어가 "무(無)로 돌아간다", 즉 기각을 목표로 세운 가설이라는 어원을 설명할 수 있습니다.'},
  {s:'가설 설정 절차는 다음과 같습니다. ① 연구문제를 정의하고 변수를 조작적으로 정의합니다. ② 모집단과 검정 대상 모수(μ, ρ, β, OR 등)를 특정합니다. ③ 등호를 포함한 H₀와 그 여집합인 H₁을 서술하고, 유의수준 α와 검정방법을 자료 수집 전에 결정합니다. H₀와 H₁은 상호배타적이며 둘의 합집합이 모수공간 전체가 되어야 합니다.',tip:'조작적 정의(예: 역세권 = 지하철역 반경 500m 이내)를 함께 정하게 하면 실습 품질이 높아집니다.'},
  {s:'연구문제를 모수에 대한 진술로 바꾸는 예입니다. 역세권 효과는 H₀: μ역세권 = μ비역세권, H₁: μ역세권 ≠ μ비역세권으로 독립표본 t검정을 씁니다. 전세가율과 보증사고는 로지스틱 회귀에서 H₀: β₁ = 0(OR = 1)입니다. 3개 구 평균 비교는 일원분산분석에서 H₀: μ₁ = μ₂ = μ₃, H₁: 적어도 한 쌍의 μⱼ ≠ μₖ입니다. H₁을 "모든 평균이 다르다"로 쓰는 것은 흔한 오류이며, 어느 쌍이 다른지는 사후검정으로 확인합니다.',tip:'ANOVA의 H₁ 오류는 시험 단골 문제입니다.'},
  {s:'양측 대립가설 H₁: μ₁ ≠ μ₂는 기각역을 양쪽 꼬리에 α/2씩(z = ±1.96) 둡니다. 단측 대립가설 H₁: μ₁ > μ₂는 한쪽 꼬리에 α 전체(z = 1.645)를 두며, 이때 귀무가설은 H₀: μ₁ ≤ μ₂입니다. 효과가 예상 방향이면 단측 p는 양측 p의 절반이 되지만, 반대 방향 효과는 탐지할 수 없습니다. 따라서 단측검정은 이론적 근거로 방향을 사전에 정했고 반대 방향이 실질적으로 의미 없을 때만 사용합니다.',tip:'JAMOVI t검정의 Hypothesis 옵션(≠, >, <)이 바로 이 선택입니다.'},
  {s:'대부분의 검정은 H₀: θ = θ₀(보통 0), H₁: θ ≠ θ₀라는 공통 구조를 가집니다. t검정은 μ₁ − μ₂, 분산분석은 집단 평균의 동일성, 상관분석은 ρ, 회귀분석은 β₁, 카이제곱 독립성 검정은 두 범주형 변수의 독립, 로지스틱 회귀는 β₁(또는 OR = 1)이 θ입니다. 검정통계량(t, F, χ², Wald z)만 다를 뿐 논리는 같습니다.',tip:'회귀분석 결과표의 각 계수 옆 p값도 "그 계수 = 0"이라는 H₀에 대한 검정임을 상기시켜 주세요.'},
  {s:'등호는 항상 H₀에 포함됩니다(=, ≤, ≥). H₁에는 등호가 들어갈 수 없습니다(≠, <, >). 결론은 "H₀ 기각(reject)" 또는 "H₀ 기각 실패(fail to reject)"로 진술합니다. "H₀ 채택(accept)"이나 "H₀가 입증되었다"는 표현은 지양합니다. 유의하지 않은 결과는 효과가 없다는 증거가 아니라 증거 불충분을 의미하기 때문입니다. 동등성을 주장하려면 동등성 검정(TOST)처럼 별도의 설계가 필요합니다.',tip:'"Absence of evidence is not evidence of absence"를 함께 소개하세요.'},
  {s:'가설, 방향, α, 검정방법, 표본크기는 자료를 보기 전에 명시해야 합니다(사전등록). 결과를 본 뒤 가설을 세우는 HARKing이나, 유의할 때까지 분석을 바꾸는 p-hacking은 제1종 오류를 부풀립니다. 가설은 모수(μ, β)에 대한 진술이어야 하며, 표본통계량(x̄)으로 쓰면 안 됩니다. 표본통계량은 이미 관측된 값이기 때문입니다. 또한 m개의 검정을 동시에 수행하면 가족별 오류율(FWER)이 커지므로 Bonferroni(α/m) 등으로 보정합니다.',tip:'α = .05로 20개 가설을 검정하면 우연히 하나쯤 유의할 기대값이 1이라는 계산을 보여 주세요.'},
  {s:'제1종 오류는 H₀가 참인데 기각하는 오류이며 확률은 α입니다. 제2종 오류는 H₁이 참인데 기각하지 못하는 오류이며 확률은 β이고, 1 − β를 검정력이라 합니다. 표본크기가 고정되어 있으면 α를 낮출수록 β는 커지는 상충관계가 있습니다. β는 표본크기, 효과크기, 자료의 변동성에 따라 달라지므로, 사전 검정력 분석(예: 검정력 .80)으로 필요한 표본크기를 결정합니다.',tip:'G*Power 같은 도구로 표본크기를 계산하는 과정을 다음 수업과 연결할 수 있습니다.'},
  {s:'가설 설정 체크리스트입니다. 조작적 정의, 모집단과 모수 특정, H₀의 등호와 상호배타성, 양측·단측의 사전 결정, α·검정방법·표본크기의 사전 결정, 다중비교 보정 계획, reject/fail to reject로 결론 진술, 효과크기와 신뢰구간 병기 계획을 확인합니다. 연습 문제로 "전용면적이 클수록 평당가가 낮다"를 단순회귀의 단측 가설로 써 보면, H₀: β₁ ≥ 0, H₁: β₁ < 0이 됩니다.',tip:'정답이 나오기 전에 영상을 멈추고 학생들이 직접 써 보게 하세요.'}
 ]
};
/* ---------- 루프 & 컨트롤 ---------- */
const scrub=document.getElementById('scrub'),tc=document.getElementById('tc'),playB=document.getElementById('play');
scrub.max=END;
let last=performance.now(),autoStop=true,passK=-1,uiK=-1,uiLv='';
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing){const k0=sceneIdx(t);t+=dt*speed;if(t>=END){t=END;setPlay(false)}
  const k1=sceneIdx(t);if(autoStop&&k1>k0&&k1!==passK){t=S[k1]-.02;setPlay(false);passK=k1}}
 frame();updUI();scrub.value=t;tc.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
 requestAnimationFrame(loop)}
function setPlay(v){playing=v;playB.textContent=v?'❚❚ 일시정지':'▶ 재생'}
playB.onclick=()=>{if(t>=END)t=0;setPlay(!playing)};
document.getElementById('restart').onclick=()=>{t=0;passK=-1;setPlay(true)};
const jump=d=>{const k=sceneIdx(t);const nk=clamp(k+d,0,S.length-2);t=S[nk]+.01;passK=-1};
document.getElementById('prev').onclick=()=>jump(t-S[sceneIdx(t)]>1?0:-1);
document.getElementById('next').onclick=()=>jump(1);
scrub.oninput=()=>{t=+scrub.value;passK=-1};
const mid=document.getElementById('lvMid'),uni=document.getElementById('lvUni');
function setLv(l){level=l;mid.setAttribute('aria-pressed',l==='mid');uni.setAttribute('aria-pressed',l==='uni')}
mid.onclick=()=>setLv('mid');uni.onclick=()=>setLv('uni');
const sqB=document.getElementById('sq');if(sqB)sqB.remove();
const spB=document.getElementById('spd');const sps=[1,.75,.5,1.5];let si=0;spB.onclick=()=>{si=(si+1)%sps.length;speed=sps[si];spB.textContent=`속도 ${speed}×`};
document.getElementById('fs').onclick=()=>{const r=stage.requestFullscreen&&stage.requestFullscreen();if(r&&r.catch)r.catch(()=>{});setTimeout(resize,200)};
document.addEventListener('fullscreenchange',()=>setTimeout(resize,100));
document.getElementById('rec').onclick=()=>document.body.classList.toggle('rec');
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.key!==' ')return;
 if(e.key===' '){e.preventDefault();playB.click()}else if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);else if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec')});

const scBox=document.getElementById('scenes');scBox.style.gridTemplateColumns='repeat(auto-fit,minmax(110px,1fr))';
const scBtns=SHORT.map((lab,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="n">SCENE 0${i+1}</span><span class="l">${lab}</span>`;b.onclick=()=>goScene(i);scBox.appendChild(b);return b});
function goScene(i){t=S[i]+.01;passK=-1;setPlay(true)}
const sTag=document.getElementById('sTag'),sTitle=document.getElementById('sTitle'),sNow=document.getElementById('sNow'),sTip=document.getElementById('sTip'),sAll=document.getElementById('sAll');
function buildAll(){sAll.innerHTML='';SCRIPT[level].forEach((o,i)=>{const li=document.createElement('li');li.innerHTML=`<b>${TXT[level].scenes[i]}</b><br>${o.s}`;li.onclick=()=>goScene(i);sAll.appendChild(li)})}
function updUI(){const k=sceneIdx(t);if(k===uiK&&level===uiLv)return;if(level!==uiLv)buildAll();uiK=k;uiLv=level;
 scBtns.forEach((b,i)=>b.setAttribute('aria-current',i===k));[...sAll.children].forEach((li,i)=>li.classList.toggle('on',i===k));
 const o=SCRIPT[level][k];sTag.textContent=`SCENE 0${k+1} · ${level==='mid'?'중학생 수준':'대학 수준'} 대본`;sTitle.textContent=TXT[level].scenes[k];sNow.textContent=o.s;sTip.textContent='강의 팁 · '+o.tip}
const autoB=document.getElementById('auto');autoB.onclick=()=>{autoStop=!autoStop;autoB.setAttribute('aria-pressed',autoStop)};
document.getElementById('copy').onclick=function(){const all=SCRIPT[level].map((o,i)=>`[장면 ${i+1}] ${TXT[level].scenes[i]}\n${o.s}\n(팁) ${o.tip}`).join('\n\n');const btn=this;
 const fb=()=>{const ta=document.createElement('textarea');ta.value=all;btn.parentNode.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(all).then(()=>{btn.textContent='복사됨'},()=>{fb();btn.textContent='복사됨'})}else{fb();btn.textContent='복사됨'}
 setTimeout(()=>btn.textContent='전체 대본 복사',1800)};
requestAnimationFrame(loop);
})();
</script>
