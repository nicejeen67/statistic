<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>막대그래프가 만들어지는 과정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 도면 모눈 바탕. 무대 = 자치구별 가로 레인(점 → 평균 → 막대 → 정렬) */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#16233a; --muted:#5b6678; --line:#d9dfe8; --gridc:#e6eaf0;
  --c1:#1f4e8c; --c2:#138a83; --c3:#d98a1c; --c4:#b8506a; --soft:#e8eef6;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --paper:#162030; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2a3648; --gridc:#1c2738;
  --c1:#6aa0e8; --c2:#3cc0b6; --c3:#f0aa48; --c4:#e07f97; --soft:#1d2a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --paper:#162030; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2a3648; --gridc:#1c2738;
  --c1:#6aa0e8; --c2:#3cc0b6; --c3:#f0aa48; --c4:#e07f97; --soft:#1d2a3d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1080px;margin:0 auto;padding-block:36px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;color:var(--c2);text-transform:uppercase}
h1{font-size:clamp(26px,4vw,38px);line-height:1.25;margin:4px 0 8px;text-wrap:balance}
h1 span{color:var(--c1)}
.lede{margin:0;color:var(--muted);max-width:68ch}
.lv{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lv button{border:none;border-radius:0;padding:6px 14px}
.lv button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stagebar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.phase{font-weight:700;font-size:17px}
.phase .k{font:500 13px var(--mono);color:var(--c3);margin-right:8px}
canvas{display:block;width:100%;height:500px}
@media (max-width:560px){canvas{height:520px}}
.caption{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--soft);min-height:66px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp>span{font:500 12px var(--mono);color:var(--muted);margin-right:2px}
button,select{appearance:none;font:500 14px var(--sans);padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.pri{background:var(--c1);border-color:var(--c1);color:#fff;min-width:96px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
select{padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.scrub{display:flex;gap:10px;align-items:center;flex:1 1 240px;min-width:0}
.scrub input{flex:1;min-width:0;accent-color:var(--c1)}
.scrub output{font:12px var(--mono);color:var(--muted);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.steps li{min-width:0}
.steps button{width:100%;text-align:left;display:grid;gap:2px;padding:10px 12px;font-weight:400;height:100%}
.steps button b{font:500 12px var(--mono);color:var(--c3)}
.steps button strong{font-weight:500}
.steps button small{color:var(--muted);font-size:12.5px;line-height:1.45}
.steps button.on{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:17px;margin:0 0 6px}
.panel p{margin:0}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:380px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:500 11.5px var(--mono);color:var(--muted);background:var(--soft)}
td.big{color:var(--c4);font-weight:500}
.pc{display:grid;gap:12px}
.pc-head h2{font-size:clamp(20px,2.4vw,24px);margin:0}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.pc-col{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.pc-col h3{margin:0;padding:10px 16px;font-size:16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.pc-col.pro h3{color:var(--c2)}.pc-col.con h3{color:var(--c4)}
.pc-col .mk{font:700 15px var(--mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--paper)}
.pc-col.pro .mk{background:var(--c2)}.pc-col.con .mk{background:var(--c4)}
.pc-col ol{list-style:none;margin:0;padding:4px 16px 12px;display:grid}
.pc-col li{padding:10px 0;border-bottom:1px dashed var(--line);display:grid;gap:3px}
.pc-col li:last-child{border-bottom:none}
.pc-col li strong{font-weight:500}
.pc-col li p{margin:0;font-size:14px;color:var(--muted)}
.pc-col li .ex{font-size:13px}
.pc-col li .ex b{font-weight:500;color:var(--c1)}
.pc-tip{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted)}
.vs{display:grid;gap:12px}
.vs h2{font-size:clamp(20px,2.4vw,24px);margin:0}
.vs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.vs-fig{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px;min-width:0;display:grid;gap:6px}
.vs-fig figcaption{display:flex;gap:8px;align-items:baseline}
.vs-fig figcaption b{font-size:17px}
.vs-fig figcaption span{font:12px var(--mono);color:var(--muted)}
.vs-fig svg{width:100%;height:auto;display:block}
.vs-tbl{min-width:520px;background:var(--paper)}
.vs-tbl td,.vs-tbl th{text-align:left;vertical-align:top}
.vs-tbl td:first-child{font-weight:500;white-space:nowrap}
.vs-tbl td{font-variant-numeric:normal}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">AI부동산통계기초 · 그래프 도감 05 · 비교</div>
    <h1>막대그래프가 <span>만들어지는 과정</span></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="stage">
    <div class="stagebar"><div class="phase" id="phase" aria-live="polite"></div>
      <div class="lv" role="group" aria-label="설명 수준"><button type="button" id="lvE" aria-pressed="true">쉬운 설명</button><button type="button" id="lvU" aria-pressed="false">전공 설명</button></div></div>
    <canvas id="cv" role="img" aria-label="자치구별 거래가가 모여 평균 막대그래프가 되는 애니메이션"></canvas>
    <div class="caption" id="caption"></div>
  </div>

  <div class="controls">
    <div class="grp"><button class="pri" id="play" type="button">일시정지</button><button id="restart" type="button">처음부터</button></div>
    <div class="grp"><span>속도</span><select id="speed" aria-label="재생 속도"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></div>
    <div class="grp seg" role="group" aria-label="대표값"><span>대표값</span><button id="aMean" type="button" aria-pressed="true">평균</button><button id="aMed" type="button" aria-pressed="false">중앙값</button></div>
    <div class="grp"><button id="resample" type="button">새 표본 뽑기</button></div>
    <div class="scrub"><input type="range" id="scrub" min="0" max="19" step="0.01" value="0" aria-label="재생 위치"><output id="tout">0.0초</output></div>
  </div>

  <ol class="steps" id="steps"></ol>

  <div class="two">
    <div class="panel">
      <h2>막대 뒤에 숨은 숫자</h2>
      <p class="note" id="tblNote"></p>
      <div class="tbl"><table><thead><tr><th>자치구</th><th>거래 수</th><th>평균</th><th>중앙값</th><th>최저</th><th>최고</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </div>

  <section class="vs" aria-labelledby="vsTitle">
    <h2 id="vsTitle">막대그래프와 히스토그램, 무엇이 다를까?</h2>
    <p class="note" id="vsLede"></p>
    <div class="vs-grid">
      <figure class="vs-fig"><figcaption><b>막대그래프</b><span>Bar Chart · 비교</span></figcaption><div id="svgBar"></div></figure>
      <figure class="vs-fig"><figcaption><b>히스토그램</b><span>Histogram · 분포</span></figcaption><div id="svgHist"></div></figure>
    </div>
    <div class="tbl"><table class="vs-tbl"><thead><tr><th>구분</th><th>막대그래프</th><th>히스토그램</th></tr></thead><tbody id="vsBody"></tbody></table></div>
    <p class="pc-tip" id="vsTip"></p>
  </section>

  <section class="pc" aria-labelledby="pcTitle">
    <div class="pc-head"><h2 id="pcTitle">막대그래프를 쓸 때의 장점과 단점</h2></div>
    <div class="pc-grid">
      <div class="pc-col pro"><h3><span class="mk">+</span>장점</h3><ol id="proList"></ol></div>
      <div class="pc-col con"><h3><span class="mk">−</span>단점</h3><ol id="conList"></ol></div>
    </div>
    <p class="pc-tip" id="pcTip"></p>
  </section>
  <p class="note">※ 거래가는 설명용으로 생성한 예시 값이며 실제 자치구 시세가 아닙니다. 위 설명 수준 버튼으로 페이지 전체의 설명이 바뀝니다.</p>
</div>

<script>
(function(){
const GU=[['강남',25],['서초',23],['송파',18],['성동',15],['마포',14],['노원',6.5]];
const K=6,XMAX=40,TOTAL=19,CUT=5;
const T2=1.6,T3=4.0,T4=6.5,T5=8.8,T6=10.4,T7=12.2,T8=16.8;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const lerp=(a,b,p)=>a+(b-a)*p;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MONO='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace',SANS='"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif';
const f1=v=>v.toFixed(1);

let seed=5060,recs=[],perm=[],G=[],aggMode='mean',cur=[],t=0,playing=true,speed=1,L={},lastPhase=-1,lv='e';
try{const v=localStorage.getItem('barLv');if(v==='e'||v==='u')lv=v}catch(e){}
function sample(){const R=rng(seed),nrm=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  recs=[];GU.forEach(([n,m],g)=>{for(let k=0;k<K;k++)recs.push({g,k,v:Math.round(clamp(Math.exp(Math.log(m)+.17*nrm()),2,XMAX-1)*10)/10,j:R()*2-1})});
  // 강남에 초고가 1건 (평균과 중앙값 차이를 보여주기 위함)
  const top=recs.find(r=>r.g===0&&r.k===0);top.v=Math.round((36+R()*2.5)*10)/10;
  perm=recs.map((_,i)=>i);for(let i=perm.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
  G=GU.map(([n],g)=>{const a=recs.filter(r=>r.g===g).map(r=>r.v).sort((x,y)=>x-y);return{n,a,mean:a.reduce((s,v)=>s+v,0)/a.length,median:(a[2]+a[3])/2,min:a[0],max:a[a.length-1]}});
  cur=G.map(x=>x[aggMode]);
  $('tbody').innerHTML=[...G].sort((a,b)=>b.mean-a.mean).map(x=>`<tr><td>${x.n}</td><td>${x.a.length}건</td><td class="${x.mean-x.median>1.5?'big':''}">${f1(x.mean)}</td><td>${f1(x.median)}</td><td>${f1(x.min)}</td><td>${f1(x.max)}</td></tr>`).join('')}
const agg=g=>G[g][aggMode];
function order(){return G.map((_,g)=>g).sort((a,b)=>cur[b]-cur[a])}

function layout(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,narrow=W<560,l=narrow?52:70,rr=narrow?44:70,top=44,bot=H-56;
  L={W,H,narrow,l,rr,top,bot,plotW:W-l-rr,laneH:(bot-top)/GU.length,cols:narrow?4:6,fs:narrow?10.5:12}}
let axisMin=0;
const X=v=>L.l+(v-axisMin)/(XMAX-axisMin)*L.plotW;
const gridPos=p=>{const c=L.cols,cw=L.plotW/c,rows=Math.ceil(recs.length/c),rh=Math.min(34,(L.bot-L.top)/rows);return{x:L.l+(p%c+.5)*cw,y:L.top+16+Math.floor(p/c)*rh}};
function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function draw(){
  const C={ink:col('--ink'),muted:col('--muted'),line:col('--line'),c1:col('--c1'),c2:col('--c2'),c3:col('--c3'),c4:col('--c4'),paper:col('--paper'),soft:col('--soft')};
  const{W,H,l,top,bot,laneH,plotW,fs}=L;ctx.clearRect(0,0,W,H);
  const txt=(s,x,y,color,font,align='center',a=1)=>{if(a<=0)return;ctx.globalAlpha=a;ctx.fillStyle=color;ctx.font=font;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.globalAlpha=1};
  const ln=(x1,y1,x2,y2,color,w=1,dash=null,a=1)=>{if(a<=0)return;ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;ctx.globalAlpha=1};
  // 축 자르기 진행도
  const cutIn=ease(clamp((t-T7-.3)/1)),cutOut=ease(clamp((t-T7-3.3)/1));const cutP=cutIn*(1-cutOut);axisMin=CUT*cutP;
  const a0=clamp(t/.5);
  // 레인 순서(정렬)
  const ord=order(),ps=ease(clamp((t-T5)/1.2));const laneIdx=g=>lerp(g,ord.indexOf(g),ps);const laneY=g=>top+(laneIdx(g)+.5)*laneH;
  txt(t<T2?'원자료: 자치구 6곳의 아파트 거래 36건 (단위: 억원)':`자치구별 아파트 ${aggMode==='mean'?'평균':'중앙값'} 매매가`,l,22,C.muted,`500 12px ${SANS}`,'left',a0);
  // 레인·축
  const pa=clamp((t-T2+.2)/.6);
  if(pa>0){G.forEach((g,gi)=>{const y=laneY(gi);txt(g.n,l-10,y+4,C.ink,`500 ${L.narrow?12:13}px ${SANS}`,'right',pa);ln(l,y+laneH/2,l+plotW,y+laneH/2,C.line,1,null,pa*.5)});
    for(let v=0;v<=XMAX;v+=5){if(v<axisMin-1e-6)continue;const x=X(v);ln(x,top,x,bot,C.line,1,null,pa*.8);txt(v,x,bot+16,C.muted,`10px ${MONO}`,'center',pa)}
    // 기준선(0 또는 잘린 시작점)
    ln(X(axisMin),top-4,X(axisMin),bot+4,cutP>.05?C.c4:C.ink,cutP>.05?2.5:1.5,null,pa);
    if(cutP>.05)txt(`축 시작 ${f1(axisMin)}억`,X(axisMin)+4,bot+32,C.c4,`700 11px ${SANS}`,'left',cutP);
    txt('매매가(억원)',l+plotW,bot+32,C.muted,`10px ${MONO}`,'right',pa*(1-cutP))}
  // 막대
  const pb=t>=T4;
  if(pb){const winner=ord[0],pH=clamp((t-T6)/.8);
    G.forEach((g,gi)=>{const grow=ease(clamp((t-T4-gi*.15)/.8)),y=laneY(gi),bh=laneH*.56;
      const v=cur[gi],x0=X(axisMin),x1=lerp(x0,X(Math.max(v,axisMin)),grow);
      ctx.fillStyle=gi===winner&&pH>0?C.c3:C.c1;ctx.globalAlpha=.9;ctx.fillRect(x0,y-bh/2,Math.max(0,x1-x0),bh);ctx.globalAlpha=1;
      if(pH>0)txt(`${f1(v)}억`,x1+6,y+4,gi===winner?C.c3:C.ink,`700 ${L.narrow?11:12.5}px ${MONO}`,'left',pH*grow)})}
  // 7단계: 왜곡 설명 상자
  if(cutP>.05){const lo=G[ord[ord.length-1]],hi=G[ord[0]],ci=cur[ord[0]],cl=cur[ord[ord.length-1]];
    const real=ci/cl,shown=(ci-CUT)/Math.max(.1,cl-CUT);
    const bx=l+plotW*.42,by=top+laneH*3.4,bw=Math.min(330,plotW*.58),bh=58;
    ctx.globalAlpha=.95*cutP;ctx.fillStyle=C.paper;ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle=C.c4;ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);ctx.lineWidth=1;ctx.globalAlpha=1;
    txt(`실제 차이: ${hi.n} ÷ ${lo.n} = ${real.toFixed(1)}배`,bx+12,by+22,C.ink,`500 13px ${SANS}`,'left',cutP);
    txt(`눈에 보이는 막대 길이 차이: ${shown.toFixed(1)}배`,bx+12,by+44,C.c4,`700 13px ${SANS}`,'left',cutP)}
  // 개별 거래 (칩 → 점)
  const dotFade=t>=T4?lerp(1,.22,clamp((t-T4-.5)/.8)):1, dotGone=clamp((t-T6)/.8);
  recs.forEach((r,i)=>{const pp=perm.indexOf(i),gp=gridPos(pp),tr=T2+pp*.03,p=ease(clamp((t-tr)/.8));
    const y=laneY(r.g)+r.j*laneH*.22,x=X(r.v);
    if(p<=0){txt(`${G[r.g].n} ${f1(r.v)}`,gp.x,gp.y,C.ink,`${fs}px ${MONO}`,'center',a0);return}
    if(p<1){const cx=lerp(gp.x,x,p),cy=lerp(gp.y,y,p);txt(`${G[r.g].n} ${f1(r.v)}`,cx,cy+4,C.c3,`500 ${fs}px ${MONO}`,'center',1-p);

  bins.forEach((c,i)=>{s+=`<rect x="${X(i*bw0)}" y="${Y(c)}" width="${X(bw0)-X(0)}" height="${b-Y(c)}" style="fill:var(--c2);stroke:var(--paper);stroke-width:1"/>`});
  for(let v=0;v<=30;v+=6)s+=`<text x="${X(v)}" y="${b+14}" text-anchor="middle" style="font:9.5px var(--mono);fill:var(--ink)">${v}</text>`;
  const jx=X(9);s+=`<circle cx="${jx}" cy="${Y(6)}" r="9" style="fill:none;stroke:var(--c4);stroke-width:2"/><path d="M${jx+8},${Y(6)-6} L${jx+50},${Y(12)}" style="stroke:var(--c4);fill:none"/><text x="${jx+52}" y="${Y(12)+3}" style="font:700 10.5px var(--sans);fill:var(--c4)">막대가 딱 붙어 있음</text>`;
  s+=`<text x="${(l+W)/2}" y="${H-6}" text-anchor="middle" style="font:700 10.5px var(--sans);fill:var(--c4)">가로축 = 숫자 구간(억원) · 순서 고정</text>`;
  s+=`<text x="${l-30}" y="${top-14}" style="font:10px var(--sans);fill:var(--muted)">거래 건수</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="아파트 매매가 히스토그램">${s}</svg>`}
const VS={
 lede:{e:'둘 다 막대로 그리지만, 하는 일이 완전히 다릅니다. 막대그래프는 "어느 구가 더 비싼가"를 비교하고, 히스토그램은 "가격이 어디에 몰려 있나"를 보여줍니다.',
       u:'형태는 유사하지만 부호화하는 변수의 척도와 목적이 다릅니다. 막대그래프는 범주형 변수 수준별 집계값의 비교, 히스토그램은 단일 연속형 변수의 분포 추정에 쓰입니다.'},
 rows:[
  ['가로축',{e:'이름(강남, 서초…)',u:'명목·서열 척도의 범주'},{e:'숫자 구간(5~8억, 8~11억…)',u:'연속형 변수의 계급 구간(bin)'}],
  ['막대 사이',{e:'빈틈이 있음',u:'간격 있음 → 범주가 서로 독립임을 표현'},{e:'딱 붙어 있음',u:'인접 → 값이 연속됨을 표현'}],
  ['순서',{e:'긴 순서로 바꿔도 됨',u:'명목 범주는 값 기준 정렬 가능'},{e:'바꾸면 안 됨',u:'구간 순서가 곧 수직선이므로 고정'}],
  ['막대 높이',{e:'평균 같은 대표값',u:'임의의 집계값(빈도, 평균, 합계 등)'},{e:'그 구간의 거래 건수',u:'도수 또는 밀도(도수 ÷ (n × 구간 폭))'}],
  ['막대 폭',{e:'의미 없음(보기 좋게)',u:'시각적 요소일 뿐 정보 없음'},{e:'구간의 크기',u:'계급 폭. 바꾸면 분포 모양이 달라짐'}],
  ['답하는 질문',{e:'어디가 더 큰가?',u:'집단 간 비교(comparison)'},{e:'값이 어떻게 퍼져 있나?',u:'분포 형태(distribution): 중심, 퍼짐, 왜도, 봉우리'}],
  ['부동산 예',{e:'자치구별 평균 매매가',u:'자치구별 평균 매매가, 주택유형별 거래 건수'},{e:'서울 아파트 매매가 분포',u:'아파트 매매가·전용면적·준공연수의 분포'}]],
 tip:{e:'<b>헷갈릴 때 확인법:</b> 가로축에 <b>글자</b>가 있으면 막대그래프, <b>숫자</b>가 이어져 있으면 히스토그램입니다.',
      u:'<b>판별 기준:</b> 가로축 변수가 범주형이면 막대그래프, 연속형을 구간화한 것이면 히스토그램입니다. 주택유형별 거래 건수처럼 범주의 빈도를 센 막대도 히스토그램이 아니라 (빈도) 막대그래프입니다.'}};
function renderVS(){$('vsLede').textContent=VS.lede[lv];$('svgBar').innerHTML=vsSvgBar();$('svgHist').innerHTML=vsSvgHist();
  $('vsBody').innerHTML=VS.rows.map(([k,a,b])=>`<tr><td>${k}</td><td>${a[lv]}</td><td>${b[lv]}</td></tr>`).join('');$('vsTip').innerHTML=VS.tip[lv]}
function renderText(){$('lede').textContent=LEDE[lv];renderVS();
  $('tblNote').textContent=lv==='e'?'막대에는 평균 하나만 나오지만, 실제로는 이런 숫자들이 숨어 있습니다. 빨간 숫자는 평균과 중앙값 차이가 큰 곳입니다.':'막대 하나가 요약하는 집단별 기술통계량입니다. 빨간 값은 평균이 중앙값보다 1.5억 이상 큰 집단(이상치 영향)입니다.';
  const item=o=>`<li><strong>${o.t}</strong><p>${lv==='e'?o.e:o.u}</p><span class="ex">예: ${o.x}</span></li>`;
  $('proList').innerHTML=PC.pro.map(item).join('');$('conList').innerHTML=PC.con.map(item).join('');$('pcTip').innerHTML=PC.tip[lv];
  $('lvE').setAttribute('aria-pressed',lv==='e');$('lvU').setAttribute('aria-pressed',lv==='u');lastPhase=-1}
function phaseIdx(){let p=0;STEPS.forEach((s,i)=>{if(t>=s.t)p=i});return p}
function ui(){const p=phaseIdx();
  if(p!==lastPhase){lastPhase=p;$('phase').innerHTML=`<span class="k">${p+1}/${STEPS.length}</span>${STEPS[p].n}`;$('caption').textContent=p===7?finalMsg():STEPS[p][lv];
    [...$('steps').querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',i===p))}
  $('scrub').value=t;$('tout').textContent=t.toFixed(1)+'초';$('play').textContent=playing?'일시정지':(t>=TOTAL?'다시 재생':'재생')}
let prev=performance.now();
function frame(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;if(playing){t+=dt*speed;if(t>=TOTAL){t=TOTAL;playing=false}}
  G.forEach((g,i)=>{const tg=g[aggMode];cur[i]=Math.abs(cur[i]-tg)<.005?tg:lerp(cur[i],tg,.08)});
  draw();ui();requestAnimationFrame(frame)}
function setAgg(m){aggMode=m;$('aMean').setAttribute('aria-pressed',m==='mean');$('aMed').setAttribute('aria-pressed',m==='median');lastPhase=-1}

$('steps').innerHTML=STEPS.map((s,i)=>`<li><button type="button" id="st${i}"><b>${i+1}단계</b><strong>${s.n}</strong><small>${s.s}</small></button></li>`).join('');
STEPS.forEach((s,i)=>$('st'+i).onclick=()=>{t=s.t;playing=true;lastPhase=-1});
$('play').onclick=()=>{if(t>=TOTAL)t=0;playing=!playing;lastPhase=-1};
$('restart').onclick=()=>{t=0;playing=true;lastPhase=-1};
$('speed').onchange=e=>speed=+e.target.value;
$('aMean').onclick=()=>setAgg('mean');$('aMed').onclick=()=>setAgg('median');
$('resample').onclick=()=>{seed+=19;sample();t=0;playing=true;lastPhase=-1};
$('scrub').oninput=e=>{t=+e.target.value;playing=false;lastPhase=-1};
$('lvE').onclick=()=>{lv='e';try{localStorage.setItem('barLv',lv)}catch(e){}renderText()};
$('lvU').onclick=()=>{lv='u';try{localStorage.setItem('barLv',lv)}catch(e){}renderText()};
window.addEventListener('resize',layout);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
sample();layout();renderText();
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){t=TOTAL;playing=false}
requestAnimationFrame(frame);
})();
</script>
