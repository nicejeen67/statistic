<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>묶음 막대그래프가 만들어지는 과정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 도면 모눈 바탕. 무대 = 네모(거래 1천 건) 더미 → 유형별 기둥 → 연도별로 갈라진 막대 */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#16233a; --muted:#5b6678; --line:#d9dfe8; --gridc:#e6eaf0;
  --c1:#1f4e8c; --c2:#138a83; --c3:#d98a1c; --c4:#b8506a; --soft:#e8eef6; --gray:#a9b3c2;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --paper:#162030; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2a3648; --gridc:#1c2738;
  --c1:#6aa0e8; --c2:#3cc0b6; --c3:#f0aa48; --c4:#e07f97; --soft:#1d2a3d; --gray:#56637a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --paper:#162030; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2a3648; --gridc:#1c2738;
  --c1:#6aa0e8; --c2:#3cc0b6; --c3:#f0aa48; --c4:#e07f97; --soft:#1d2a3d; --gray:#56637a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1080px;margin:0 auto;padding-block:36px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;color:var(--c2);text-transform:uppercase}
h1{font-size:clamp(26px,4vw,38px);line-height:1.25;margin:4px 0 8px;text-wrap:balance}
h1 span{color:var(--c1)}
.lede{margin:0;color:var(--muted);max-width:68ch}
.lv{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lv button{border:none;border-radius:0;padding:6px 14px}
.lv button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stagebar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.phase{font-weight:700;font-size:17px}
.phase .k{font:500 13px var(--mono);color:var(--c3);margin-right:8px}
canvas{display:block;width:100%;height:500px}
@media (max-width:560px){canvas{height:500px}}
.caption{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--soft);min-height:66px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp>span{font:500 12px var(--mono);color:var(--muted);margin-right:2px}
button,select{appearance:none;font:500 14px var(--sans);padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.pri{background:var(--c1);border-color:var(--c1);color:#fff;min-width:96px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
select{padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.scrub{display:flex;gap:10px;align-items:center;flex:1 1 240px;min-width:0}
.scrub input{flex:1;min-width:0;accent-color:var(--c1)}
.scrub output{font:12px var(--mono);color:var(--muted);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.steps li{min-width:0}
.steps button{width:100%;text-align:left;display:grid;gap:2px;padding:10px 12px;font-weight:400;height:100%}
.steps button b{font:500 12px var(--mono);color:var(--c3)}
.steps button strong{font-weight:500}
.steps button small{color:var(--muted);font-size:12.5px;line-height:1.45}
.steps button.on{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:17px;margin:0 0 6px}
.panel p{margin:0}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:360px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:500 11.5px var(--mono);color:var(--muted);background:var(--soft)}
td.up{color:var(--c2);font-weight:500}td.dn{color:var(--c4);font-weight:500}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.mini figure{margin:0;display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.mini figcaption b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.mini svg{width:100%;height:auto;background:var(--soft);border-radius:6px}
.pc{display:grid;gap:12px}
.pc-head h2{font-size:clamp(20px,2.4vw,24px);margin:0}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.pc-col{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.pc-col h3{margin:0;padding:10px 16px;font-size:16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.pc-col.pro h3{color:var(--c2)}.pc-col.con h3{color:var(--c4)}
.pc-col .mk{font:700 15px var(--mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--paper)}
.pc-col.pro .mk{background:var(--c2)}.pc-col.con .mk{background:var(--c4)}
.pc-col ol{list-style:none;margin:0;padding:4px 16px 12px;display:grid}
.pc-col li{padding:10px 0;border-bottom:1px dashed var(--line);display:grid;gap:3px}
.pc-col li:last-child{border-bottom:none}
.pc-col li strong{font-weight:500}
.pc-col li p{margin:0;font-size:14px;color:var(--muted)}
.pc-col li .ex{font-size:13px}
.pc-col li .ex b{font-weight:500;color:var(--c1)}
.pc-tip{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">AI부동산통계기초 · 그래프 도감 06 · 비교</div>
    <h1>묶음 막대그래프가 <span>만들어지는 과정</span></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="stage">
    <div class="stagebar"><div class="phase" id="phase" aria-live="polite"></div>
      <div class="lv" role="group" aria-label="설명 수준"><button type="button" id="lvE" aria-pressed="true">쉬운 설명</button><button type="button" id="lvU" aria-pressed="false">전공 설명</button></div></div>
    <canvas id="cv" role="img" aria-label="주택유형별·연도별 거래가 모여 묶음 막대그래프가 되는 애니메이션"></canvas>
    <div class="caption" id="caption"></div>
  </div>

  <div class="controls">
    <div class="grp"><button class="pri" id="play" type="button">일시정지</button><button id="restart" type="button">처음부터</button></div>
    <div class="grp"><span>속도</span><select id="speed" aria-label="재생 속도"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></div>
    <div class="grp seg" role="group" aria-label="묶는 기준"><span>묶는 기준</span><button id="gType" type="button" aria-pressed="true">주택유형별</button><button id="gYear" type="button" aria-pressed="false">연도별</button></div>
    <div class="scrub"><input type="range" id="scrub" min="0" max="18.5" step="0.01" value="0" aria-label="재생 위치"><output id="tout">0.0초</output></div>
  </div>

  <ol class="steps" id="steps"></ol>

  <div class="two">
    <div class="panel">
      <h2>그래프에 쓰인 숫자</h2>
      <p class="note" id="tblNote"></p>
      <div class="tbl"><table><thead><tr><th>주택유형</th><th>2024</th><th>2025</th><th>증감</th><th>증감률</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
    <div class="panel">
      <h2>묶음 막대 vs 누적 막대</h2>
      <p class="note" id="miniNote"></p>
      <div class="mini" id="mini"></div>
    </div>
  </div>

  <section class="pc" aria-labelledby="pcTitle">
    <div class="pc-head"><h2 id="pcTitle">묶음 막대그래프를 쓸 때의 장점과 단점</h2></div>
    <div class="pc-grid">
      <div class="pc-col pro"><h3><span class="mk">+</span>장점</h3><ol id="proList"></ol></div>
      <div class="pc-col con"><h3><span class="mk">−</span>단점</h3><ol id="conList"></ol></div>
    </div>
    <p class="pc-tip" id="pcTip"></p>
  </section>
  <p class="note">※ 거래량은 설명용 예시 값(단위: 천 건)이며 실제 통계가 아닙니다. 위 설명 수준 버튼으로 페이지 전체의 설명이 바뀝니다.</p>
</div>

<script>
(function(){
const TYPES=['아파트','연립·다세대','오피스텔','단독·다가구'],YEARS=['2024','2025'];
const CNT=[[38,46],[22,18],[12,10],[9,8]]; // [유형][연도], 단위 천 건
const TOTAL=18.5,T2=1.6,T3=3.8,T3b=5.0,T4=7.0,T5=8.6,T6=11.0,T7=16.4;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const lerp=(a,b,p)=>a+(b-a)*p;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MONO='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace',SANS='"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif';

// 네모 하나 = 거래 1천 건
const units=[];CNT.forEach((r,ty)=>r.forEach((c,yr)=>{for(let k=0;k<c;k++)units.push({ty,yr})}));
const R=rng(2025);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pileOrder=shuffle(units.map((_,i)=>i));units.forEach((u,i)=>u.pile=pileOrder.indexOf(i));
// 유형 기둥 안의 순서(연도 섞임), 연도 기둥 안의 순서
TYPES.forEach((_,ty)=>{const mine=shuffle(units.filter(u=>u.ty===ty));mine.forEach((u,k)=>u.kT=k);YEARS.forEach((_,yr)=>units.filter(u=>u.ty===ty&&u.yr===yr).forEach((u,k)=>u.kY=k))});

let t=0,playing=true,speed=1,L={},lastPhase=-1,lv='e',grpUser=0,grpCur=0;
try{const v=localStorage.getItem('gbarLv');if(v==='e'||v==='u')lv=v}catch(e){}
function layout(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,narrow=W<560,l=narrow?40:56,rr=narrow?12:24,top=56,base=H-62,plotW=W-l-rr,plotH=base-top;
  const gw=plotW/4,bw=gw*.34,per=narrow?2:3,cell=Math.min(bw/per,plotH/(50/per)),vmax=50;
  L={W,H,narrow,l,rr,top,base,plotW,plotH,gw,bw,per,cell,vmax,hOf:v=>v/per*cell}}
function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

// 막대 위치: 유형별 묶음(m=0) / 연도별 묶음(m=1)
function barRect(ty,yr,m){const{l,base,gw,bw,plotW,hOf}=L;const h=hOf(CNT[ty][yr]);
  const gap=6,xT=l+gw*(ty+.5)+(yr?gap/2:-bw-gap/2);
  const gw2=plotW/2,bw2=Math.min(bw,gw2*.8/4-4),xY=l+gw2*(yr+.5)-(bw2*4+3*4)/2+ty*(bw2+4);
  return{x:lerp(xT,xY,m),w:lerp(bw,bw2,m),y:base-h,h}}

function draw(){
  const C={ink:col('--ink'),muted:col('--muted'),line:col('--line'),c1:col('--c1'),c2:col('--c2'),c3:col('--c3'),c4:col('--c4'),paper:col('--paper'),gray:col('--gray')};
  const YC=[C.c1,C.c3],TC=[C.c1,C.c2,C.c4,C.muted];
  const{W,H,l,top,base,plotW,gw,bw,per,cell,hOf}=L;ctx.clearRect(0,0,W,H);
  const txt=(s,x,y,color,font,align='center',a=1)=>{if(a<=0)return;ctx.globalAlpha=a;ctx.fillStyle=color;ctx.font=font;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.globalAlpha=1};
  const ln=(x1,y1,x2,y2,color,w=1,dash=null,a=1)=>{if(a<=0)return;ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;ctx.globalAlpha=1};
  const a0=clamp(t/.5);
  // 묶음 기준 진행도: 6단계 시연 중에는 시간표, 그 외에는 사용자 선택
  let m;if(t>=T6&&t<T7){m=ease(clamp((t-T6-.3)/1.2))*(1-ease(clamp((t-T6-4)/1.2)))}else m=grpCur;
  // 머리글
  txt(t<T2?'원자료: 거래 기록 163천 건이 섞여 있음':'주택유형별·연도별 거래량 (단위: 천 건)',l,24,C.muted,`500 12px ${SANS}`,'left',a0);
  ctx.globalAlpha=a0*(1-clamp((t-T4)/.6));ctx.fillStyle=C.gray;ctx.fillRect(W-L.rr-150,14,10,10);ctx.globalAlpha=1;txt('= 거래 1천 건',W-L.rr-136,23,C.muted,`11px ${SANS}`,'left',a0*(1-clamp((t-T4)/.6)));
  // 축·격자
  const pa=clamp((t-T2+.3)/.6);
  if(pa>0){ln(l,base,l+plotW,base,C.ink,1.5,null,pa);
    const ga=clamp((t-T4)/.8);for(let v=10;v<=50;v+=10){const y=base-hOf(v);ln(l,y,l+plotW,y,C.line,1,null,ga);txt(v,l-6,y+3,C.muted,`10px ${MONO}`,'right',ga)}
    if(ga>0){ctx.save();ctx.translate(14,(top+base)/2);ctx.rotate(-Math.PI/2);txt('거래량(천 건)',0,0,C.muted,`11px ${SANS}`,'center',ga);ctx.restore()}
    // 아래 이름표: 유형 ↔ 연도
    TYPES.forEach((n,ty)=>txt(n,l+gw*(ty+.5),base+18,C.ink,`500 ${L.narrow?10.5:12.5}px ${SANS}`,'center',pa*(1-m)));
    YEARS.forEach((y,yr)=>txt(y+'년',l+plotW/2*(yr+.5),base+18,C.ink,`700 13px ${SANS}`,'center',pa*m))}
  // 범례
  const lg=clamp((t-T3)/.6);
  if(lg>0){let x=l;const yy=42;const items=m<.5?YEARS.map((y,i)=>[y+'년',YC[i]]):TYPES.map((n,i)=>[n,TC[i]]);const la=lg*Math.abs(1-2*m);
    items.forEach(([s,c])=>{ctx.globalAlpha=la;ctx.fillStyle=c;ctx.fillRect(x,yy-9,11,11);ctx.globalAlpha=1;txt(s,x+15,yy,C.ink,`12px ${SANS}`,'left',la);ctx.font=`12px ${SANS}`;x+=ctx.measureText(s).width+32})}
  // ── 네모(거래 단위) 단계
  const mergeP=clamp((t-T4)/1);
  if(mergeP<1){const cols=L.narrow?13:24,cw=Math.min(18,plotW/cols),gx0=l+(plotW-cols*cw)/2;
    units.forEach((u,i)=>{
      const g={x:gx0+(u.pile%cols)*cw,y:top+18+Math.floor(u.pile/cols)*cw};
      const tp=T2+u.pile*.006,p1=ease(clamp((t-tp)/.8));
      const pc2=per*2,sx=l+gw*(u.ty+.5)-pc2*cell/2,s1={x:sx+(u.kT%pc2)*cell,y:base-(Math.floor(u.kT/pc2)+1)*cell};
      const r=barRect(u.ty,u.yr,0),s2={x:r.x+(u.kY%per)*(r.w/per),y:base-(Math.floor(u.kY/per)+1)*cell};
      const p2=ease(clamp((t-T3b-u.kT*.008)/.7));
      let x=lerp(g.x,s1.x,p1),y=lerp(g.y,s1.y,p1)-Math.sin(Math.PI*p1)*30;x=lerp(x,s2.x,p2);y=lerp(y,s2.y,p2);
      const pc=clamp((t-T3-u.kT*.01)/.3),gp=1.5*(1-mergeP);
      const w=lerp(lerp(cw,cell,p1),r.w/per,p2)-gp,h=lerp(cw,cell,p1)-gp;
      ctx.fillStyle=C.gray;ctx.fillRect(x,y,Math.max(1,w),Math.max(1,h));
      if(pc>0){ctx.globalAlpha=pc;ctx.fillStyle=YC[u.yr];ctx.fillRect(x,y,Math.max(1,w),Math.max(1,h));ctx.globalAlpha=1}})}
  // ── 막대 단계
  if(mergeP>0){TYPES.forEach((_,ty)=>YEARS.forEach((_,yr)=>{const r=barRect(ty,yr,m);
      // 색: 유형별 묶음이면 연도색, 연도별 묶음이면 유형색
      ctx.globalAlpha=mergeP*(1-m);ctx.fillStyle=YC[yr];ctx.fillRect(r.x,r.y,r.w,r.h);ctx.globalAlpha=mergeP*m;ctx.fillStyle=TC[ty];ctx.fillRect(r.x,r.y,r.w,r.h);ctx.globalAlpha=1;
      txt(CNT[ty][yr],r.x+r.w/2,r.y-6,C.ink,`700 ${L.narrow?10:12}px ${MONO}`,'center',clamp((t-T4-.6)/.5))}));
  }
  // ── 5단계: 변화 읽기
  const p5=clamp((t-T5)/.8)*(1-m)*(t>=T7?clamp(1-(t-T7)*0):1);
  if(p5>0)TYPES.forEach((n,ty)=>{const a=barRect(ty,0,0),b=barRect(ty,1,0),d=CNT[ty][1]-CNT[ty][0],pct=d/CNT[ty][0]*100,up=d>0;
    const y=Math.min(a.y,b.y)-24,x1=a.x+a.w/2,x2=b.x+b.w/2,cl=up?C.c2:C.c4,pi=clamp((t-T5-ty*.3)/.6)*p5;
    ln(x1,a.y-16,x1,y,cl,1.5,null,pi);ln(x1,y,x2,y,cl,1.5,null,pi);ln(x2,y,x2,b.y-16,cl,1.5,null,pi);
    txt(`${up?'+':''}${d}천 (${up?'+':''}${pct.toFixed(0)}%)`,(x1+x2)/2,y-6,cl,`700 ${L.narrow?10:12}px ${SANS}`,'center',pi)});
}

const STEPS=[
 {t:0,n:'원자료 준비',s:'거래 163천 건이 섞여 있음',e:'회색 네모 하나가 거래 1천 건입니다. 아파트, 빌라, 오피스텔, 단독주택 거래가 2024년, 2025년 것까지 모두 섞여 있습니다.',u:'관측 단위(거래)마다 두 개의 범주형 변수, 주택유형(4수준)과 연도(2수준)가 기록된 자료입니다. 네모 하나 = 1천 건으로 축약한 단위 차트(unit chart)로 표현했습니다.'},
 {t:T2,n:'주택유형별로 모으기',s:'첫 번째 기준으로 나누기',e:'거래를 주택유형별로 4개 기둥에 쌓습니다. 아직 연도는 섞여 있습니다. 이것만으로도 아파트 거래가 가장 많다는 것이 보입니다.',u:'첫 번째 범주 변수(주택유형)로 집단화합니다. 이 상태는 유형별 빈도 막대그래프(주변 빈도)와 같습니다.'},
 {t:T3,n:'연도별로 나누기',s:'두 번째 기준으로 색칠·분리',e:'네모를 연도에 따라 색칠하고(파랑 2024, 주황 2025), 한 기둥을 두 개로 나눠 나란히 세웁니다.',u:'두 번째 범주 변수(연도)로 각 집단을 다시 나누어 하위 막대를 나란히 배치합니다. 결과적으로 4 × 2 교차표의 각 칸이 막대 하나가 됩니다.'},
 {t:T4,n:'세어서 막대로',s:'네모 개수 = 막대 높이',e:'네모를 합쳐 막대로 만들고 위에 개수를 씁니다. 네모를 하나하나 셌던 것이 막대의 높이가 됩니다.',u:'단위를 합쳐 빈도를 막대 높이로 부호화하고 세로축 눈금을 붙입니다. 모든 막대가 공통 기준선 0을 공유하므로 길이 비교가 가능합니다.'},
 {t:T5,n:'변화 읽기',s:'짝지은 막대끼리 비교',e:'나란히 선 두 막대를 비교하면 1년 사이 무엇이 늘고 줄었는지 보입니다. 아파트만 늘었고 나머지는 모두 줄었습니다.',u:'묶음 막대의 핵심은 인접한 막대 간 비교입니다. 그룹 내 차이(절대 증감)와 상대 변화율을 함께 읽으면 아파트 거래 집중 현상이 드러납니다.'},
 {t:T6,n:'묶는 기준 바꾸기',s:'연도로 묶으면?',e:'같은 숫자를 이번에는 연도별로 묶어 봅니다. 그러면 "그 해에 어떤 주택이 많이 팔렸나"를 비교하는 그래프가 됩니다. 무엇으로 묶느냐에 따라 질문이 바뀝니다.',u:'묶는 변수와 색으로 구분하는 변수를 교환하면 같은 교차표라도 비교 초점이 달라집니다. 인접 비교가 가장 쉬우므로, 핵심 질문의 비교 대상을 서로 붙여 놓아야 합니다.'},
 {t:T7,n:'완성',s:'주택유형별 묶음 막대',e:'',u:''}];
function finalMsg(){return lv==='e'?'완성입니다. 주택유형별로 묶으면 "유형마다 1년 사이 어떻게 변했나"가 잘 보이고, 연도별로 묶으면 "그 해에는 어떤 유형이 많았나"가 잘 보입니다. 위의 "묶는 기준" 버튼으로 직접 바꿔 보세요.':'완성된 묶음 막대그래프입니다. 유형별 묶음은 연도 간 변화(그룹 내 비교)에, 연도별 묶음은 유형 간 구성 비교에 적합합니다. 전체 거래량 합계나 구성비를 강조하려면 누적 막대 또는 100% 누적 막대를 고려합니다.'}
const LEDE={e:'묶음 막대그래프는 두 가지 기준(예: 주택유형과 연도)을 한 번에 비교하는 그래프입니다. 거래 하나하나가 유형별로 모이고, 연도별로 나뉘어, 나란히 선 막대가 되는 과정을 보여줍니다.',u:'묶음 막대그래프(grouped/clustered bar chart)는 두 범주형 변수의 교차표를 표현합니다. 한 변수로 집단을 만들고 다른 변수의 수준을 인접 막대로 배치합니다. 단위 자료가 집단화, 하위 분할, 집계를 거쳐 그래프가 되는 과정을 보여줍니다.'};
const PC={
 pro:[
  {t:'두 기준을 한 번에 비교한다',e:'주택유형과 연도를 그래프 하나에 담아서, 표 두 장을 번갈아 볼 필요가 없습니다.',u:'2원 교차표를 한 화면에 부호화합니다. 하나의 범주 변수에 대한 막대그래프를 여러 장 그리는 것보다 비교가 빠릅니다.',x:'유형 4개 × 연도 2개 = <b>막대 8개</b>로 거래량 변화를 한 번에.'},
  {t:'나란히 선 막대끼리는 아주 정확하게 비교된다',e:'바로 옆에 붙은 두 막대는 같은 바닥에서 출발하기 때문에 작은 차이도 잘 보입니다.',u:'인접 막대는 공통 기준선을 공유하고 거리가 가까워 길이 비교 오차가 가장 작습니다. 그룹 내 비교가 핵심일 때 최적입니다.',x:'연립·다세대 <b>22 → 18</b>처럼 몇 천 건의 감소도 바로 보입니다.'},
  {t:'익숙한 막대그래프 그대로라 쉽다',e:'막대그래프를 아는 사람이면 따로 설명하지 않아도 읽을 수 있습니다.',u:'기본 막대그래프의 부호화 규칙(0 기준선, 길이=값)을 그대로 쓰므로 학습 부담이 적고 범례만 추가로 해석하면 됩니다.',x:'보도자료의 <b>"전년 대비 거래량"</b> 그림에 가장 많이 쓰입니다.'},
  {t:'묶는 방법으로 질문을 바꿀 수 있다',e:'유형별로 묶을지, 연도별로 묶을지에 따라 강조하고 싶은 내용을 고를 수 있습니다.',u:'집단 변수와 색상 변수를 교환해 비교 초점(그룹 내 변화 vs 그룹 간 구성)을 설계할 수 있습니다.',x:'위의 <b>"묶는 기준"</b> 버튼으로 두 그림을 바꿔 보세요.'}],
 con:[
  {t:'막대가 많아지면 금방 복잡해진다',e:'연도가 5개, 유형이 6개면 막대가 30개라 읽기 어려워집니다.',u:'하위 수준이 3~4개를 넘으면 범례 대조 부담이 커지고 패턴이 묻힙니다. 이때는 소형 다중 그래프(small multiples)나 선그래프가 적합합니다.',x:'<b>10년치</b> 연도별 거래량은 묶음 막대보다 선그래프로.'},
  {t:'떨어진 막대끼리는 비교가 어렵다',e:'옆에 붙은 막대는 비교가 쉽지만, 멀리 떨어진 같은 색 막대끼리는 비교하기 어렵습니다.',u:'비인접 막대의 비교는 정확도가 떨어집니다. 유형별 묶음에서 "2025년 오피스텔 vs 2025년 단독"처럼 다른 그룹의 같은 색 막대 비교가 해당됩니다.',x:'2025년 안에서의 유형 비교는 <b>연도별 묶음</b>이 낫습니다.'},
  {t:'전체 합계가 보이지 않는다',e:'유형별 막대만 있어서 "2025년 전체 거래가 늘었나?"는 따로 더해 봐야 알 수 있습니다.',u:'주변합(총계)이 직접 표시되지 않습니다. 총량과 구성을 함께 보려면 누적 막대그래프를 씁니다.',x:'전체 거래량 <b>81 → 82천 건</b> 같은 총계는 표나 누적 막대로.'},
  {t:'변화율은 머리로 계산해야 한다',e:'두 막대의 차이가 몇 %인지는 그림만으로 알기 어려워서 숫자를 따로 봐야 합니다.',u:'절대 차이는 보이지만 상대 변화율은 직접 부호화되지 않습니다. 변화율이 핵심이면 증감률 막대나 기울기 그래프(slope chart)를 고려합니다.',x:'아파트 +21%, 오피스텔 −17%는 <b>증감률 막대</b>로 따로 보여주면 명확합니다.'},
  {t:'색깔 구분에 기대야 한다',e:'흑백으로 인쇄하거나 색을 잘 구분하지 못하는 사람은 어느 막대가 어느 해인지 헷갈릴 수 있습니다.',u:'범례와 색상 구분에 의존하므로 흑백 인쇄, 색각 이상에 취약합니다. 명도 차이가 큰 색, 직접 라벨, 무늬를 함께 씁니다.',x:'인쇄용 보고서에서는 막대 위에 <b>"24", "25"</b> 라벨을 직접 붙이세요.'}],
 tip:{e:'<b>정리:</b> 묶음 막대그래프는 "두 가지 기준으로 나눠서 비교"할 때 씁니다. 가장 비교하고 싶은 두 막대가 서로 붙어 있도록 묶는 기준을 정하고, 막대가 너무 많아지면 선그래프로 바꾸세요.',
      u:'<b>권장 사용법:</b> ① 핵심 비교 대상을 인접 배치(묶는 변수 선택) ② 하위 수준은 2~4개 이내 ③ 기준선 0 준수 ④ 색각 이상을 고려한 색과 직접 라벨 ⑤ 총계가 중요하면 누적 막대, 변화율이 중요하면 증감률 막대나 slope chart 병행.'}};
function miniSvg(kind){const W=170,H=120,l=14,b=104,bw=12,mx=90;const Y=v=>b-v/mx*(b-12);let s=`<line x1="${l}" x2="${W-6}" y1="${b}" y2="${b}" style="stroke:var(--muted)"/>`;
  CNT.forEach((r,ty)=>{const gx=l+12+ty*38;if(kind==='g'){r.forEach((v,yr)=>s+=`<rect x="${gx+yr*(bw+2)}" y="${Y(v)}" width="${bw}" height="${b-Y(v)}" style="fill:${yr?'var(--c3)':'var(--c1)'}"/>`)}
    else{let acc=0;r.forEach((v,yr)=>{s+=`<rect x="${gx+4}" y="${Y(acc+v)}" width="${bw+4}" height="${b-Y(v)}" style="fill:${yr?'var(--c3)':'var(--c1)'}"/>`;acc+=v})}});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`}
const MINI={e:['나란히: 해마다 늘었는지 줄었는지 비교','쌓기: 두 해를 합친 전체 크기 비교'],u:['그룹 내 하위 범주 간 비교에 유리','총계(주변합)와 구성 비교에 유리, 위층 막대는 기준선이 달라 비교 어려움']};

function renderText(){$('lede').textContent=LEDE[lv];
  $('tbody').innerHTML=CNT.map((r,ty)=>{const d=r[1]-r[0],p=d/r[0]*100;return `<tr><td>${TYPES[ty]}</td><td>${r[0]}</td><td>${r[1]}</td><td class="${d>0?'up':'dn'}">${d>0?'+':''}${d}</td><td class="${d>0?'up':'dn'}">${d>0?'+':''}${p.toFixed(1)}%</td></tr>`}).join('')+`<tr><td><b>합계</b></td><td><b>${CNT.reduce((s,r)=>s+r[0],0)}</b></td><td><b>${CNT.reduce((s,r)=>s+r[1],0)}</b></td><td>+${CNT.reduce((s,r)=>s+r[1]-r[0],0)}</td><td></td></tr>`;
  $('tblNote').textContent=lv==='e'?'단위는 천 건입니다. 초록은 늘어난 것, 빨강은 줄어든 것입니다.':'주택유형 × 연도 2원 교차표(단위: 천 건)와 연도 간 증감입니다. 합계 행은 그래프에 직접 나타나지 않는 주변합입니다.';
  $('miniNote').textContent=lv==='e'?'같은 숫자를 막대를 옆으로 놓느냐, 위로 쌓느냐에 따라 보이는 것이 달라집니다.':'같은 교차표를 인접 배치(grouped)와 누적 배치(stacked)로 부호화한 비교입니다.';
  $('mini').innerHTML=`<figure>${miniSvg('g')}<figcaption><b>묶음 막대</b>${MINI[lv][0]}</figcaption></figure><figure>${miniSvg('s')}<figcaption><b>누적 막대</b>${MINI[lv][1]}</figcaption></figure>`;
  const item=o=>`<li><strong>${o.t}</strong><p>${lv==='e'?o.e:o.u}</p><span class="ex">예: ${o.x}</span></li>`;
  $('proList').innerHTML=PC.pro.map(item).join('');$('conList').innerHTML=PC.con.map(item).join('');$('pcTip').innerHTML=PC.tip[lv];
  $('lvE').setAttribute('aria-pressed',lv==='e');$('lvU').setAttribute('aria-pressed',lv==='u');lastPhase=-1}
function phaseIdx(){let p=0;STEPS.forEach((s,i)=>{if(t>=s.t)p=i});return p}
function ui(){const p=phaseIdx();
  if(p!==lastPhase){lastPhase=p;$('phase').innerHTML=`<span class="k">${p+1}/${STEPS.length}</span>${STEPS[p].n}`;$('caption').textContent=p===STEPS.length-1?finalMsg():STEPS[p][lv];
    [...$('steps').querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',i===p))}
  $('scrub').value=t;$('tout').textContent=t.toFixed(1)+'초';$('play').textContent=playing?'일시정지':(t>=TOTAL?'다시 재생':'재생')}
let prev=performance.now();
function frame(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;if(playing){t+=dt*speed;if(t>=TOTAL){t=TOTAL;playing=false}}
  grpCur=Math.abs(grpCur-grpUser)<.003?grpUser:lerp(grpCur,grpUser,.08);draw();ui();requestAnimationFrame(frame)}
function setGrp(v,jump){grpUser=v;$('gType').setAttribute('aria-pressed',v===0);$('gYear').setAttribute('aria-pressed',v===1);if(jump&&t<T4+1){t=T7;playing=false}lastPhase=-1}

$('steps').innerHTML=STEPS.map((s,i)=>`<li><button type="button" id="st${i}"><b>${i+1}단계</b><strong>${s.n}</strong><small>${s.s}</small></button></li>`).join('');
STEPS.forEach((s,i)=>$('st'+i).onclick=()=>{t=s.t;playing=true;lastPhase=-1;if(i<5){grpCur=0;setGrp(0)}});
$('play').onclick=()=>{if(t>=TOTAL)t=0;playing=!playing;lastPhase=-1};
$('restart').onclick=()=>{t=0;playing=true;grpCur=0;setGrp(0)};
$('speed').onchange=e=>speed=+e.target.value;
$('gType').onclick=()=>setGrp(0,true);$('gYear').onclick=()=>setGrp(1,true);
$('scrub').oninput=e=>{t=+e.target.value;playing=false;lastPhase=-1};
$('lvE').onclick=()=>{lv='e';try{localStorage.setItem('gbarLv',lv)}catch(e){}renderText()};
$('lvU').onclick=()=>{lv='u';try{localStorage.setItem('gbarLv',lv)}catch(e){}renderText()};
window.addEventListener('resize',layout);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
layout();renderText();
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){t=TOTAL;playing=false}
requestAnimationFrame(frame);
})();
</script>
