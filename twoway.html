<title>이원 교차분석 블록 도시</title>

<style>

:root{
  --bg:#eef4f6; --surface:#ffffff; --fg:#22314a; --muted:#5b6a80; --line:#cfdbe2;
  --accent:#1f9e89; --accent-2:#7a5af0; --soft:#dcf0ea;
  --display:"Jua","Gothic A1","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a24; --surface:#1b2633; --fg:#e8eef4; --muted:#9fb0c2; --line:#2e3d4e;
  --accent:#3cc2a8; --accent-2:#9c86ff; --soft:#173a33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a24; --surface:#1b2633; --fg:#e8eef4; --muted:#9fb0c2; --line:#2e3d4e;
  --accent:#3cc2a8; --accent-2:#9c86ff; --soft:#173a33; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:36px;line-height:1.15;text-wrap:balance}
.seg{display:inline-flex;background:var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{font:inherit;border:0;background:transparent;color:var(--fg);padding:7px 16px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 2px 8px rgba(34,49,74,.15)}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#e3eff4;border-radius:20px;overflow:hidden;box-shadow:0 14px 40px rgba(34,49,74,.18)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;min-width:96px;font-weight:700}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.btn:focus-visible,.seg button:focus-visible,.scenes button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:5px 8px}
.scrub{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px}
.scrub input{flex:1;min-width:0;accent-color:var(--accent)}
.time{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.scenes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.scenes button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:6px 10px;cursor:pointer;min-width:0}
.scenes .n{display:block;font-family:var(--display);font-size:15px;color:var(--accent);line-height:1.2}
.scenes .l{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scenes button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.scenes button[aria-current="true"] .n{color:#fff}
@media (max-width:760px){.scenes{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:28px}}

.script .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.script h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.25}
.now{margin:0;font-size:16px;line-height:1.85;max-width:72ch}
.tip{margin:0;font-size:14px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}
details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 16px}
summary{cursor:pointer;font-weight:700}
#sAll{margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:10px}

.foot{margin:0;font-size:13px;color:var(--muted)}

body.rec{background:#000}
body.rec .wrap>*:not(.stage){display:none!important}

body.rec .stage{width:min(100vw,177.78vh);border-radius:0;box-shadow:none}

<div class="wrap">
  <header class="top">
    <div><p class="eyebrow">AI 부동산 통계 기초 · 강의 영상 자료</p><h1>이원 교차분석 블록 도시</h1></div>

  <section class="script" aria-live="polite">

    <p class="now" id="sNow"></p>
    <p class="tip" id="sTip"></p>
  </section>

  <details><summary>전체 시나리오 보기</summary><ol id="sAll"></ol></details>

  <p class="foot">예시 데이터(응답자 300명의 연령대와 선호 주택유형)는 설명을 위해 만든 가상의 수치입니다. 기대빈도, χ², 자유도, p, 크라메르 V, 표준화잔차는 페이지 안에서 직접 계산합니다. 단축키: Space 재생/정지 · ←/→ 장면 이동 · H 녹화 모드</p>
</div>
<div class="hint" id="hint">H 키를 누르면 원래 화면으로 돌아옵니다</div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 데이터 (가상) : 행 = 연령대, 열 = 선호 주택유형 ---------- */

let moreN=0,lessN=0;O.forEach((r,i)=>r.forEach((o,j)=>{if(o>E[i][j])moreN++;else if(o<E[i][j])lessN++}));

function lnG(z){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let x=z,y=z,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)}
function gammq(a,x){if(x<=0)return 1;const gl=lnG(a);
 if(x<a+1){let ap=a,sum=1/a,del=sum;for(let n=0;n<300;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-14)break}return 1-sum*Math.exp(-x+a*Math.log(x)-gl)}
 let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<300;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-14)break}
 return Math.exp(-x+a*Math.log(x)-gl)*h}
const pOf=x=>gammq(df/2,x/2);
let lo=0,hi=100;for(let i=0;i<90;i++){const m=(lo+hi)/2;if(pOf(m)>.05)lo=m;else hi=m}const crit=(lo+hi)/2;
const pval=pOf(chi);
const dens=x=>x<=0?0:Math.exp((df/2-1)*Math.log(x)-x/2-(df/2)*Math.log(2)-lnG(df/2));
const f1=v=>v.toFixed(1),f2=v=>v.toFixed(2),f3=v=>v.toFixed(3);
const pTxt=pval<.001?'< .001':'= '+f3(pval);

/* ---------- 이름 ---------- */
const AGE=['청년','중년','장년'],AGES=['20–30대','40–50대','60대 이상'],TYP=['아파트','오피스텔','단독주택'];
const cellName=(i,j)=>`${AGE[i]}·${TYP[j]}`;
const rank=[];CT.forEach((r,i)=>r.forEach((v,j)=>rank.push({i,j,v})));rank.sort((a,b)=>b.v-a.v);

/* ---------- 색과 글꼴 ---------- */
const INK='#22314a',MUT='#5f6e84',WHITE='#ffffff',SKY1='#eaf4f8',SKY2='#cfe4ec',GROUND='#d9eadf',GROUND2='#c7ddcf',SLAB='#a9c4b4',MORE='#e2574c',LESS='#3d8bd8',GOLD='#f2c14e';

const ease=t=>t<.5?2*t*t:1-((-2*t+2)**2)/2;

const lerp=(a,b,m)=>a+(b-a)*m;

function shade(hex,f){const p=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));const q=f<=1?p.map(v=>v*f):p.map(v=>v+(255-v)*(f-1));return `rgb(${q.map(v=>Math.round(clamp(v,0,255))).join(',')})`}

/* ---------- 그리기 도구 ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function card(x,y,w,h,a,o={}){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.shadowColor='rgba(34,49,74,.20)';ctx.shadowBlur=26;ctx.shadowOffsetY=10;
 rr(x,y+(1-a)*14,w,h,o.r||20);ctx.fillStyle=o.fill||WHITE;ctx.fill();ctx.restore()}
function txt(s,x,y,o={}){const a=o.a==null?1:o.a;if(a<=0)return;const sz=o.sz||24;
 ctx.save();ctx.globalAlpha=a;ctx.font=`${o.w||500} ${sz}px ${o.f||BODY}`;ctx.fillStyle=o.c||INK;ctx.textAlign=o.al||'left';ctx.textBaseline=o.bl||'alphabetic';
 if(o.p!=null&&o.p<1){if(o.p<=0){ctx.restore();return}const W=ctx.measureText(s).width;const x0=o.al==='center'?x-W/2:o.al==='right'?x-W:x;ctx.beginPath();ctx.rect(x0-4,y-sz*1.3,W*o.p+6,sz*1.8);ctx.clip()}
 ctx.fillText(s,x,y);ctx.restore()}
function para(s,x,y,maxW,lh,o={}){ctx.save();ctx.font=`${o.w||500} ${o.sz||20}px ${o.f||BODY}`;const words=s.split(' ');const lines=[];let cur='';
 words.forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);ctx.restore();
 lines.forEach((l,i)=>txt(l,x,y+i*lh,o));return lines.length}
function line(x1,y1,x2,y2,o={}){const p=o.p==null?1:clamp(o.p),a=o.a==null?1:o.a;if(p<=0||a<=0)return;
 ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=o.c||INK;ctx.lineWidth=o.w||3;ctx.lineCap='round';if(o.dash)ctx.setLineDash(o.dash);
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p));ctx.stroke();ctx.restore()}
function pill(s,x,y,a,o={}){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font=`400 ${o.sz||22}px ${DISP}`;const w=ctx.measureText(s).width+34,h=(o.sz||22)+20;
 const X0=o.al==='right'?x-w:o.al==='center'?x-w/2:x;ctx.shadowColor='rgba(34,49,74,.22)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;rr(X0,y,w,h,h/2);ctx.fillStyle=o.fill||INK;ctx.fill();ctx.shadowColor='transparent';
 ctx.fillStyle=o.c||WHITE;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(s,X0+17,y+h/2+1);ctx.restore()}
function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1.4;ctx.stroke()}}

/* ---------- 아이소메트릭 ---------- */
const TW=150,TH=76,OX=440,OY=236,K=3.6; /* 한 사람 = 3.6px, 한 층(10명) = 36px */
const iso=(gx,gy,z=0)=>[OX+(gx-gy)*TW/2,OY+(gx+gy)*TH/2-z];
function box(x0,y0,w,d,z0,h,col,a=1,o={}){if(h<=.3||a<=0)return;ctx.save();ctx.globalAlpha=a;const z1=z0+h;
 const Lf=[iso(x0,y0+d,z0),iso(x0+w,y0+d,z0),iso(x0+w,y0+d,z1),iso(x0,y0+d,z1)];
 const Rf=[iso(x0+w,y0,z0),iso(x0+w,y0+d,z0),iso(x0+w,y0+d,z1),iso(x0+w,y0,z1)];
 const Tf=[iso(x0,y0,z1),iso(x0+w,y0,z1),iso(x0+w,y0+d,z1),iso(x0,y0+d,z1)];
 poly(Lf,shade(col,.86),INK,1.3);poly(Rf,shade(col,.68),INK,1.3);poly(Tf,shade(col,1.18),INK,1.3);
 if(o.floors){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.3;for(let f=36;f<h-3;f+=36){const zz=z0+f;ctx.beginPath();ctx.moveTo(...iso(x0,y0+d,zz));ctx.lineTo(...iso(x0+w,y0+d,zz));ctx.lineTo(...iso(x0+w,y0,zz));ctx.stroke()}
  ctx.fillStyle='rgba(255,255,255,.55)';for(let f=10;f<h-14;f+=36){for(let q=0;q<3;q++){const u=x0+w*(.2+q*.27);const p1=iso(u,y0+d,z0+f),p2=iso(u+w*.14,y0+d,z0+f),p3=iso(u+w*.14,y0+d,z0+f+14),p4=iso(u,y0+d,z0+f+14);poly([p1,p2,p3,p4],'rgba(255,255,255,.5)')}}}
 ctx.restore()}
function wire(x0,y0,w,d,h,col,a=1){if(a<=0||h<=0)return;ctx.save();ctx.globalAlpha=a;ctx.setLineDash([6,5]);ctx.strokeStyle=col;ctx.lineWidth=2;
 const T=[iso(x0,y0,h),iso(x0+w,y0,h),iso(x0+w,y0+d,h),iso(x0,y0+d,h)];poly(T,'rgba(255,255,255,.28)',col,2);
 [[x0,y0+d],[x0+w,y0+d],[x0+w,y0],[x0,y0]].forEach(([u,v],k)=>{ctx.globalAlpha=a*(k===3?.35:1);ctx.beginPath();ctx.moveTo(...iso(u,v,0));ctx.lineTo(...iso(u,v,h));ctx.stroke()});ctx.restore()}
const CX0=.2,CW=.6;
function board(a,L){if(a<=0)return;ctx.save();ctx.globalAlpha=a;const m=.28,th=18;
 const P=[iso(-m,-m),iso(3+m,-m),iso(3+m,3+m),iso(-m,3+m)];
 poly([P[3],P[2],[P[2][0],P[2][1]+th],[P[3][0],P[3][1]+th]],shade(SLAB,.92));poly([P[1],P[2],[P[2][0],P[2][1]+th],[P[1][0],P[1][1]+th]],shade(SLAB,.75));

 for(let i=0;i<3;i++)if(i%2===0)poly([iso(-m,i),iso(3+m,i),iso(3+m,i+1),iso(-m,i+1)],GROUND2);

 ctx.restore();

let hintT;function rec(){document.body.classList.toggle('rec');setTimeout(resize,50);const h=$('hint');if(document.body.classList.contains('rec')){h.classList.add('show');clearTimeout(hintT);hintT=setTimeout(()=>h.classList.remove('show'),2200)}else h.classList.remove('show')}
$('rec').onclick=rec;
function setLevel(lv){level=lv;$('lvMid').setAttribute('aria-pressed',lv==='mid');$('lvUni').setAttribute('aria-pressed',lv==='uni');scBtns.forEach((b,i)=>b.querySelector('.l').textContent=TX[lv].scenes[i]);uiK=-1;buildAll()}
$('lvMid').onclick=()=>setLevel('mid');$('lvUni').onclick=()=>setLevel('uni');
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);else if(e.key==='h'||e.key==='H'||e.key==='ㅗ')rec()});
function buildAll(){const ol=$('sAll');ol.innerHTML='';SCRIPT[level].forEach((o,i)=>{const li=document.createElement('li');li.innerHTML=`<b>${TX[level].scenes[i]}</b><br>${sv(o)}<br><small>강의 팁 · ${o.tip}</small>`;li.onclick=()=>goScene(i);ol.appendChild(li)})}
let uiK=-1;
function updUI(){const k=sceneIdx(T);$('scrub').value=T;const fm=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;$('time').textContent=`${fm(T)} / ${fm(END)}`;
 if(k===uiK)return;uiK=k;scBtns.forEach((b,i)=>b.setAttribute('aria-current',i===k));[...$('sAll').children].forEach((li,i)=>li.classList.toggle('on',i===k));
 const o=SCRIPT[level][k];$('sTag').textContent=`장면 ${k+1} / 7 · ${level==='mid'?'중학생 수준':'대학 수준'} 대본`;$('sTitle').textContent=TX[level].scenes[k];$('sNow').textContent=sv(o);$('sTip').textContent='강의 팁 · '+o.tip}
$('copy').onclick=function(){const all=SCRIPT[level].map((o,i)=>`[장면 ${i+1}] ${TX[level].scenes[i]}\n${sv(o)}\n(강의 팁) ${o.tip}`).join('\n\n');const btn=this;
 const fb=()=>{const ta=document.createElement('textarea');ta.value=all;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()};
 const done=()=>{btn.textContent='복사했습니다';setTimeout(()=>btn.textContent='전체 대본 복사',1800)};
 try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(all).then(done,()=>{fb();done()});else{fb();done()}}catch(e){fb();done()}};
buildAll();

/* ---------- 루프 ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(playing){let nt=T+dt*speed;const k=sceneIdx(T);
  if(nt>=END){nt=END-.001;setPlay(false)}
  else if(autoStop&&nt>=S[k+1]){nt=S[k+1]-.002;setPlay(false)}
  T=nt}
 frame();updUI();requestAnimationFrame(loop)}
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('400 24px "Jua"'),document.fonts.load('500 20px "Gothic A1"'),document.fonts.load('600 20px "IBM Plex Mono"')]).catch(()=>{})}
requestAnimationFrame(loop);
window.__STATS={chi,df,pval,crit,V,minE,moreN,lessN};
})();
</script>
