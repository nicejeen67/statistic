<title>선형회귀 사이버 스캔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: 16:9 cinematic stage (canvas, 1280x720 logical) + control strip below. Single dark "cyber HUD" look. */
:root{
  --bg:#03060c; --panel:#0a1322; --line:#18324d;
  --cyan:#38e8ff; --mag:#ff3fa4; --amber:#ffc24a;
  --fg:#d7f6ff; --dim:#6f8ea8;
  --f-display:'Orbitron','JetBrains Mono',ui-monospace,monospace;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);overflow:hidden}
.stage:fullscreen{border:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(160,240,255,.045) 0 1px,transparent 1px 3px)}
.vig{pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px}
.grp{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:8px 12px;cursor:pointer;border-radius:2px}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button[aria-pressed="true"]{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
#scrub{flex:1 1 200px;min-width:0;accent-color:var(--cyan)}
#tc{color:var(--dim);font-variant-numeric:tabular-nums;min-width:7ch}
.hint{color:var(--dim);font-size:12px;line-height:1.6;margin:0}
.hint b{color:var(--cyan);font-weight:400}
body.rec .controls,body.rec .hint,body.rec .script,body.rec .scenes{display:none}
.scenes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:640px){.scenes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.scenes button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;min-width:0}
.scenes button .n{font-family:var(--f-display);font-size:11px;color:var(--amber);letter-spacing:.08em}
.scenes button .l{font-family:var(--f-body);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.scenes button[aria-current="true"]{border-color:var(--cyan);background:rgba(56,232,255,.12);color:var(--cyan)}
.scenes button[aria-current="true"] .n{color:var(--cyan)}
.script{border:1px solid var(--line);background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.script .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.script .tag{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;color:var(--amber)}
.script h2{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
.script .now{margin:0;font-size:17px;line-height:1.85;max-width:70ch;color:var(--fg)}
.script .tip{margin:0;font-size:13px;color:var(--dim);line-height:1.6}
.script details{border-top:1px solid var(--line);padding-top:10px}
.script summary{cursor:pointer;color:var(--cyan);font-size:14px}
.script ol{margin:10px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px}
.script li{line-height:1.75;font-size:14px;max-width:75ch;cursor:pointer}
.script li b{color:var(--cyan)}
.script li.on{color:var(--cyan)}
.script textarea{position:absolute;left:-9999px}
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="scan"></div><div class="vig"></div>
  </div>
  <nav class="scenes" id="scenes" aria-label="장면 선택"></nav>
  <div class="controls">
    <div class="grp">
      <button id="auto" aria-pressed="true" title="각 장면이 끝나면 자동으로 멈춥니다">장면마다 멈춤</button>
      <button id="prev" title="이전 장면 (←)">◀◀</button>
      <button id="play" title="재생/일시정지 (Space)">❚❚ 일시정지</button>
      <button id="next" title="다음 장면 (→)">▶▶</button>
      <button id="restart">⟲ 처음부터</button>
    </div>
    <input type="range" id="scrub" min="0" max="46" step="0.01" value="0" aria-label="타임라인">
    <span id="tc">00:00</span>
    <div class="grp" role="group" aria-label="설명 수준">
      <button id="lvMid" aria-pressed="true">중학생 수준</button>
      <button id="lvUni" aria-pressed="false">대학 수준</button>
    </div>
    <div class="grp">
      <button id="sq" aria-pressed="true">잔차 제곱 ■</button>
      <button id="spd">속도 1×</button>
      <button id="fs">전체화면</button>
      <button id="rec">녹화 모드 (H)</button>
    </div>
  </div>
  <section class="script" aria-live="polite">
    <div class="head">
      <span class="tag" id="sTag">SCENE 01 · 설명 대본</span>
      <button id="copy">전체 대본 복사</button>
    </div>
    <h2 id="sTitle"></h2>
    <p class="now" id="sNow"></p>
    <p class="tip" id="sTip"></p>
    <details>
      <summary>전체 시나리오 보기 (항목을 누르면 그 장면으로 이동)</summary>
      <ol id="sAll"></ol>
    </details>
  </section>
  <p class="hint">녹화 모드에서는 아래 조작판이 사라집니다. <b>H</b> 키로 다시 표시 · <b>Space</b> 재생/정지 · <b>← →</b> 장면 이동. 데이터는 설명용 가상 예시(아파트 24건)입니다.</p>
</div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const LW=1280,LH=720;
function resize(){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));}
addEventListener('resize',resize);resize();

/* ---------- 데이터 (가상) ---------- */
let seed=20261021;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
const gauss=()=>{let u=rnd()||1e-9,v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const N=24,X=[],Y=[];
for(let i=0;i<N;i++){const a=36+rnd()*98;X.push(a);Y.push(Math.max(1.2,0.9+0.066*a+gauss()*0.55));}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const xm=mean(X),ym=mean(Y);
let Sxx=0,Sxy=0,Syy=0;for(let i=0;i<N;i++){Sxx+=(X[i]-xm)**2;Sxy+=(X[i]-xm)*(Y[i]-ym);Syy+=(Y[i]-ym)**2;}
const B1=Sxy/Sxx,B0=ym-B1*xm;
const sx=Math.sqrt(Sxx/N),sy=Math.sqrt(Syy/N);
const sse=(b0,b1)=>{let s=0;for(let i=0;i<N;i++){const e=Y[i]-(b0+b1*X[i]);s+=e*e}return s};
const SST=Syy,SSEmin=sse(B0,B1),R2=1-SSEmin/SST;
/* 경사하강법 (표준화 좌표) */
const toRaw=(a,b)=>{const s1=sy*b/sx;return [ym+sy*a-s1*xm,s1]};
const path=[];{let a=-1.25,b=-0.55;const lr=0.09;for(let k=0;k<70;k++){path.push(toRaw(a,b));let ga=0,gb=0;for(let i=0;i<N;i++){const zx=(X[i]-xm)/sx,zy=(Y[i]-ym)/sy;const e=(a+b*zx)-zy;ga+=e;gb+=e*zx}a-=lr*2*ga/N;b-=lr*2*gb/N;}path.push([B0,B1]);}
const costs=path.map(p=>sse(p[0],p[1]));
const START=path[0];

/* ---------- 좌표계 ---------- */
const XMIN=30,XMAX=140,YMIN=0,YMAX=11;
const P={x0:150,x1:890,y0:120,y1:600};
const px=x=>P.x0+(x-XMIN)/(XMAX-XMIN)*(P.x1-P.x0);
const py=y=>P.y1-(y-YMIN)/(YMAX-YMIN)*(P.y1-P.y0);

/* ---------- 타임라인 ---------- */
const S=[0,3,9,14,21,33,42],END=46;
let t=0,playing=true,speed=1,level='mid',showSq=true;

const TXT={
 mid:{scenes:['시스템 시작','데이터 점 찍기','아무 선이나 그어 보기','점과 선 사이의 거리 = 오차','오차가 가장 작은 선 찾기','완성된 예측선'],
      sse:'오차 점수',b0:'시작 높이',b1:'기울기',r2:'설명력',x:'전용면적 (㎡)',y:'가격 (억원)',
      cost:'오차 점수 변화',step:'시도',
      eq:(a,b)=>`가격 = ${a.toFixed(2)} + ${b.toFixed(3)} × 면적`,
      pred:(v)=>`84㎡ 아파트 예상 가격 ≈ ${v.toFixed(1)}억 원`,
      r2v:v=>`${Math.round(v*100)}%`, pos:'선보다 위', neg:'선보다 아래'},
 uni:{scenes:['INITIALIZE','산점도  x: 전용면적, y: 매매가','초기 모형  ŷ = β₀ + β₁x','잔차  eᵢ = yᵢ − ŷᵢ','경사하강법으로 SSE 최소화','OLS 추정 결과'],
      sse:'SSE = Σeᵢ²',b0:'β₀ (절편)',b1:'β₁ (회귀계수)',r2:'R² (결정계수)',x:'x : 전용면적 (㎡)',y:'y : 매매가 (억원)',
      cost:'비용함수 J(β) 수렴',step:'iter',
      eq:(a,b)=>`ŷ = ${a.toFixed(3)} + ${b.toFixed(4)}x`,
      pred:(v)=>`ŷ(x=84) = ${v.toFixed(2)} 억원`,
      r2v:v=>v.toFixed(3), pos:'eᵢ > 0', neg:'eᵢ < 0'}
};

/* ---------- 유틸 ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>{v=clamp(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const sceneIdx=tt=>{for(let k=S.length-2;k>=0;k--)if(tt>=S[k])return k;return 0};
const prog=(k,tt)=>clamp((tt-S[k])/(S[k+1]-S[k]));
const F={d:'Orbitron, "JetBrains Mono", monospace',m:'"JetBrains Mono", Consolas, monospace',b:'"Noto Sans KR", "Malgun Gothic", sans-serif'};
function txt(s,x,y,{f=F.m,sz=14,c='#d7f6ff',a=1,al='left',w='400',glow=0,bl='alphabetic'}={}){ctx.save();ctx.globalAlpha*=a;ctx.font=`${w} ${sz}px ${f}`;ctx.fillStyle=c;ctx.textAlign=al;ctx.textBaseline=bl;if(glow){ctx.shadowColor=c;ctx.shadowBlur=glow}ctx.fillText(s,x,y);ctx.restore()}
function corners(x,y,w,h,len,c,a){ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=c;ctx.lineWidth=2;ctx.shadowColor=c;ctx.shadowBlur=8;ctx.beginPath();
 [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([cx,cy,dx,dy])=>{ctx.moveTo(cx+dx*len,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+dy*len)});ctx.stroke();ctx.restore()}

/* 배경 파티클 */
const stars=[...Array(140)].map(()=>({x:rnd()*LW,y:rnd()*LH,z:.2+rnd()*.8,p:rnd()*6}));

function bg(tt){
 const g=ctx.createLinearGradient(0,0,0,LH);g.addColorStop(0,'#02040a');g.addColorStop(.55,'#061226');g.addColorStop(1,'#02050b');
 ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
 const hz=ctx.createRadialGradient(640,560,10,640,560,700);hz.addColorStop(0,'rgba(56,232,255,.13)');hz.addColorStop(1,'rgba(56,232,255,0)');ctx.fillStyle=hz;ctx.fillRect(0,0,LW,LH);
 for(const s of stars){const tw=.35+.65*Math.abs(Math.sin(tt*1.3+s.p));ctx.fillStyle=`rgba(180,240,255,${.5*s.z*tw})`;const x=(s.x+tt*8*s.z)%LW;ctx.fillRect(x,s.y,1.6*s.z,1.6*s.z)}
 /* 원근 바닥 그리드 */
 const hy=470;ctx.save();ctx.beginPath();ctx.rect(0,hy,LW,LH-hy);ctx.clip();
 ctx.strokeStyle='rgba(56,232,255,.16)';ctx.lineWidth=1;
 for(let i=-24;i<=24;i++){ctx.beginPath();ctx.moveTo(640+i*14,hy);ctx.lineTo(640+i*150,LH);ctx.stroke()}
 const off=(tt*0.35)%1;for(let k=0;k<14;k++){const z=(k+off)/14;const y=hy+Math.pow(z,2.2)*(LH-hy);ctx.globalAlpha=z;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(LW,y);ctx.stroke()}
 ctx.restore();
}

function plotFrame(a,L){
 ctx.save();ctx.globalAlpha=a;
 ctx.fillStyle='rgba(8,18,34,.72)';ctx.fillRect(P.x0-60,P.y0-40,P.x1-P.x0+90,P.y1-P.y0+95);
 ctx.strokeStyle='rgba(56,232,255,.07)';ctx.lineWidth=1;
 for(let x=40;x<=140;x+=10){ctx.beginPath();ctx.moveTo(px(x),P.y0);ctx.lineTo(px(x),P.y1);ctx.stroke()}
 for(let y=0;y<=11;y++){ctx.beginPath();ctx.moveTo(P.x0,py(y));ctx.lineTo(P.x1,py(y));ctx.stroke()}
 ctx.strokeStyle='rgba(56,232,255,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(P.x0,P.y0);ctx.lineTo(P.x0,P.y1);ctx.lineTo(P.x1,P.y1);ctx.stroke();
 for(let x=40;x<=140;x+=20)txt(String(x),px(x),P.y1+22,{sz:13,c:'#6f8ea8',al:'center'});
 for(let y=0;y<=10;y+=2)txt(String(y),P.x0-12,py(y)+5,{sz:13,c:'#6f8ea8',al:'right'});
 txt(L.x,(P.x0+P.x1)/2,P.y1+46,{f:F.b,sz:15,c:'#9fdcef',al:'center'});
 ctx.save();ctx.translate(P.x0-48,(P.y0+P.y1)/2);ctx.rotate(-Math.PI/2);txt(L.y,0,0,{f:F.b,sz:15,c:'#9fdcef',al:'center'});ctx.restore();
 ctx.restore();
 corners(P.x0-60,P.y0-40,P.x1-P.x0+90,P.y1-P.y0+95,22,'#38e8ff',a);
}

function orb(x,y,r,c,a){ctx.save();ctx.globalAlpha*=a;const g=ctx.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r*2.6);
 g.addColorStop(0,'#ffffff');g.addColorStop(.25,c);g.addColorStop(.5,c+'55');g.addColorStop(1,c+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.6,0,7);ctx.fill();ctx.restore()}

function beam(b0,b1,a,tt,c='#38e8ff'){
 if(a<=0)return;ctx.save();ctx.beginPath();ctx.rect(P.x0,P.y0,P.x1-P.x0,P.y1-P.y0);ctx.clip();
 const xa=px(XMIN),ya=py(b0+b1*XMIN),xb=px(XMAX),yb=py(b0+b1*XMAX);
 ctx.globalAlpha=a;ctx.lineCap='round';
 ctx.strokeStyle=c;ctx.globalAlpha=a*.18;ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(xb,yb);ctx.stroke();
 ctx.globalAlpha=a;ctx.shadowColor=c;ctx.shadowBlur=18;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(xb,yb);ctx.stroke();
 ctx.shadowBlur=0;ctx.strokeStyle='#ffffff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(xb,yb);ctx.stroke();
 const f=(tt*.45)%1;orb(xa+(xb-xa)*f,ya+(yb-ya)*f,4,c,a);
 ctx.restore();
}

function panel(tt,k,L,b0,b1,curSSE,gdStep){
 const x=930,w=310;
 ctx.save();ctx.fillStyle='rgba(8,18,34,.72)';ctx.fillRect(x,80,w,575);ctx.restore();
 corners(x,80,w,575,16,'#38e8ff',1);
 txt(`SCENE ${String(k).padStart(2,'0')} / 05`,x+20,112,{f:F.d,sz:12,c:'#ffc24a',w:'700'});
 /* 제목 줄바꿈 */
 ctx.save();ctx.font=`700 21px ${F.b}`;const words=L.scenes[k].split(' ');let line='',yy=144;const lines=[];
 for(const wd of words){const tst=line?line+' '+wd:wd;if(ctx.measureText(tst).width>w-40&&line){lines.push(line);line=wd}else line=tst}lines.push(line);ctx.restore();
 lines.slice(0,2).forEach((ln,i)=>txt(ln,x+20,yy+i*28,{f:F.b,sz:21,w:'700',c:'#eafcff',glow:6}));

 const showStats=tt>=S[2];
 const sa=clamp((tt-S[2])/1.2);
 txt(L.sse,x+20,232,{f:F.b,sz:14,c:'#6f8ea8',a:sa});
 txt(showStats?curSSE.toFixed(2):'--.--',x+20,276,{sz:40,w:'700',c:'#ffc24a',glow:14,a:sa||.4});
 const ratio=showStats?clamp(curSSE/costs[0]):1;
 ctx.save();ctx.globalAlpha=sa;ctx.fillStyle='rgba(255,194,74,.12)';ctx.fillRect(x+20,290,w-40,6);ctx.fillStyle='#ffc24a';ctx.shadowColor='#ffc24a';ctx.shadowBlur=10;ctx.fillRect(x+20,290,(w-40)*ratio,6);ctx.restore();

 txt(L.b0,x+20,332,{f:F.b,sz:13,c:'#6f8ea8',a:sa});txt(L.b1,x+165,332,{f:F.b,sz:13,c:'#6f8ea8',a:sa});
 txt(showStats?b0.toFixed(3):'--',x+20,358,{sz:20,c:'#38e8ff',a:sa,glow:6});txt(showStats?b1.toFixed(4):'--',x+165,358,{sz:20,c:'#38e8ff',a:sa,glow:6});

 /* R² 게이지 */
 const ra=clamp((tt-S[5]-1)/1.5);
 const cx=x+70,cy=430;
 ctx.save();ctx.lineWidth=7;ctx.strokeStyle='rgba(56,232,255,.12)';ctx.beginPath();ctx.arc(cx,cy,34,-Math.PI/2,Math.PI*1.5);ctx.stroke();
 if(ra>0){ctx.strokeStyle='#ff3fa4';ctx.shadowColor='#ff3fa4';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(cx,cy,34,-Math.PI/2,-Math.PI/2+Math.PI*2*R2*ease(ra));ctx.stroke();}
 ctx.restore();
 txt(ra>0?L.r2v(R2*ease(ra)):'—',cx,cy+6,{sz:15,w:'700',c:'#fff',al:'center'});
 txt(L.r2,x+125,422,{f:F.b,sz:14,c:'#6f8ea8'});
 txt(`n = ${N}  ·  가상 데이터`,x+125,446,{f:F.b,sz:12,c:'#6f8ea8'});

 /* 비용 곡선 */
 const gx=x+20,gy=490,gw=w-40,gh=130;
 txt(L.cost,gx,gy-8,{f:F.b,sz:13,c:'#6f8ea8'});
 ctx.save();ctx.strokeStyle='rgba(56,232,255,.25)';ctx.lineWidth=1;ctx.strokeRect(gx,gy,gw,gh);
 const cmax=costs[0];const n=Math.floor(gdStep);
 if(gdStep>0){ctx.beginPath();for(let i=0;i<=Math.min(n,costs.length-1);i++){const xx=gx+i/(costs.length-1)*gw,yy=gy+gh-(costs[i]/cmax)*(gh-10);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}
  ctx.strokeStyle='#ffc24a';ctx.shadowColor='#ffc24a';ctx.shadowBlur=10;ctx.lineWidth=2;ctx.stroke();
  const i=Math.min(n,costs.length-1);orb(gx+i/(costs.length-1)*gw,gy+gh-(costs[i]/cmax)*(gh-10),3,'#ffc24a',1);}
 ctx.restore();
 txt(`${L.step} ${String(Math.min(n,costs.length-1)).padStart(2,'0')}`,gx+gw,gy+gh+18,{sz:12,c:'#6f8ea8',al:'right'});
}

function frame(){
 const tt=t;const L=TXT[level];const k=sceneIdx(tt);
 ctx.setTransform(cv.width/LW,0,0,cv.height/LH,0,0);
 bg(tt);

 /* 상단 바 */
 txt('REGRESSION // SCAN',40,46,{f:F.d,sz:16,w:'900',c:'#38e8ff',glow:10});
 txt('AI 부동산 통계 · 선형회귀',265,46,{f:F.b,sz:14,c:'#6f8ea8'});
 const m=Math.floor(tt/60),s=(tt%60).toFixed(1).padStart(4,'0');
 txt(`T+${String(m).padStart(2,'0')}:${s}`,1240,46,{sz:14,c:'#9fdcef',al:'right'});
 if(Math.floor(tt*2)%2===0)orb(1120,41,4,'#ff3fa4',1);
 txt('LIVE',1132,46,{f:F.d,sz:12,c:'#ff3fa4',w:'700'});

 /* 부팅 */
 const fa=clamp((tt-.6)/1.8);
 if(k===0){const tl='INITIALIZING REGRESSION ENGINE';const nch=Math.floor(clamp(tt/2.2)*tl.length);
  txt(tl.slice(0,nch)+(Math.floor(tt*4)%2?'_':''),640,370,{f:F.d,sz:22,c:'#38e8ff',al:'center',glow:12,a:1-clamp((tt-2.3)/.7)});}
 plotFrame(fa,L);

 /* 점 등장 */
 const pts=[];
 for(let i=0;i<N;i++){const d=S[1]+i*.2;const p=clamp((tt-d)/.7);if(p<=0)continue;
  const yy=py(Y[i])-(1-ease(p))*260;pts.push(i);
  if(p<1){ctx.save();ctx.globalAlpha=.4*(1-p);ctx.strokeStyle='#38e8ff';ctx.beginPath();ctx.moveTo(px(X[i]),P.y0);ctx.lineTo(px(X[i]),yy);ctx.stroke();ctx.restore()}
  const lp=clamp((tt-d-.7)/.6);if(lp>0&&lp<1){ctx.save();ctx.globalAlpha=1-lp;ctx.strokeStyle='#38e8ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px(X[i]),py(Y[i]),6+lp*22,0,7);ctx.stroke();ctx.restore()}
 }

 /* 현재 직선 */
 let b0=START[0],b1=START[1],la=0,gdStep=0;
 if(k===2){const p=prog(2,tt);la=clamp(p*3);const w=(1-ease(p));b0=START[0]+Math.sin(tt*3.1)*2.2*w;b1=START[1]+Math.cos(tt*2.3)*0.03*w;}
 else if(k===3){la=1}
 else if(k===4){la=1;gdStep=prog(4,tt)*(path.length-1);const i=Math.floor(gdStep),f=gdStep-i,a=path[i],b=path[Math.min(i+1,path.length-1)];b0=a[0]+(b[0]-a[0])*f;b1=a[1]+(b[1]-a[1])*f;}
 else if(k>=5){la=1;b0=B0;b1=B1;gdStep=path.length-1}
 const cur=sse(b0,b1);

 /* 잔차 */
 const ra=k===3?prog(3,tt):(k>=4?1:0);
 if(ra>0){ctx.save();ctx.beginPath();ctx.rect(P.x0,P.y0,P.x1-P.x0,P.y1-P.y0);ctx.clip();
  const order=[...Array(N).keys()].sort((a,b)=>X[a]-X[b]);
  order.forEach((i,j)=>{const ap=k===3?clamp(ra*1.6-j/N):1;if(ap<=0)return;
   const yh=b0+b1*X[i],e=Y[i]-yh,c=e>=0?'#38e8ff':'#ff3fa4';
   const xp=px(X[i]),y1=py(Y[i]),y2=py(yh);const ym2=y2+(y1-y2)*ease(ap);
   if(showSq){const side=Math.abs(ym2-y2);ctx.globalAlpha=.10*ap*(k>=5?.6:1);ctx.fillStyle=c;ctx.fillRect(xp,Math.min(y2,ym2),side,side);
    ctx.globalAlpha=.35*ap*(k>=5?.6:1);ctx.strokeStyle=c;ctx.lineWidth=1;ctx.strokeRect(xp,Math.min(y2,ym2),side,side);}
   ctx.globalAlpha=.9*ap;ctx.strokeStyle=c;ctx.shadowColor=c;ctx.shadowBlur=8;ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(xp,y2);ctx.lineTo(xp,ym2);ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=0;
  });
  ctx.restore();
  if(k===3){const a=clamp(ra*3);
   orb(P.x0+20,P.y0+18,4,'#38e8ff',a);txt(L.pos,P.x0+34,P.y0+23,{f:F.b,sz:13,c:'#9fdcef',a});
   orb(P.x0+140,P.y0+18,4,'#ff3fa4',a);txt(L.neg,P.x0+154,P.y0+23,{f:F.b,sz:13,c:'#9fdcef',a});}
 }

 beam(b0,b1,la,tt,k>=5?'#38e8ff':(k===4?'#7ff3ff':'#38e8ff'));

 /* 점 그리기 (선 위에) */
 for(let i=0;i<N;i++){const d=S[1]+i*.2;const p=clamp((tt-d)/.7);if(p<=0)continue;orb(px(X[i]),py(Y[i])-(1-ease(p))*260,5,'#38e8ff',p)}

 /* 결과: 예측 */
 if(k>=5){const p=clamp((tt-S[5]-2.5)/2);if(p>0){const xv=84,yv=B0+B1*xv,X0=px(xv),Y0=py(yv);
  ctx.save();ctx.strokeStyle='#ffc24a';ctx.lineWidth=1.5;ctx.setLineDash([6,5]);ctx.shadowColor='#ffc24a';ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(X0,P.y1);ctx.lineTo(X0,P.y1+(Y0-P.y1)*ease(clamp(p*2)));ctx.stroke();
  if(p>.5){ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X0+(P.x0-X0)*ease(clamp(p*2-1)),Y0);ctx.stroke()}
  ctx.restore();
  if(p>.9){const pul=1+.3*Math.sin(tt*5);orb(X0,Y0,7*pul,'#ffc24a',1);
   ctx.save();ctx.strokeStyle='#ffc24a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X0,Y0,16+6*Math.sin(tt*5),0,7);ctx.stroke();ctx.restore();
   const bx=X0+26,by=Y0-58;ctx.save();ctx.fillStyle='rgba(20,14,2,.85)';ctx.strokeStyle='#ffc24a';ctx.fillRect(bx,by,300,40);ctx.strokeRect(bx,by,300,40);ctx.restore();
   txt(L.pred(yv),bx+14,by+26,{f:F.b,sz:15,w:'700',c:'#ffe1a1'});}
 }
  const ea=clamp((tt-S[5])/1.2);
  if(ea>0){txt(L.eq(B0,B1),(P.x0+P.x1)/2-15,P.y0-56,{f:k>=5&&level==='uni'?F.m:F.b,sz:24,w:'700',c:'#eafcff',al:'center',glow:16,a:ea});}
 }

 panel(tt,k,L,b0,b1,cur,gdStep);

 /* 장면 전환 글리치 */
 for(let j=1;j<S.length-1;j++){const d=tt-S[j];if(d>=0&&d<.35){const a=1-d/.35;ctx.save();ctx.globalAlpha=a*.5;for(let r=0;r<6;r++){const yy=rnd()*LH;ctx.fillStyle=r%2?'#38e8ff':'#ff3fa4';ctx.fillRect(0,yy,LW,1+rnd()*3)}ctx.restore()}}
}

/* ---------- 루프 & 컨트롤 ---------- */
const scrub=document.getElementById('scrub'),tc=document.getElementById('tc'),playB=document.getElementById('play');
let last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let autoStop=true,passK=-1,uiK=-1,uiLv='';
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing){const k0=sceneIdx(t);t+=dt*speed;if(t>=END){t=END;setPlay(false)}
  const k1=sceneIdx(t);
  if(autoStop&&k1>k0&&k1!==passK){t=S[k1]-.02;setPlay(false);passK=k1;}}
 frame();updUI();scrub.value=t;tc.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
 requestAnimationFrame(loop)}
function setPlay(v){playing=v;playB.textContent=v?'❚❚ 일시정지':'▶ 재생'}
playB.onclick=()=>{if(t>=END)t=0;setPlay(!playing)};
document.getElementById('restart').onclick=()=>{t=0;setPlay(true)};
const jump=d=>{const k=sceneIdx(t);const nk=clamp(k+d,0,S.length-2);t=S[nk]+.01;passK=-1;};
document.getElementById('prev').onclick=()=>jump(t-S[sceneIdx(t)]>1?0:-1);
document.getElementById('next').onclick=()=>jump(1);
scrub.oninput=()=>{t=+scrub.value};
const mid=document.getElementById('lvMid'),uni=document.getElementById('lvUni');
function setLv(l){level=l;mid.setAttribute('aria-pressed',l==='mid');uni.setAttribute('aria-pressed',l==='uni')}
mid.onclick=()=>setLv('mid');uni.onclick=()=>setLv('uni');
const sqB=document.getElementById('sq');sqB.onclick=()=>{showSq=!showSq;sqB.setAttribute('aria-pressed',showSq)};
const spB=document.getElementById('spd');const sps=[1,.75,.5,1.5];let si=0;spB.onclick=()=>{si=(si+1)%sps.length;speed=sps[si];spB.textContent=`속도 ${speed}×`};
document.getElementById('fs').onclick=()=>{const r=stage.requestFullscreen&&stage.requestFullscreen();if(r&&r.catch)r.catch(()=>{});setTimeout(resize,200)};
document.addEventListener('fullscreenchange',()=>setTimeout(resize,100));
document.getElementById('rec').onclick=()=>document.body.classList.toggle('rec');
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.key!==' ')return;
 if(e.key===' '){e.preventDefault();playB.click()}else if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);else if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec')});
if(reduce)speed=1;

/* ---------- 시나리오(대본) ---------- */
const r=Sxy/Math.sqrt(Sxx*Syy),pred=B0+B1*84;
const SHORT=['시작','데이터','초기 직선','잔차·오차','최적화','결과·예측'];
const SCRIPT={
 mid:[
  {s:'오늘은 "선형회귀"를 배워 볼게요. 이름은 어렵지만 뜻은 간단합니다. 점들 사이를 가장 잘 지나가는 직선 하나를 긋는 거예요. 이 직선이 있으면 아직 모르는 값을 예측할 수 있습니다.',tip:'첫 화면에서는 "직선 하나로 예측한다"는 목표만 먼저 말해 주세요.'},
  {s:'하늘에서 떨어지는 점 하나하나가 아파트 한 채입니다. 오른쪽으로 갈수록 넓은 집, 위로 갈수록 비싼 집이에요. 점들이 오른쪽 위로 올라가는 모양이 보이나요? 넓을수록 비싸다는 규칙이 숨어 있다는 뜻입니다.',tip:'화면의 가로축(면적)과 세로축(가격)을 손으로 가리키며 설명하면 좋습니다.'},
  {s:'그럼 아무 선이나 하나 그어 볼까요? 지금 선은 대충 그은 선이라서 점들과 잘 맞지 않아요. 이 선이 좋은지 나쁜지 판단하려면 "점수"가 필요합니다. 오른쪽 위에 오차 점수가 나타났어요.',tip:'"이 선, 잘 맞나요?" 하고 질문을 던지면 집중도가 올라갑니다.'},
  {s:'점에서 선까지 세로로 잰 거리가 바로 "오차"입니다. 하늘색은 실제 가격이 선보다 높은 집, 분홍색은 선보다 낮은 집이에요. 오차를 제곱하면 작은 사각형이 되는데, 이 사각형 넓이를 모두 더한 것이 오차 점수입니다. 점수가 작을수록 좋은 선이에요.',tip:'사각형이 큰 점을 가리키며 "이 집은 예측이 많이 틀렸네요"라고 말해 보세요.'},
  {s:'이제 컴퓨터가 선을 조금씩 움직이면서 오차 점수가 줄어드는 쪽을 찾아갑니다. 눈을 감고 산을 내려갈 때, 발밑이 내리막인 쪽으로 한 걸음씩 가는 것과 같아요. 오른쪽 그래프가 점점 바닥으로 내려가는 모습이 보이죠? 바닥에 닿으면 가장 좋은 선입니다.',tip:'"산 내려가기" 비유를 손동작과 함께 쓰면 이해가 빠릅니다.'},
  {s:()=>`드디어 오차가 가장 작은 선을 찾았어요! 이 식에 면적을 넣으면 가격을 예측할 수 있습니다. 면적이 1㎡ 넓어질 때마다 가격은 약 ${Math.round(B1*10000)}만 원씩 올라가요. 예를 들어 84㎡ 아파트는 약 ${pred.toFixed(1)}억 원으로 예측됩니다. 설명력 ${Math.round(R2*100)}%는 가격 차이의 ${Math.round(R2*100)}%를 면적으로 설명할 수 있다는 뜻이에요.`,tip:'노란 점(84㎡ 예측)을 가리키며 마무리하세요. 가상 데이터라는 점도 한 번 말해 주세요.'}
 ],
 uni:[
  {s:'선형회귀(Linear Regression)는 독립변수 x와 종속변수 y의 관계를 ŷ = β₀ + β₁x라는 1차식으로 모형화하는 방법입니다. 분석의 목표는 관측값과 예측값의 차이를 최소화하는 모수 β₀(절편), β₁(기울기)를 추정하는 것입니다.',tip:'모형식 ŷ = β₀ + β₁x + ε 에서 오차항 ε의 존재를 함께 언급할 수 있습니다.'},
  {s:()=>`표본 n = ${N}의 산점도입니다. x는 전용면적(㎡), y는 매매가(억원)입니다. 뚜렷한 양(+)의 선형 관계가 보이며 피어슨 상관계수는 r = ${r.toFixed(3)}입니다. 회귀분석 전에 산점도로 선형성 가정과 이상치를 먼저 확인합니다.`,tip:'선형성·독립성·등분산성·정규성(LINE) 가정을 여기서 짚어 주면 좋습니다.'},
  {s:'임의의 초기 모수로 회귀선을 설정했습니다. 이 상태의 모형은 데이터를 잘 설명하지 못합니다. 모형의 적합도를 수치로 평가할 기준, 즉 손실함수(loss function)가 필요합니다.',tip:'"어떤 선이 가장 좋은가?"를 정의하는 기준이 필요하다는 문제 제기 장면입니다.'},
  {s:'잔차 eᵢ = yᵢ − ŷᵢ는 관측값과 적합값의 수직 거리입니다. 화면의 사각형 넓이가 eᵢ²이고, 이를 모두 더한 SSE = Σeᵢ²가 최소제곱법의 손실함수입니다. 제곱을 쓰는 이유는 양·음의 잔차가 서로 상쇄되는 것을 막고, 큰 오차에 더 큰 벌점을 주기 위해서입니다.',tip:'잔차의 합 Σeᵢ = 0 이 되는 OLS 성질도 함께 소개할 수 있습니다.'},
  {s:'경사하강법(Gradient Descent)은 SSE를 β₀, β₁에 대해 편미분한 기울기의 반대 방향으로 모수를 반복 갱신합니다. β ← β − α·∂J/∂β 이며 α는 학습률입니다. 오른쪽 비용함수 곡선이 수렴하는 과정을 보여 줍니다. 단순회귀는 정규방정식으로 해를 바로 구할 수 있고, 경사하강법도 같은 해에 도달합니다.',tip:'머신러닝과 통계학이 같은 문제를 다른 방식으로 푼다는 연결 고리로 활용하세요.'},
  {s:()=>`OLS 추정 결과는 ŷ = ${B0.toFixed(3)} + ${B1.toFixed(4)}x 입니다. β₁ = ${B1.toFixed(4)}는 전용면적이 1㎡ 증가할 때 매매가가 평균 ${B1.toFixed(4)}억원(약 ${Math.round(B1*10000)}만 원) 증가함을 의미합니다. 결정계수 R² = ${R2.toFixed(3)}로, 매매가 변동의 ${(R2*100).toFixed(1)}%를 면적이 설명합니다. x = 84를 대입한 예측값은 ŷ = ${pred.toFixed(2)}억원입니다.`,tip:'실제 분석에서는 계수의 t검정(p값)과 잔차 진단까지 확인해야 함을 덧붙이세요.'}
 ]
};
const sv=o=>typeof o.s==='function'?o.s():o.s;
const scBox=document.getElementById('scenes');
const scBtns=SHORT.map((lab,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="n">SCENE 0${i+1}</span><span class="l">${lab}</span>`;b.onclick=()=>goScene(i);scBox.appendChild(b);return b});
function goScene(i){t=S[i]+.01;passK=-1;setPlay(true)}
const sTag=document.getElementById('sTag'),sTitle=document.getElementById('sTitle'),sNow=document.getElementById('sNow'),sTip=document.getElementById('sTip'),sAll=document.getElementById('sAll');
function buildAll(){sAll.innerHTML='';SCRIPT[level].forEach((o,i)=>{const li=document.createElement('li');li.innerHTML=`<b>${TXT[level].scenes[i]}</b><br>${sv(o)}`;li.onclick=()=>goScene(i);sAll.appendChild(li)})}
function updUI(){const k=sceneIdx(t);if(k===uiK&&level===uiLv)return;
 if(level!==uiLv)buildAll();uiK=k;uiLv=level;
 scBtns.forEach((b,i)=>b.setAttribute('aria-current',i===k));
 [...sAll.children].forEach((li,i)=>li.classList.toggle('on',i===k));
 const o=SCRIPT[level][k];sTag.textContent=`SCENE 0${k+1} · ${level==='mid'?'중학생 수준':'대학 수준'} 대본`;
 sTitle.textContent=TXT[level].scenes[k];sNow.textContent=sv(o);sTip.textContent='강의 팁 · '+o.tip;}
const autoB=document.getElementById('auto');autoB.onclick=()=>{autoStop=!autoStop;autoB.setAttribute('aria-pressed',autoStop)};
document.getElementById('copy').onclick=function(){const all=SCRIPT[level].map((o,i)=>`[장면 ${i+1}] ${TXT[level].scenes[i]}\n${sv(o)}\n(팁) ${o.tip}`).join('\n\n');const btn=this;
 const fb=()=>{const ta=document.createElement('textarea');ta.value=all;btn.parentNode.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(all).then(()=>{btn.textContent='복사됨'},()=>{fb();btn.textContent='복사됨'})}else{fb();btn.textContent='복사됨'}
 setTimeout(()=>btn.textContent='전체 대본 복사',1800)};
requestAnimationFrame(loop);
})();
</script>
