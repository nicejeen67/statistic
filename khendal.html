/* ---------- 데이터 (가상) : 단지 8곳 · 전문가 입지평가 순위 RX, 실거래가 순위 RY ---------- */

 if(o.p!=null&&o.p<1){if(o.p<=0){ctx.restore();return}const W=ctx.measureText(s).width;const x0=o.al==='center'?x-W/2:o.al==='right'?x-W:x;ctx.beginPath();ctx.rect(x0-4,y-sz*1.3,W*o.p+6,sz*1.8);ctx.clip()}
 ctx.fillText(s,x,y);ctx.restore()}

 ctx.fillStyle=INK;ctx.font=`700 16px ${MONO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y+1);ctx.restore()}

 ctx.save();ctx.globalAlpha=a;const segs=[[-1,-.7,BLUE],[-.7,-.3,'#8fb4e8'],[-.3,.3,'#d8d2c2'],[.3,.7,'#f3a79c'],[.7,1,CORAL]];

 ctx.lineWidth=2.4;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(gx,gy,R+11,Math.PI,2*Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(gx,gy,R-11,Math.PI,2*Math.PI);ctx.stroke();

 ctx.fillStyle=WHITE;for(let r=0;r<4;r++)for(let c=0;c<3;c++)ctx.fillRect(-13+c*10,-22+r*12,6,7);
 ctx.fillStyle=INK;ctx.fillRect(-5,18,10,10);ctx.restore()}

const PL=150,PR=790,PT=130,PB=600;

/* ---------- 화면 문구 ---------- */
const pc=v=>Math.round(v*100);
const TX={

  {s:()=>`이제 ${NPAIR}쌍을 모두 이어서 세어 봐요. 초록 선은 같은 방향 짝, 빨간 선은 반대 방향 짝이에요. 세어 보면 같은 방향이 ${C}쌍, 반대 방향이 ${Dn}쌍이에요. 반대 방향 짝 ${Dn}개는 처음 장면에서 선이 꼬였던 ${Dn}군데와 정확히 같아요.`,tip:'오른쪽 표의 칸 하나가 짝 하나라는 점을 손가락으로 짚어 가며 보여 주세요.'},
  {s:()=>`켄달 τ(타우)는 같은 방향 짝에서 반대 방향 짝을 빼고 전체 짝 수로 나눠요. (${C} − ${Dn}) ÷ ${NPAIR} = ${f3(tau)}예요. 같은 방향 짝이 ${pc(C/NPAIR)}%, 반대 방향 짝이 ${pc(Dn/NPAIR)}%이니 그 차이라고 생각해도 돼요. 같은 자료로 구한 스피어만 ρ는 ${f3(rho)}로, 켄달 τ가 더 작게 나와요. 계산 방식이 달라서 생기는 차이예요.`,tip:'τ와 ρ의 숫자 크기를 직접 비교하면 안 되고, 각각의 기준으로 해석해야 한다고 덧붙여 주세요.'},
  {s:()=>`이 정도 일치가 우연일 수도 있을까요? 단지 8곳의 가격 순서는 모두 ${TOT.toLocaleString('ko-KR')}가지가 가능해요. 이걸 전부 계산해서 그래프로 그렸어요. 우리처럼 차이가 ${Sk} 이상 치우친 경우는 ${ext.toLocaleString('ko-KR')}가지뿐이라, 우연일 확률 p는 ${f3(pExact)}예요. 0.05보다 작으니 우연이라고 보기 어려워요.`,tip:'자료가 작을 때는 가능한 경우를 전부 세는 "정확 검정"을 할 수 있다는 점이 켄달의 장점이라고 설명해 주세요.'},
  {s:()=>`JAMOVI에서 켄달을 체크하면 이런 결과표가 나와요. τ는 ${f2(tau)}, 우연일 확률은 ${f3(pExact)}예요. 켄달은 자료가 적을 때, 상·중·하 등급처럼 같은 순위가 많을 때, 그리고 "같은 방향 짝이 몇 % 더 많다"처럼 쉽게 설명하고 싶을 때 특히 좋아요.`,tip:'예시 데이터는 설명용 가상 수치라는 점을 한 번 말해 주세요.'}
 ],
 uni:[
  {s:()=>`켄달 순위상관계수 τ(Kendall's tau)는 두 순위 변수 사이의 일치(concordance) 정도를 측정하는 비모수 상관계수입니다. 예시는 아파트 단지 n = 8에 대한 전문가 입지평가 순위 R(X)와 3.3㎡당 실거래가 순위 R(Y)입니다. 두 순위를 선으로 연결했을 때의 교차 수 ${Dn}이 곧 불일치쌍의 수이며, 이것이 τ의 핵심 재료입니다.`,tip:'두 평가자의 순위 일치도(inter-rater agreement)를 볼 때도 자주 쓰인다는 점을 소개해 주세요.'},
  {s:'순위쌍 (R(xᵢ), R(yᵢ))의 산점도입니다. 동점은 없으며, 완전 일치라면 모든 점이 대각선 R(x) = R(y) 위에 놓입니다. 스피어만은 각 점과 대각선의 거리(dᵢ)를 이용했지만, 켄달은 점들 사이의 상대적 순서를 비교합니다.',tip:'스피어만은 "거리", 켄달은 "순서 비교"라는 대비를 칠판에 적어 두면 좋습니다.'},
  {s:()=>`모든 쌍 (i, j), i < j를 구성하면 n(n−1)/2 = ${NPAIR}쌍입니다. (xⱼ − xᵢ)(yⱼ − yᵢ) > 0이면 일치쌍(concordant), < 0이면 불일치쌍(discordant), = 0이면 동점쌍입니다. 예를 들어 (A, C)는 두 순위가 모두 증가하는 일치쌍, (F, G)는 방향이 엇갈리는 불일치쌍입니다.`,tip:'두 점을 잇는 선분의 기울기 부호로 일치·불일치를 판정할 수 있다고 설명해 주세요.'},
  {s:()=>`${NPAIR}쌍을 모두 판정하면 C = ${C}, D = ${Dn}입니다. D는 두 순위 연결선의 교차 수, 즉 순열의 역순(inversion) 수와 같습니다. 동점이 있으면 동점쌍은 C와 D 어디에도 포함되지 않습니다.`,tip:'D가 정렬 알고리즘에서 말하는 inversion 수와 같다는 점을 언급하면 공학 계열 학생들이 흥미를 가집니다.'},
  {s:()=>`τₐ = (C − D) / [n(n−1)/2] = (${C} − ${Dn}) / ${NPAIR} = ${f3(tau)}입니다. 이는 임의로 뽑은 한 쌍이 일치쌍일 확률 ${f3(C/NPAIR)}에서 불일치쌍일 확률 ${f3(Dn/NPAIR)}을 뺀 값으로 해석됩니다. 동점이 없으므로 τ_b = τₐ입니다. 같은 자료의 Spearman ρ = ${f3(rho)}이며, 일반적으로 |τ| < |ρ|입니다.`,tip:'동점이 있을 때 쓰는 τ_b = (C − D) / √[(n₀ − n₁)(n₀ − n₂)] 공식을 함께 소개할 수 있습니다.'},
  {s:()=>`H₀: τ = 0에서 S = C − D의 정확 분포는 n! = ${TOT.toLocaleString('ko-KR')}개 순열의 역순 수 분포(Mahonian 수)로 구할 수 있습니다. P(|S| ≥ ${Sk}) = ${ext.toLocaleString('ko-KR')} / ${TOT.toLocaleString('ko-KR')} = ${f3(pExact)}이므로 α = .05에서 H₀를 기각합니다. 대표본에서는 Var(S) = n(n−1)(2n+5)/18을 이용한 정규근사를 쓰며, 이 자료에서 z = ${f2(zval)}, p = ${f3(pZ)}입니다.`,tip:'소표본에서는 정확 p와 근사 p가 꽤 다를 수 있다는 점을 숫자로 비교해 보여 주세요.'},
  {s:()=>`JAMOVI Correlation Matrix에서 Kendall's tau-b를 선택한 결과 형식입니다. τ_b = ${f3(tau)}, p = ${f3(pExact)}입니다. 보고 예: "전문가 입지평가 순위와 실거래가 순위 사이에는 유의한 양의 순위상관이 있었다, τ_b = ${f2(tau)}, p = ${f3(pExact).replace(/^0/,'')}". 켄달은 소표본, 동점이 많은 서열자료, 확률적 해석이 필요한 경우에 적합합니다.`,tip:'JAMOVI가 켄달 p값을 정확 검정으로 내는지 근사로 내는지는 버전에 따라 다를 수 있으니, 실제 출력값과 비교해 보세요. 숫자는 가상 데이터로 계산했습니다.'}
 ]};
const sv=o=>typeof o.s==='function'?o.s():o.s;

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const scBtns=TX.mid.scenes.map((lab,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="n">장면 ${i+1}</span><span class="l">${lab}</span>`;b.onclick=()=>goScene(i);$('scenes').appendChild(b);return b});
function setPlay(p){playing=p;$('play').textContent=p?'❚❚ 일시정지':'▶ 재생'}
function goScene(i){T=S[i]+.001;setPlay(true)}
function togglePlay(){if(!playing){if(T>=END-.01)T=0;else{const k=sceneIdx(T);if(S[k+1]-T<.03)T=S[k+1]+.001}}setPlay(!playing)}
$('play').onclick=togglePlay;cv.onclick=togglePlay;
$('rew').onclick=()=>{T=0;setPlay(true)};
const jump=d=>{const k=sceneIdx(T);goScene(clamp(k+d,0,S.length-2))};
$('prev').onclick=()=>jump(-1);$('next').onclick=()=>jump(1);
$('spd').onchange=e=>speed=+e.target.value;
$('auto').onclick=()=>{autoStop=!autoStop;$('auto').setAttribute('aria-pressed',autoStop)};
$('scrub').oninput=e=>{T=+e.target.value;setPlay(false)};
$('fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen().catch(()=>{})}catch(e){}};
let hintT;function rec(){document.body.classList.toggle('rec');setTimeout(resize,50);const h=$('hint');if(document.body.classList.contains('rec')){h.classList.add('show');clearTimeout(hintT);hintT=setTimeout(()=>h.classList.remove('show'),2200)}else h.classList.remove('show')}
$('rec').onclick=rec;
function setLevel(lv){level=lv;$('lvMid').setAttribute('aria-pressed',lv==='mid');$('lvUni').setAttribute('aria-pressed',lv==='uni');scBtns.forEach((b,i)=>b.querySelector('.l').textContent=TX[lv].scenes[i]);uiK=-1;buildAll()}
$('lvMid').onclick=()=>setLevel('mid');$('lvUni').onclick=()=>setLevel('uni');
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);else if(e.key==='h'||e.key==='H'||e.key==='ㅗ')rec()});
function buildAll(){const ol=$('sAll');ol.innerHTML='';SCRIPT[level].forEach((o,i)=>{const li=document.createElement('li');li.innerHTML=`<b>${TX[level].scenes[i]}</b><br>${sv(o)}<br><small>강의 팁 · ${o.tip}</small>`;li.onclick=()=>goScene(i);ol.appendChild(li)})}
let uiK=-1;
function updUI(){const k=sceneIdx(T);$('scrub').value=T;const fm=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;$('time').textContent=`${fm(T)} / ${fm(END)}`;
 if(k===uiK)return;uiK=k;scBtns.forEach((b,i)=>b.setAttribute('aria-current',i===k));[...$('sAll').children].forEach((li,i)=>li.classList.toggle('on',i===k));
 const o=SCRIPT[level][k];$('sTag').textContent=`장면 ${k+1} / 7 · ${level==='mid'?'중학생 수준':'대학 수준'} 대본`;$('sTitle').textContent=TX[level].scenes[k];$('sNow').textContent=sv(o);$('sTip').textContent='강의 팁 · '+o.tip}
$('copy').onclick=function(){const all=SCRIPT[level].map((o,i)=>`[장면 ${i+1}] ${TX[level].scenes[i]}\n${sv(o)}\n(강의 팁) ${o.tip}`).join('\n\n');const btn=this;
 const fb=()=>{const ta=document.createElement('textarea');ta.value=all;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()};
 const done=()=>{btn.textContent='복사했습니다';setTimeout(()=>btn.textContent='전체 대본 복사',1800)};
 try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(all).then(done,()=>{fb();done()});else{fb();done()}}catch(e){fb();done()}};
buildAll();

/* ---------- 루프 ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(playing){let nt=T+dt*speed;const k=sceneIdx(T);
  if(nt>=END){nt=END-.001;setPlay(false)}
  else if(autoStop&&nt>=S[k+1]){nt=S[k+1]-.002;setPlay(false)}

if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('400 24px "Black Han Sans"'),document.fonts.load('500 20px "Noto Sans KR"'),document.fonts.load('700 20px "Roboto Mono"')]).catch(()=>{})}
requestAnimationFrame(loop);
window.__STATS={tau,rho,C,Dn,pExact,zval,pZ,ext,TOT};
})();
