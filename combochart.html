<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콤보 차트가 만들어지는 과정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 도면 모눈 바탕. 무대 = 위아래 두 그래프 → 한 판으로 합치기 → 오른쪽 축 → 관계 읽기 → 함정 → 대안 */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#16233a; --muted:#5b6678; --line:#d9dfe8; --gridc:#e6eaf0;
  --c1:#1f4e8c; --c2:#138a83; --c3:#d98a1c; --c4:#b8506a; --soft:#e8eef6; --bar:#8fa9cc;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --paper:#162030; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2a3648; --gridc:#1c2738;
  --c1:#6aa0e8; --c2:#3cc0b6; --c3:#f0aa48; --c4:#e07f97; --soft:#1d2a3d; --bar:#3d5a82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --paper:#162030; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2a3648; --gridc:#1c2738;
  --c1:#6aa0e8; --c2:#3cc0b6; --c3:#f0aa48; --c4:#e07f97; --soft:#1d2a3d; --bar:#3d5a82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1080px;margin:0 auto;padding-block:36px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;color:var(--c2);text-transform:uppercase}
h1{font-size:clamp(26px,4vw,38px);line-height:1.25;margin:4px 0 8px;text-wrap:balance}
h1 span{color:var(--c1)}
.lede{margin:0;color:var(--muted);max-width:68ch}
.lv{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lv button{border:none;border-radius:0;padding:6px 14px}
.lv button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stagebar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.phase{font-weight:700;font-size:17px}
.phase .k{font:500 13px var(--mono);color:var(--c3);margin-right:8px}
canvas{display:block;width:100%;height:520px}
@media (max-width:560px){canvas{height:480px}}
.caption{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--soft);min-height:66px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp>span{font:500 12px var(--mono);color:var(--muted);margin-right:2px}
button,select{appearance:none;font:500 14px var(--sans);padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.pri{background:var(--c1);border-color:var(--c1);color:#fff;min-width:96px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
select{padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.scrub{display:flex;gap:10px;align-items:center;flex:1 1 240px;min-width:0}
.scrub input{flex:1;min-width:0;accent-color:var(--c1)}
.scrub output{font:12px var(--mono);color:var(--muted);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.steps li{min-width:0}
.steps button{width:100%;text-align:left;display:grid;gap:2px;padding:10px 12px;font-weight:400;height:100%}
.steps button b{font:500 12px var(--mono);color:var(--c3)}
.steps button strong{font-weight:500}
.steps button small{color:var(--muted);font-size:12.5px;line-height:1.45}
.steps button.on{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:17px;margin:0 0 6px}
.panel p{margin:0}
.chk{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.chk li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.chk li::before{content:"✓";font-weight:700;color:var(--c2)}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.mini figure{margin:0;display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.mini figcaption b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.mini svg{width:100%;height:auto;background:var(--soft);border-radius:6px}
.pc{display:grid;gap:12px}
.pc-head h2{font-size:clamp(20px,2.4vw,24px);margin:0}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.pc-col{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.pc-col h3{margin:0;padding:10px 16px;font-size:16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.pc-col.pro h3{color:var(--c2)}.pc-col.con h3{color:var(--c4)}
.pc-col .mk{font:700 15px var(--mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--paper)}
.pc-col.pro .mk{background:var(--c2)}.pc-col.con .mk{background:var(--c4)}
.pc-col ol{list-style:none;margin:0;padding:4px 16px 12px;display:grid}
.pc-col li{padding:10px 0;border-bottom:1px dashed var(--line);display:grid;gap:3px}
.pc-col li:last-child{border-bottom:none}
.pc-col li strong{font-weight:500}
.pc-col li p{margin:0;font-size:14px;color:var(--muted)}
.pc-col li .ex{font-size:13px}
.pc-col li .ex b{font-weight:500;color:var(--c1)}
.pc-tip{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">AI부동산통계기초 · 그래프 도감 10 · 추이</div>
    <h1>콤보 차트가 <span>만들어지는 과정</span></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="stage">
    <div class="stagebar"><div class="phase" id="phase" aria-live="polite"></div>
      <div class="lv" role="group" aria-label="설명 수준"><button type="button" id="lvE" aria-pressed="true">쉬운 설명</button><button type="button" id="lvU" aria-pressed="false">전공 설명</button></div></div>
    <canvas id="cv" role="img" aria-label="거래량 막대와 평균 매매가 선을 이중축으로 합쳐 콤보 차트를 만드는 애니메이션"></canvas>
    <div class="caption" id="caption"></div>
  </div>

  <div class="controls">
    <div class="grp"><button class="pri" id="play" type="button">일시정지</button><button id="restart" type="button">처음부터</button></div>
    <div class="grp"><span>속도</span><select id="speed" aria-label="재생 속도"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></div>
    <div class="grp seg" role="group" aria-label="보기 방식"><span>보기</span><button id="vC" type="button" aria-pressed="true">이중축 콤보</button><button id="vP" type="button" aria-pressed="false">위아래 두 패널</button></div>
    <div class="grp seg" role="group" aria-label="오른쪽 축 범위"><span>오른쪽 축</span><button id="r0" type="button" aria-pressed="false">넓게</button><button id="r1" type="button" aria-pressed="true">적정</button><button id="r2" type="button" aria-pressed="false">좁게</button></div>
    <div class="scrub"><input type="range" id="scrub" min="0" max="23" step="0.01" value="0" aria-label="재생 위치"><output id="tout">0.0초</output></div>
  </div>

  <ol class="steps" id="steps"></ol>

  <div class="two">
    <div class="panel">
      <h2>이중축 콤보 차트 점검표</h2>
      <p class="note" id="chkNote"></p>
      <ul class="chk" id="chk"></ul>
    </div>
    <div class="panel">
      <h2>이중축을 쓰지 않는 대안</h2>
      <p class="note" id="miniNote"></p>
      <div class="mini" id="mini"></div>
    </div>
  </div>

  <section class="pc" aria-labelledby="pcTitle">
    <div class="pc-head"><h2 id="pcTitle">콤보 차트를 쓸 때의 장점과 단점</h2></div>
    <div class="pc-grid">
      <div class="pc-col pro"><h3><span class="mk">+</span>장점</h3><ol id="proList"></ol></div>
      <div class="pc-col con"><h3><span class="mk">−</span>단점</h3><ol id="conList"></ol></div>
    </div>
    <p class="pc-tip" id="pcTip"></p>
  </section>
  <p class="note">※ 거래량과 가격은 설명용으로 생성한 예시 값이며 실제 통계가 아닙니다. 위 설명 수준 버튼으로 페이지 전체의 설명이 바뀝니다.</p>
</div>

<script>
(function(){
const M=24,TOTAL=23,T2=2.6,T3=5.4,T4=8.0,T5=10.0,T6=13.4,T7=17.6,T8=21.2;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const lerp=(a,b,p)=>a+(b-a)*p;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MONO='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace',SANS='"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif';
const f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const MON=Array.from({length:M},(_,i)=>`${24+Math.floor(i/12)}.${i%12+1}`);
const R=rng(1124),sig=x=>1/(1+Math.exp(-x));
const VOL=Array.from({length:M},(_,i)=>Math.round((2.2+1.9*sig((i-9)/1.6)+(R()-.5)*.4)*10)/10);
const PRI=Array.from({length:M},(_,i)=>Math.round((10.1+1.5*sig((i-11.8)/1.8)+(R()-.5)*.08)*100)/100);
const VLEFT=5,SHARED=12;
const RR=[[0,24],[9.6,12],[10.9,11.4]]; // 넓게 / 적정 / 좁게
const firstUp=a=>{const lo=Math.min(...a.slice(0,6)),hi=Math.max(...a.slice(-6)),mid=(lo+hi)/2;return a.findIndex(v=>v>mid)};
const vUp=firstUp(VOL),pUp=firstUp(PRI),LAG=pUp-vUp;

let t=0,playing=true,speed=1,L={},lastPhase=-1,lv='e',viewUser=0,viewCur=0,rUser=1,rLo=RR[1][0],rHi=RR[1][1];
try{const v=localStorage.getItem('comboLv');if(v==='e'||v==='u')lv=v}catch(e){}
function layout(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,narrow=W<560,l=narrow?38:60,rr=narrow?40:66,top=54,base=H-46;L={W,H,narrow,l,rr,top,base,plotW:W-l-rr}}
const X=i=>L.l+(i+.5)/M*L.plotW;
function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function draw(){
  const C={ink:col('--ink'),muted:col('--muted'),line:col('--line'),c1:col('--c1'),c2:col('--c2'),c3:col('--c3'),c4:col('--c4'),paper:col('--paper'),bar:col('--bar')};
  const{W,H,l,rr,top,base,plotW,narrow}=L;ctx.clearRect(0,0,W,H);
  const txt=(s,x,y,color,font,align='center',a=1)=>{if(a<=0)return;ctx.globalAlpha=a;ctx.fillStyle=color;ctx.font=font;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.globalAlpha=1};
  const ln=(x1,y1,x2,y2,color,w=1,dash=null,a=1)=>{if(a<=0)return;ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;ctx.globalAlpha=1};
  const a0=clamp(t/.5);
  // ── 상태 결정
  // pp: 위아래 두 패널(1) ↔ 한 판(0)
  let pp;if(t<T2)pp=1;else if(t<T7)pp=1-ease(clamp((t-T2)/1.2));else if(t<T8)pp=ease(clamp((t-T7-.2)/1.2))*(1-ease(clamp((t-T7-2.4)/1)));else pp=viewCur;
  // s3: 공유축(0) → 오른쪽 축(1)
  const s3=t<T3?0:ease(clamp((t-T3)/1.4));
  const shareP=t<T2?0:(1-s3); // 공유축 정도
  // 오른쪽 축 범위
  let lo2=rLo,hi2=rHi;
  if(t>=T6&&t<T7){const a=ease(clamp((t-T6-.2)/1)),b=ease(clamp((t-T6-1.8)/1)),c=ease(clamp((t-T6-3.2)/.8));
    const st=RR[1],w=RR[0],n=RR[2];lo2=lerp(lerp(lerp(st[0],w[0],a),n[0],b),st[0],c);hi2=lerp(lerp(lerp(st[1],w[1],a),n[1],b),st[1],c)}
  else if(t<T8){lo2=RR[1][0];hi2=RR[1][1]}
  // 패널 위치
  const midGap=24,half=(base-top-midGap)/2;
  const bTop=top,bBot=lerp(base,top+half,pp),lTop=lerp(top,top+half+midGap,pp),lBot=base;
  // 막대 범위, 선 범위(패널일 땐 각자 / 공유일 땐 0~12 / 콤보일 땐 오른쪽 축)
  const vHi=lerp(lerp(VLEFT,SHARED,shareP),VLEFT,pp*(t>=T2?1:1));
  const pLo=lerp(lerp(0,lo2,s3),RR[1][0],pp),pHi=lerp(lerp(SHARED,hi2,s3),RR[1][1],pp);
  const Yb=v=>bBot-v/vHi*(bBot-bTop),Yl=v=>lBot-(v-pLo)/(pHi-pLo)*(lBot-lTop);
  // ── 격자·왼쪽 축(거래량)
  const st=vHi>8?2:1;
  for(let v=0;v<=vHi+1e-6;v+=st){const y=Yb(v);ln(l,y,l+plotW,y,C.line,1,null,a0*(1-pp*.0));txt(v,l-6,y+3,shareP>.5?C.ink:C.c1,`10px ${MONO}`,'right',a0)}
  ln(l,bBot,l+plotW,bBot,C.ink,1.2,null,a0);
  // 패널 아래쪽 선 그래프 격자(두 패널일 때)
  if(pp>.02){for(let v=Math.ceil(pLo*2)/2;v<=pHi+1e-6;v+=.5){const y=Yl(v);ln(l,y,l+plotW,y,C.line,1,null,pp);txt(f1(v),l-6,y+3,C.c3,`10px ${MONO}`,'right',pp)}ln(l,lBot,l+plotW,lBot,C.ink,1.2,null,pp)}
  // 오른쪽 축(가격)
  const ra=s3*(1-pp);
  if(ra>0){const span=hi2-lo2,stp=span>10?4:span>1.5?.5:.1;ln(l+plotW,top,l+plotW,base,C.c3,2,null,ra);
    for(let v=Math.ceil(lo2/stp)*stp;v<=hi2+1e-6;v+=stp){const y=Yl(v);ln(l+plotW,y,l+plotW+5,y,C.c3,1.5,null,ra);txt(stp<.5?f1(v):(stp<1?f1(v):v),l+plotW+8,y+3,C.c3,`10px ${MONO}`,'left',ra)}
    ctx.save();ctx.translate(W-10,(top+base)/2);ctx.rotate(Math.PI/2);txt('평균 매매가(억원) ▶ 선',0,0,C.c3,`700 11px ${SANS}`,'center',ra);ctx.restore()}
  ctx.save();ctx.translate(13,(top+(pp>.5?top+half:base))/2);ctx.rotate(-Math.PI/2);txt(shareP>.5?'같은 눈금 (천 건 = 억원?)':'◀ 막대 · 거래량(천 건)',0,0,shareP>.5?C.c4:C.c1,`700 11px ${SANS}`,'center',a0);ctx.restore();
  if(pp>.5){ctx.save();ctx.translate(13,(lTop+lBot)/2);ctx.rotate(-Math.PI/2);txt('평균 매매가(억원)',0,0,C.c3,`700 11px ${SANS}`,'center',pp);ctx.restore()}
  MON.forEach((m,i)=>{if(i%(narrow?6:3)===0)txt(m,X(i),base+16,C.muted,`10px ${MONO}`,'center',a0)});
  if(pp>.5)MON.forEach((m,i)=>{if(i%(narrow?6:3)===0)txt(m,X(i),bBot+14,C.muted,`9px ${MONO}`,'center',pp*.8)});
  // 머리글·범례
  const hd=pp>.5?(t<T2?'따로 그린 두 그래프: 위 = 거래량, 아래 = 평균 매매가':'대안: 시간축을 맞춘 위아래 두 패널'):'월별 거래량(막대)과 평균 매매가(선)';
  txt(hd,l,24,C.muted,`500 12px ${SANS}`,'left',a0);
  const lgA=clamp((t-T4)/.6)*(1-pp);
  if(lgA>0&&!narrow){ctx.globalAlpha=lgA;ctx.fillStyle=C.bar;ctx.fillRect(W-rr-250,14,14,11);ctx.globalAlpha=1;txt('거래량 (왼쪽 축)',W-rr-232,24,C.ink,`12px ${SANS}`,'left',lgA);
    ln(W-rr-120,19,W-rr-104,19,C.c3,3,null,lgA);txt('가격 (오른쪽 축)',W-rr-98,24,C.ink,`12px ${SANS}`,'left',lgA)}
  // ── 막대
  const bw=plotW/M*.62,styleP=clamp((t-T4)/.8);
  VOL.forEach((v,i)=>{const pa=clamp((t-i*.04)/.4);const y=Yb(v);ctx.globalAlpha=pa;ctx.fillStyle=styleP>0?C.bar:C.c1;if(styleP>0&&styleP<1){ctx.fillStyle=C.c1;ctx.globalAlpha=pa*(1-styleP);ctx.fillRect(X(i)-bw/2,y,bw,bBot-y);ctx.fillStyle=C.bar;ctx.globalAlpha=pa*styleP}ctx.fillRect(X(i)-bw/2,y,bw,bBot-y);ctx.globalAlpha=1});
  // ── 선
  const pl=clamp((t-.4)/1.8);
  ctx.save();ctx.beginPath();ctx.rect(l-2,top-6,plotW+4,base-top+8);ctx.clip();
  if(pl>0){const n=pl*(M-1);ctx.strokeStyle=C.c3;ctx.lineWidth=lerp(2,3.2,styleP);ctx.beginPath();ctx.moveTo(X(0),Yl(PRI[0]));

    s+=`<path d="${VOL.map((v,i)=>`${i?'L':'M'}${Xi(i).toFixed(1)},${Yv(v/VOL[0]*100).toFixed(1)}`).join('')}" style="fill:none;stroke:var(--c1);stroke-width:2"/>`;
    s+=`<path d="${PRI.map((v,i)=>`${i?'L':'M'}${Xi(i).toFixed(1)},${Yv(v/PRI[0]*100).toFixed(1)}`).join('')}" style="fill:none;stroke:var(--c3);stroke-width:2"/>`}
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`}
const MINI={e:[['위아래 두 패널','눈금이 각자 있어 헷갈리지 않음'],['둘 다 지수로','첫 달 = 100으로 맞춰 한 눈금에']],u:[['공유 x축 두 패널','축 대응 오독과 범위 조작 여지가 적음'],['지수화 단일 축','상대 변화율을 같은 척도로 비교']]};

function renderText(){$('lede').textContent=LEDE[lv];
  $('chkNote').textContent=lv==='e'?'콤보 차트를 만들거나 읽을 때 아래 다섯 가지를 확인하세요.':'이중축 그래프 작성·판독 시 점검 항목입니다.';
  $('chk').innerHTML=CHK[lv].map(c=>`<li>${c}</li>`).join('');
  $('miniNote').textContent=lv==='e'?'오른쪽 눈금 때문에 헷갈릴 걱정이 있다면 이런 방법도 있습니다.':'이중축의 임의적 중첩 문제를 피하는 두 가지 대안입니다.';
  $('mini').innerHTML=['p','i'].map((k,i)=>`<figure>${mini(k)}<figcaption><b>${MINI[lv][i][0]}</b>${MINI[lv][i][1]}</figcaption></figure>`).join('');
  const item=o=>`<li><strong>${o.t}</strong><p>${lv==='e'?o.e:o.u}</p><span class="ex">예: ${o.x}</span></li>`;
  $('proList').innerHTML=PC.pro.map(item).join('');$('conList').innerHTML=PC.con.map(item).join('');$('pcTip').innerHTML=PC.tip[lv];
  $('lvE').setAttribute('aria-pressed',lv==='e');$('lvU').setAttribute('aria-pressed',lv==='u');lastPhase=-1}
function phaseIdx(){let p=0;STEPS.forEach((s,i)=>{if(t>=s.t)p=i});return p}
function ui(){const p=phaseIdx();
  if(p!==lastPhase){lastPhase=p;$('phase').innerHTML=`<span class="k">${p+1}/${STEPS.length}</span>${STEPS[p].n}`;$('caption').textContent=p===STEPS.length-1?finalMsg():STEPS[p][lv];
    [...$('steps').querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',i===p))}
  $('scrub').value=t;$('tout').textContent=t.toFixed(1)+'초';$('play').textContent=playing?'일시정지':(t>=TOTAL?'다시 재생':'재생')}
let prev=performance.now();
function frame(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;if(playing){t+=dt*speed;if(t>=TOTAL){t=TOTAL;playing=false}}
  viewCur=Math.abs(viewCur-viewUser)<.003?viewUser:lerp(viewCur,viewUser,.08);
  const tr=RR[rUser];rLo=Math.abs(rLo-tr[0])<.002?tr[0]:lerp(rLo,tr[0],.08);rHi=Math.abs(rHi-tr[1])<.002?tr[1]:lerp(rHi,tr[1],.08);
  draw();ui();requestAnimationFrame(frame)}
function toEnd(){if(t<T8){t=T8+1.3;playing=false}lastPhase=-1}
function setV(v){viewUser=v;$('vC').setAttribute('aria-pressed',v===0);$('vP').setAttribute('aria-pressed',v===1);toEnd()}
function setR(v){rUser=v;['r0','r1','r2'].forEach((id,i)=>$(id).setAttribute('aria-pressed',i===v));if(viewUser===1)setV(0);toEnd()}

$('steps').innerHTML=STEPS.map((s,i)=>`<li><button type="button" id="st${i}"><b>${i+1}단계</b><strong>${s.n}</strong><small>${s.s}</small></button></li>`).join('');
STEPS.forEach((s,i)=>$('st'+i).onclick=()=>{t=s.t;playing=true;lastPhase=-1});
$('play').onclick=()=>{if(t>=TOTAL)t=0;playing=!playing;lastPhase=-1};
$('restart').onclick=()=>{t=0;playing=true;lastPhase=-1};
$('speed').onchange=e=>speed=+e.target.value;
$('vC').onclick=()=>setV(0);$('vP').onclick=()=>setV(1);
['r0','r1','r2'].forEach((id,i)=>$(id).onclick=()=>setR(i));
$('scrub').oninput=e=>{t=+e.target.value;playing=false;lastPhase=-1};
$('lvE').onclick=()=>{lv='e';try{localStorage.setItem('comboLv',lv)}catch(e){}renderText()};
$('lvU').onclick=()=>{lv='u';try{localStorage.setItem('comboLv',lv)}catch(e){}renderText()};
window.addEventListener('resize',layout);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
layout();renderText();
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){t=TOTAL;playing=false}
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
