<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산점도 행렬이 만들어지는 과정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 도면 모눈 바탕. 무대 = 왼쪽 원자료 표(→ 정보 패널) / 오른쪽 4×4 산점도 행렬 */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#16233a; --muted:#5b6678; --line:#d9dfe8; --gridc:#e6eaf0;
  --c1:#1f4e8c; --c2:#138a83; --c3:#d98a1c; --c4:#b8506a; --c5:#7a6aa8; --soft:#e8eef6; --lo:#eef3f9;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --paper:#162030; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2a3648; --gridc:#1c2738;
  --c1:#7fb0f0; --c2:#3cc0b6; --c3:#f0aa48; --c4:#e07f97; --c5:#a99ad6; --soft:#1d2a3d; --lo:#223047; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --paper:#162030; --ink:#e4e9f1; --muted:#9aa6b8; --line:#2a3648; --gridc:#1c2738;
  --c1:#7fb0f0; --c2:#3cc0b6; --c3:#f0aa48; --c4:#e07f97; --c5:#a99ad6; --soft:#1d2a3d; --lo:#223047; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1080px;margin:0 auto;padding-block:36px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;color:var(--c2);text-transform:uppercase}
h1{font-size:clamp(26px,4vw,38px);line-height:1.25;margin:4px 0 8px;text-wrap:balance}
h1 span{color:var(--c1)}
.lede{margin:0;color:var(--muted);max-width:68ch}
.lv{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lv button{border:none;border-radius:0;padding:6px 14px}
.lv button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stagebar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.phase{font-weight:700;font-size:17px}
.phase .k{font:500 13px var(--mono);color:var(--c3);margin-right:8px}
canvas{display:block;width:100%;height:580px}
@media (max-width:640px){canvas{height:520px}}
.caption{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--soft);min-height:66px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp>span{font:500 12px var(--mono);color:var(--muted);margin-right:2px}
button,select{appearance:none;font:500 14px var(--sans);padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.pri{background:var(--c1);border-color:var(--c1);color:#fff;min-width:96px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
select{padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.scrub{display:flex;gap:10px;align-items:center;flex:1 1 220px;min-width:0}
.scrub input{flex:1;min-width:0;accent-color:var(--c1)}
.scrub output{font:12px var(--mono);color:var(--muted);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.steps li{min-width:0}
.steps button{width:100%;text-align:left;display:grid;gap:2px;padding:10px 12px;font-weight:400;height:100%}
.steps button b{font:500 12px var(--mono);color:var(--c3)}
.steps button strong{font-weight:500}
.steps button small{color:var(--muted);font-size:12.5px;line-height:1.45}
.steps button.on{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:17px;margin:0 0 6px}
.panel p{margin:0}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:380px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 11.5px var(--mono);color:var(--muted);background:var(--soft)}
.chk{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.chk li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.chk li::before{content:"✓";font-weight:700;color:var(--c2)}
.pc{display:grid;gap:12px}
.pc-head h2{font-size:clamp(20px,2.4vw,24px);margin:0}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.pc-col{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.pc-col h3{margin:0;padding:10px 16px;font-size:16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.pc-col.pro h3{color:var(--c2)}.pc-col.con h3{color:var(--c4)}
.pc-col .mk{font:700 15px var(--mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--paper)}
.pc-col.pro .mk{background:var(--c2)}.pc-col.con .mk{background:var(--c4)}
.pc-col ol{list-style:none;margin:0;padding:4px 16px 12px;display:grid}
.pc-col li{padding:10px 0;border-bottom:1px dashed var(--line);display:grid;gap:3px}
.pc-col li:last-child{border-bottom:none}
.pc-col li strong{font-weight:500}
.pc-col li p{margin:0;font-size:14px;color:var(--muted)}
.pc-col li .ex{font-size:13px}
.pc-col li .ex b{font-weight:500;color:var(--c1)}
.pc-tip{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">AI부동산통계기초 · 그래프 도감 24 · 관계</div>
    <h1>산점도 행렬이 <span>만들어지는 과정</span></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="stage">
    <div class="stagebar"><div class="phase" id="phase" aria-live="polite"></div>
      <div class="lv" role="group" aria-label="설명 수준"><button type="button" id="lvE" aria-pressed="true">쉬운 설명</button><button type="button" id="lvU" aria-pressed="false">전공 설명</button></div></div>
    <canvas id="cv" role="img" aria-label="아파트 단지 자료표의 열이 분포로, 두 열의 짝이 산점도로 바뀌어 4×4 산점도 행렬이 되는 애니메이션"></canvas>
    <div class="caption" id="caption"></div>
  </div>
  <p class="note" style="margin:-8px 0 0">완성 후 칸이나 점에 마우스를 올리거나(휴대폰은 누르기) 하면 두 변수의 상관계수, 또는 그 단지의 값이 나옵니다.</p>

  <div class="controls">
    <div class="grp"><button class="pri" id="play" type="button">일시정지</button><button id="restart" type="button">처음부터</button></div>
    <div class="grp"><span>속도</span><select id="speed" aria-label="재생 속도"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></div>
    <div class="grp"><span>위 칸</span><select id="uSel" aria-label="위쪽 삼각형 표시"><option value="0" selected>상관계수 r</option><option value="1">산점도(거울)</option></select></div>
    <div class="grp"><span>강조</span><select id="bSel" aria-label="강조할 단지"><option value="0">없음</option><option value="1" selected>가장 비싼 5곳</option><option value="2">신축(5년 이하)</option><option value="3">역세권(300m 이내)</option></select></div>
    <div class="grp"><span>이상치</span><select id="oSel" aria-label="이상치 포함 여부"><option value="1" selected>포함</option><option value="0">제외</option></select></div>
    <div class="scrub"><input type="range" id="scrub" min="0" max="26" step="0.01" value="0" aria-label="재생 위치"><output id="tout">0.0초</output></div>
  </div>

  <ol class="steps" id="steps"></ol>

  <div class="two">
    <div class="panel">
      <h2>산점도 행렬 읽는 법</h2>
      <p class="note" id="rNote"></p>
      <div class="tbl"><table><thead><tr><th>칸 위치</th><th>무엇을 그리나</th><th>읽는 법</th></tr></thead><tbody id="rBody"></tbody></table></div>
    </div>
    <div class="panel">
      <h2>산점도 행렬 점검표</h2>
      <p class="note" id="chkNote"></p>
      <ul class="chk" id="chk"></ul>
    </div>
  </div>

  <section class="pc" aria-labelledby="pcTitle">
    <div class="pc-head"><h2 id="pcTitle">산점도 행렬을 쓸 때의 장점과 단점</h2></div>
    <div class="pc-grid">
      <div class="pc-col pro"><h3><span class="mk">+</span>장점</h3><ol id="proList"></ol></div>
      <div class="pc-col con"><h3><span class="mk">−</span>단점</h3><ol id="conList"></ol></div>
    </div>
    <p class="pc-tip" id="pcTip"></p>
  </section>
  <p class="note" id="foot"></p>
</div>

<script>
(function(){
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261022);
const nrm=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
// 예시 단지 59곳 + 이상치 1곳
const REC=[];for(let i=0;i<59;i++){const area=Math.round(40+R()*90),age=Math.round(R()*34),dist=Math.round(100+R()*1300);
  const price=Math.max(1.5,1.0+.11*area-.12*age+7*Math.exp(-dist/300)+nrm()*1.1);REC.push({id:`단지${String(i+1).padStart(2,'0')}`,v:[area,+price.toFixed(1),age,dist],out:false})}
REC.push({id:'단지60',v:[45,26.0,38,200],out:true}); // 재건축 기대감이 큰 오래된 소형 단지(이상치)
const VN=['면적','가격','연식','역거리'],VU=['㎡','억','년','m'],K=4;
const RG=[[30,140],[0,30],[0,40],[0,1500]];
function corr(rows,a,b){const n=rows.length,ma=rows.reduce((s,r)=>s+r.v[a],0)/n,mb=rows.reduce((s,r)=>s+r.v[b],0)/n;let sab=0,saa=0,sbb=0;rows.forEach(r=>{const da=r.v[a]-ma,db=r.v[b]-mb;sab+=da*db;saa+=da*da;sbb+=db*db});return sab/Math.sqrt(saa*sbb)}
const RIN=[],ROUT=[];for(let i=0;i<K;i++){RIN[i]=[];ROUT[i]=[];for(let j=0;j<K;j++){RIN[i][j]=corr(REC,i,j);ROUT[i][j]=corr(REC.filter(r=>!r.out),i,j)}}
const TOP5=new Set([...REC].sort((a,b)=>b.v[1]-a.v[1]).slice(0,5).map(r=>r.id));
const BR=[()=>false,r=>TOP5.has(r.id),r=>r.v[2]<=5,r=>r.v[3]<=300];
const TOTAL=26,T2=2.8,T3=5.6,T4=8.6,T5=11.4,T6=14.6,T7=18.6,T8=22.6;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const lerp=(a,b,p)=>a+(b-a)*p;
const MONO='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace',SANS='"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif';
let t=0,playing=true,speed=1,L={},lastPhase=-1,lv='e',uUser=0,bUser=1,oUser=1,ptr=null,snap=true,uCur=0,oCur=1,bA=0;
try{const v=localStorage.getItem('splomLv');if(v==='e'||v==='u')lv=v}catch(e){}
REC.forEach((r,i)=>{r.d=R()*.6;r.rowI=i});
function layout(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,narrow=W<640;
  const tx=narrow?12:16,ty=narrow?10:24,tw=narrow?W-24:Math.min(300,W*.3),nrow=narrow?4:12;
  const mx0=narrow?34:tx+tw+40,my=narrow?ty+28+nrow*15+34:30,S=narrow?Math.min(W-mx0-10,H-my-30):Math.min(H-my-34,W-mx0-20),mx=narrow?mx0:mx0+Math.max(0,(W-mx0-20-S)/2),gap=narrow?4:8,cs=(S-gap*(K-1))/K;
  L={W,H,narrow,tx,ty,tw,nrow,mx,my,S,gap,cs,colX:[0,.30,.52,.72].map(f=>tx+8+f*(tw-16)+(narrow?50:60)*0)}}
function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const cellX=j=>L.mx+j*(L.cs+L.gap),cellY=i=>L.my+i*(L.cs+L.gap);
const px=(j,v)=>cellX(j)+4+(v-RG[j][0])/(RG[j][1]-RG[j][0])*(L.cs-8),py=(i,v)=>cellY(i)+L.cs-4-(v-RG[i][0])/(RG[i][1]-RG[i][0])*(L.cs-8);
function target(){if(t>=T8)return{u:uUser,o:oUser,b:bUser};if(t>=T7&&t<T7+1.6)return{u:0,o:1,b:0};if(t>=T7+1.6&&t<T8)return{u:0,o:0,b:0};if(t>=T6+1.6&&t<T7)return{u:0,o:1,b:1};return{u:t>=T5+.6&&t<T5+1.4?1:0,o:1,b:0}}

function draw(){
  const C={ink:col('--ink'),muted:col('--muted'),line:col('--line'),paper:col('--paper'),soft:col('--soft'),c1:col('--c1'),c2:col('--c2'),c3:col('--c3'),c4:col('--c4')};
  const{W,H,narrow,tx,ty,tw,nrow,mx,my,S,gap,cs,colX}=L;ctx.clearRect(0,0,W,H);
  const txt=(s,x,y,color,font,align='center',a=1)=>{if(a<=0)return;ctx.globalAlpha=a;ctx.fillStyle=color;ctx.font=font;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.globalAlpha=1};
  const fin=t>=T8,a0=clamp(t/.5);
  const pTab=a0*(1-clamp((t-T4-1.6)/.6)),pDiag=clamp((t-T2)/2),pPair=clamp((t-T3)/2.2),pAll=clamp((t-T4)/2),pUp=fin?1:clamp((t-T5)/.6),pR=1-uCur;
  const rows=oCur>.5?REC:REC.filter(r=>!r.out),Rm=oCur>.5?RIN:ROUT;
  // 셀 틀
  for(let i=0;i<K;i++)for(let j=0;j<K;j++){const show=i===j?pDiag>0:(i>j?(i===1&&j===0?pPair>0:pAll>0):pUp>0);if(!show&&t<T2)continue;
    ctx.globalAlpha=a0*(show?1:.35);ctx.fillStyle=C.paper;ctx.fillRect(cellX(j),cellY(i),cs,cs);ctx.strokeStyle=C.line;ctx.strokeRect(cellX(j)+.5,cellY(i)+.5,cs-1,cs-1);ctx.globalAlpha=1}
  // 바깥 축 이름
  for(let j=0;j<K;j++){txt(`${VN[j]}(${VU[j]})`,cellX(j)+cs/2,my+S+(narrow?14:18),C.muted,`${narrow?10:11.5}px ${SANS}`,'center',a0);
    ctx.save();ctx.translate(mx-(narrow?10:12),cellY(j)+cs/2);ctx.rotate(-Math.PI/2);txt(VN[j],0,0,C.muted,`${narrow?10:11.5}px ${SANS}`,'center',a0);ctx.restore()}
  // 원자료 표
  const rowY=k=>ty+30+k*15;
  if(pTab>0){ctx.globalAlpha=pTab;ctx.fillStyle=C.paper;ctx.fillRect(tx,ty,tw,30+nrow*15+20);ctx.strokeStyle=C.line;ctx.strokeRect(tx+.5,ty+.5,tw-1,30+nrow*15+19);ctx.globalAlpha=1;
    const hx=[tx+8,tx+tw*.36,tx+tw*.55,tx+tw*.74,tx+tw*.92];const hi=t>=T2&&t<T3?Math.min(3,Math.floor((t-T2)/.55)):t>=T3&&t<T4?-2:-1;
    ['단지','면적','가격','연식','역거리'].forEach((h,c)=>txt(h,hx[c],ty+16,(hi===c-1||(hi===-2&&(c===1||c===2)))?C.c4:C.muted,`700 ${narrow?10:11}px ${SANS}`,c?'right':'left',pTab));
    for(let k=0;k<nrow;k++){const r=REC[k];txt(r.id,hx[0],rowY(k)+4,C.ink,`${narrow?10:11}px ${MONO}`,'left',pTab);r.v.forEach((v,c)=>txt(String(v),hx[c+1],rowY(k)+4,(hi===c||(hi===-2&&c<2))?C.c4:C.ink,`${narrow?10:11}px ${MONO}`,'right',pTab))}
    txt(`… 모두 ${REC.length}개 단지 (한 줄 = 단지 하나)`,hx[0],rowY(nrow)+6,C.muted,`${narrow?10:11}px ${SANS}`,'left',pTab);L.hx=hx}
  const hx=L.hx||[tx,tx,tx,tx,tx];const src=(r,c)=>[hx[c+1]-10,rowY(Math.min(r.rowI,nrow))];
  // 대각선: 히스토그램
  const hits=[];
  for(let j=0;j<K;j++){const pj=clamp((t-T2-j*.55)/1.1);if(pj<=0&&!fin)continue;const nb=8,cnt=Array(nb).fill(0),idx=[];const x0=cellX(j),y0=cellY(j);
    rows.forEach(r=>{const b=Math.min(nb-1,Math.floor((r.v[j]-RG[j][0])/(RG[j][1]-RG[j][0])*nb));idx.push([r,b,cnt[b]++])});const mxc=Math.max(...cnt),bw=(cs-8)/nb,dh=(cs-26)/Math.max(mxc,1);
    const pBar=fin?1:clamp((pj-.75)/.25);
    if(pBar<1)idx.forEach(([r,b,k])=>{const pp=ease(clamp((pj-r.d*.5)/.5));const[sx0,sy0]=src(r,j);const x=lerp(sx0,x0+4+(b+.5)*bw,pp),y=lerp(sy0,y0+cs-4-(k+.5)*dh,pp);ctx.globalAlpha=(1-pBar)*.8;ctx.fillStyle=C.c3;ctx.beginPath();ctx.arc(x,y,narrow?1.4:2,0,7);ctx.fill();ctx.globalAlpha=1});
    cnt.forEach((c,b)=>{ctx.globalAlpha=pBar*.85;ctx.fillStyle=C.c3;ctx.fillRect(x0+4+b*bw+.5,y0+cs-4-c*dh,bw-1,c*dh);ctx.globalAlpha=1});
    txt(VN[j],x0+6,y0+(narrow?12:15),C.ink,`700 ${narrow?10.5:12.5}px ${SANS}`,'left',Math.max(pj,fin?1:0))}
  // 점(아래 삼각형, 위 거울)
  const br=BR[fin?bUser:(bA>.5?1:0)],bAl=fin?(bUser?1:0):bA;
  for(let i=0;i<K;i++)for(let j=0;j<K;j++){if(i===j)continue;const lower=i>j;

  {t:'같은 단지를 모든 칸에서 따라간다',e:'비싼 단지만 색칠하면 그 단지들이 넓은지, 새것인지, 역에서 가까운지 한꺼번에 보입니다.',u:'연결 강조로 하위집단의 다변량 프로파일을 추적합니다. 상관계수 행렬로는 불가능한 관측치 수준 해석입니다.',x:'비싼 5곳은 <b>더 넓고 역에서 더 가까움</b>.'},
  {t:'회귀분석 전 점검에 딱 좋다',e:'어떤 변수를 회귀식에 넣을지, 이상한 점은 없는지 미리 확인할 수 있습니다.',u:'비선형성, 이상치, 독립변수 간 상관(다중공선성)을 모형 적합 전에 탐지합니다.',x:'면적↔연식 <b>r≈0</b> → 함께 넣어도 공선성 걱정 적음.'},
  {t:'숫자와 모양을 함께 본다',e:'위 칸의 r 숫자와 아래 칸의 점 모양을 같이 보면 숫자의 의미를 오해하지 않습니다.',u:'상관계수(요약)와 산점도(형태)를 병치해 r의 한계(비선형, 이상치)를 보완합니다.',x:'위 <b>r</b> + 아래 <b>점</b>.'}],
 con:[
  {t:'변수가 많으면 칸이 너무 작다',e:'변수가 8개면 칸이 64개라서 하나하나가 너무 작아집니다.',u:'셀 수가 p²으로 증가해 해상도가 급감합니다. 변수 선별, 목표변수 행만 표시, 차원축소(PCA)를 고려합니다.',x:'변수 4개 = 16칸, 8개 = <b>64칸</b>.'},
  {t:'이상치 하나에 r이 흔들린다',e:'점 60개 중 하나만 이상해도 상관계수가 꽤 바뀝니다.',u:'피어슨 r은 고레버리지 관측치에 민감합니다. 스피어만 상관 또는 이상치 제외 민감도 분석을 병행합니다.',x:`면적↔가격 <b>${RIN[1][0].toFixed(2)} → ${ROUT[1][0].toFixed(2)}</b>.`},
  {t:'점이 많으면 덩어리로 겹친다',e:'단지가 수천 개면 점이 겹쳐 까만 덩어리가 되어 모양을 알기 어렵습니다.',u:'대표본에서 과대도시(overplotting)가 발생합니다. 투명도, 표본 추출, 헥스빈·2D 밀도로 대체합니다.',x:'실거래 수만 건 → <b>헥스빈</b> 행렬.'},
  {t:'두 변수씩만 본다',e:'세 변수가 함께 만드는 관계(예: 같은 면적이면 새것일수록 비싼가)는 바로 보이지 않습니다.',u:'쌍별 투영만 보여주므로 조건부 관계·상호작용은 직접 드러나지 않습니다. 색(제3변수), 회귀모형으로 보완합니다.',x:'연결 강조나 <b>버블 차트</b>로 보완.'}],
 tip:{e:'<b>정리:</b> 표의 열은 대각선 분포로, 두 열의 짝은 산점도로 바뀌어 산점도 행렬이 됩니다. 관심 변수(가격)의 줄을 먼저 읽고, r 숫자와 점 모양을 함께 보고, 이상치를 확인하세요.',
      u:'<b>권장 사용법:</b> ① 대각 주변분포 ② 목표변수 행 우선 판독 ③ 하삼각 산점도 + 상삼각 r ④ 연결 강조로 하위집단 추적 ⑤ 이상치·비선형 점검(스피어만 병행) ⑥ p가 크면 선별·PCA. JAMOVI: 회귀 → 상관행렬 → 도표 옵션.'}};
$('foot').textContent=`※ 단지 ${REC.length}곳의 면적·가격·연식·역거리는 설명용으로 만든 예시 값이며 실제 통계가 아닙니다(단지60은 일부러 넣은 이상치). 상관계수는 이 값으로 직접 계산했습니다. 위 설명 수준 버튼으로 페이지 전체의 설명이 바뀝니다.`;

function renderText(){$('lede').textContent=LEDE[lv];
  $('rNote').textContent=lv==='e'?'칸의 위치마다 그리는 내용이 다릅니다.':'셀 위치별 내용과 판독 요령입니다.';
  $('rBody').innerHTML=RD.map(([n,a,b])=>`<tr><td><b>${n}</b></td><td>${a[lv]}</td><td>${b[lv]}</td></tr>`).join('');
  $('chkNote').textContent=lv==='e'?'산점도 행렬을 만들거나 읽을 때 다섯 가지를 확인하세요.':'작성·판독 점검 항목입니다.';
  $('chk').innerHTML=CHK[lv].map(c=>`<li>${c}</li>`).join('');
  const item=o=>`<li><strong>${o.t}</strong><p>${lv==='e'?o.e:o.u}</p><span class="ex">예: ${o.x}</span></li>`;
  $('proList').innerHTML=PC.pro.map(item).join('');$('conList').innerHTML=PC.con.map(item).join('');$('pcTip').innerHTML=PC.tip[lv];
  $('lvE').setAttribute('aria-pressed',lv==='e');$('lvU').setAttribute('aria-pressed',lv==='u');lastPhase=-1}
function phaseIdx(){let p=0;STEPS.forEach((s,i)=>{if(t>=s.t)p=i});return p}
function ui(){const p=phaseIdx();
  if(p!==lastPhase){lastPhase=p;$('phase').innerHTML=`<span class="k">${p+1}/${STEPS.length}</span>${STEPS[p].n}`;$('caption').textContent=p===STEPS.length-1?finalMsg():STEPS[p][lv];
    [...$('steps').querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',i===p))}
  $('scrub').value=t;$('tout').textContent=t.toFixed(1)+'초';$('play').textContent=playing?'일시정지':(t>=TOTAL?'다시 재생':'재생')}
let prev=performance.now();
function frame(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;if(playing){t+=dt*speed;if(t>=TOTAL){t=TOTAL;playing=false}}
  const g=target(),k=snap?1:Math.min(1,dt*4);snap=false;uCur=lerp(uCur,g.u,k);oCur=lerp(oCur,g.o,k);bA=lerp(bA,g.b?1:0,k);draw();ui();requestAnimationFrame(frame)}
function toEnd(){if(t<T8){t=T8+.6;playing=false}lastPhase=-1}

$('steps').innerHTML=STEPS.map((s,i)=>`<li><button type="button" id="st${i}"><b>${i+1}단계</b><strong>${s.n}</strong><small>${s.s}</small></button></li>`).join('');
STEPS.forEach((s,i)=>$('st'+i).onclick=()=>{t=s.t;playing=true;lastPhase=-1;snap=true});
$('play').onclick=()=>{if(t>=TOTAL)t=0;playing=!playing;lastPhase=-1};
$('restart').onclick=()=>{t=0;playing=true;lastPhase=-1;snap=true};
$('speed').onchange=e=>speed=+e.target.value;
$('uSel').onchange=e=>{uUser=+e.target.value;toEnd()};$('bSel').onchange=e=>{bUser=+e.target.value;toEnd()};$('oSel').onchange=e=>{oUser=+e.target.value;toEnd()};
const setPtr=e=>{const r=cv.getBoundingClientRect();ptr={x:e.clientX-r.left,y:e.clientY-r.top}};cv.addEventListener('pointermove',setPtr);cv.addEventListener('pointerdown',setPtr);cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')ptr=null});
$('scrub').oninput=e=>{t=+e.target.value;playing=false;lastPhase=-1;snap=true};
$('lvE').onclick=()=>{lv='e';try{localStorage.setItem('splomLv',lv)}catch(e){}renderText()};
$('lvU').onclick=()=>{lv='u';try{localStorage.setItem('splomLv',lv)}catch(e){}renderText()};
window.addEventListener('resize',layout);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
layout();renderText();
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){t=TOTAL;playing=false}
requestAnimationFrame(frame);
})();
</script>

</body>
