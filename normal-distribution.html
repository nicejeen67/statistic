<title>정규분포 영상 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위 16:9 칠판(녹화되는 영상) → 아래 재생 조작 / 축 변화 / 데이터 패널. 단일 칠판 테마 */
:root{
  --board:#1d3a32; --board-2:#16302a; --chalk:#ecebe3; --chalk-dim:#9fb3a9;
  --yellow:#f1d473; --pink:#f0a0a0; --rule:rgba(236,235,227,.2);
  --f-chalk:"Gaegu","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--board);color:var(--chalk)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-family:var(--f-chalk);font-weight:700;font-size:clamp(26px,3.6vw,38px);line-height:1.1;margin:0}
h1 small{font-size:.5em;color:var(--chalk-dim);font-weight:400;margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-size:14px;color:var(--chalk-dim)}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--board-2)}
.btn{all:unset;cursor:pointer;padding:7px 14px;border:1.5px solid var(--rule);border-radius:999px;font-size:14px;color:var(--chalk)}
.btn.main{background:var(--yellow);color:var(--board-2);border-color:var(--yellow);font-weight:700}
.btn.rec{border-color:var(--pink);color:var(--pink)}
.btn[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.stage{border:8px solid #5a4632;border-radius:6px;background:var(--board-2);box-shadow:0 10px 30px rgba(0,0,0,.35)}
canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%}
.timeline{display:flex;flex-direction:column;gap:8px}
#scrub{width:100%;accent-color:var(--yellow)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{all:unset;cursor:pointer;font-size:13.5px;padding:4px 10px;border-radius:6px;border:1px dashed var(--rule);color:var(--chalk-dim)}
.steps button.on{border-style:solid;border-color:var(--yellow);color:var(--yellow)}
.steps button.done{color:var(--chalk)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.box{border:1px dashed var(--rule);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.box h3{margin:0;font-family:var(--f-chalk);font-size:22px;color:var(--yellow)}
.read{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.read span{color:var(--chalk-dim)}
.read b{font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.read b.chg{color:var(--yellow)}
.f{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;font-size:13.5px}
.f label{color:var(--chalk-dim)}
select,input[type=file]{width:100%;min-width:0;background:var(--board-2);color:var(--chalk);border:1px solid var(--rule);border-radius:6px;padding:5px 6px;font:inherit;font-size:13.5px}
.hint{font-size:13px;color:var(--chalk-dim);margin:0}
.say{font-family:var(--f-chalk);font-size:21px;line-height:1.35;margin:0}
.msg{font-size:13.5px;color:var(--pink);margin:0;min-height:1em}
.chk{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--chalk-dim)}
body:not(.uni) .lv-uni{display:none!important}
body.uni .lv-mid{display:none!important}
</style>

<div class="wrap">
  <header>
    <h1>정규분포 영상 스튜디오 <small>AI부동산통계기초</small></h1>
    <div class="bar">
      <div class="seg" role="group" aria-label="장면">
        <button id="sc1" aria-pressed="true">① 하나일 때</button>
        <button id="sc2" aria-pressed="false">② 여러 개일 때</button>
      </div>
      <div class="seg" role="group" aria-label="설명 수준">
        <button id="lvMid" aria-pressed="true">중학생 수준</button>
        <button id="lvUni" aria-pressed="false">대학 수준</button>
      </div>
    </div>
  </header>

  <div class="stage"><canvas id="cv" width="1920" height="1080" aria-label="정규분포 애니메이션 영상 화면"></canvas></div>

  <div class="timeline">
    <div class="bar">
      <button class="btn main" id="play">▶ 재생</button>
      <button class="btn" id="prev">◀ 이전 단계</button>
      <button class="btn" id="next">다음 단계 ▶</button>
      <div class="seg" role="group" aria-label="속도">
        <button data-sp="0.5" aria-pressed="false">0.5×</button>
        <button data-sp="1" aria-pressed="true">1×</button>
        <button data-sp="1.5" aria-pressed="false">1.5×</button>
      </div>
      <button class="btn rec" id="rec">● 이 장면 영상 저장(WebM)</button>
    </div>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="재생 위치">
    <div class="steps" id="steps"></div>
    <p class="msg" id="msg"></p>
  </div>

  <div class="grid">
    <div class="box">
      <h3>축 변화</h3>
      <div class="read">
        <span>X축 범위</span><b id="rX"></b>
        <span>X축 의미</span><b id="rXu"></b>
        <span>Y축 범위</span><b id="rY"></b>
        <span>Y축 의미</span><b id="rYu"></b>
        <span>계급 폭</span><b id="rBw"></b>
        <span>쌓인 데이터</span><b id="rN"></b>
      </div>
    </div>
    <div class="box">
      <h3>이 단계에서 말할 내용</h3>
      <p class="say" id="say"></p>
      <p class="hint">이 칸은 영상에 녹화되지 않습니다.</p>
    </div>
    <div class="box">
      <h3>P값 설정</h3>
      <div class="f"><label for="ptarget">P값 ① 가격</label><input type="number" id="ptarget" step="0.1" style="width:100%;min-width:0;background:var(--board-2);color:var(--chalk);border:1px solid var(--rule);border-radius:6px;padding:5px 6px;font:inherit"></div>
      <div class="f"><label for="pair">P값 ② 비교</label><select id="pair"></select></div>
      <div class="f"><label for="alpha">유의수준 α</label><select id="alpha"><option value="0.05" selected>0.05 (5%)</option><option value="0.01">0.01 (1%)</option><option value="0.1">0.10 (10%)</option></select></div>
      <p class="hint">데이터: 가상 예시 — A구·B구·C구 아파트 매매가 740건(단위 억원)</p>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const W=1920,H=1080,PL=180,PR=90,PT=170,PB=170,PW=W-PL-PR,PH=H-PT-PB;
const K={bg:'#1d3a32',chalk:'#ecebe3',dim:'#9fb3a9',yellow:'#f1d473',pink:'#f0a0a0'};
const GC=['#8ec5ee','#b5e3a1','#f0a0a0','#f5b97a'];
const FT=s=>`700 ${s}px Gaegu, "Gowun Dodum", sans-serif`, FB=s=>`${s}px "Gowun Dodum", sans-serif`, FN=s=>`${s}px "IBM Plex Mono", monospace`;
const $=id=>document.getElementById(id);
let uni=false;

/* ---------- 수학 도구 ---------- */
const pdf=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
function lgam(x){const c=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5)return Math.log(Math.PI/Math.abs(Math.sin(Math.PI*x)))-lgam(1-x);x-=1;let a=0.99999999999980993;const t=x+7.5;for(let i=0;i<8;i++)a+=c[i]/(x+i+1);
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);}
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;
  for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break;}return h;}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgam(a+b)-lgam(a)-lgam(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
const tP2=(t,df)=>ibeta(df/(df+t*t),df/2,0.5); // 양측 P값
const tpdf=(t,df)=>Math.exp(lgam((df+1)/2)-lgam(df/2)-0.5*Math.log(df*Math.PI)-(df+1)/2*Math.log(1+t*t/df));
function invP(fn,alpha){let lo=0,hi=50;for(let i=0;i<80;i++){const m=(lo+hi)/2;fn(m)>alpha?lo=m:hi=m;}return (lo+hi)/2;}
const pTxt=p=>p<0.001?'< 0.001':p.toFixed(3);
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const sdv=(a,m)=>Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/Math.max(1,a.length-1))||1;
function quant(sorted,p){const i=(sorted.length-1)*p,lo=Math.floor(i);return sorted[lo]+(sorted[Math.min(sorted.length-1,lo+1)]-sorted[lo])*(i-lo);}
function niceStep(range,n){const raw=range/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/mag;return (r<1.5?1:r<3?2:r<7?5:10)*mag;}
function fmt(v,step){const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));return (Math.abs(v)<step/1e6?0:v).toFixed(Math.min(d,4));}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function shuffle(n,seed){const r=rng(seed),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- 데이터 ---------- */
let source='가상 예시 데이터';
let DATA=[]; // {v,g}
let unitName='억원';
function sampleData(){const r=rng(7),out=[];const gs=[['A구',8,1.2,240],['B구',11,1.5,300],['C구',14,2.2,200]];
  gs.forEach(([n,m,s,c])=>{for(let i=0;i<c;i++){const u1=r()||1e-9,u2=r();out.push({v:+(m+s*Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2)).toFixed(2),g:n});}});
  return out;}

/* ---------- 모델 계산 ---------- */
let M1=null,M2=null;
function binsSetup(vals){const s=[...vals].sort((a,b)=>a-b);const n=s.length;
  let lo=n>=200?quant(s,.005):s[0],hi=n>=200?quant(s,.995):s[n-1];if(hi-lo<1e-9){lo-=1;hi+=1;}
  const k=Math.round(clamp(Math.sqrt(n),12,36));const bw=(hi-lo)/k;return {lo,hi,k,bw};}
function build(){
  const vals=DATA.map(d=>d.v);const B=binsSetup(vals);const mu=mean(vals),sg=sdv(vals,mu);
  const pts=[];DATA.forEach(d=>{const b=Math.floor((d.v-B.lo)/B.bw);const bi=d.v===B.hi?B.k-1:b;if(bi>=0&&bi<B.k)pts.push({v:d.v,b:bi,g:d.g});});
  const counts=new Array(B.k).fill(0);pts.forEach(p=>counts[p.b]++);
  const Nin=pts.length;
  M1={...B,mu,sg,pts,order:shuffle(pts.length,11),counts,Nin,N:vals.length,maxC:Math.max(...counts),
    w1:vals.filter(v=>Math.abs(v-mu)<=sg).length/vals.length,w2:vals.filter(v=>Math.abs(v-mu)<=2*sg).length/vals.length};
  $('ptarget').value=(mu+2.3*sg).toFixed(sg<1?2:1);
  if(!document.getElementById('pair'))return;$('pair').innerHTML='';
  // 장면 2: 그룹
  const gmax=3;const cnt={};DATA.forEach(d=>{if(d.g!=null&&d.g!=='')cnt[d.g]=(cnt[d.g]||0)+1;});
  const names=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,gmax).filter(n=>cnt[n]>=10);
  if(names.length<2){M2=null;return;}
  const sub=DATA.filter(d=>names.includes(d.g));const B2=binsSetup(sub.map(d=>d.v));
  const G=names.map((n,i)=>{const v=sub.filter(d=>d.g===n).map(d=>d.v);const m=mean(v);return {name:n,mu:m,sg:sdv(v,m),n:0,counts:new Array(B2.k).fill(0),color:GC[i]};});
  const p2=[];sub.forEach(d=>{const gi=names.indexOf(d.g);const b=d.v===B2.hi?B2.k-1:Math.floor((d.v-B2.lo)/B2.bw);if(b>=0&&b<B2.k){p2.push({v:d.v,b,gi});G[gi].counts[b]++;G[gi].n++;}});
  const stack=new Array(B2.k).fill(0);G.forEach(gg=>gg.counts.forEach((c,i)=>stack[i]+=c));
  const allv=p2.map(p=>p.v),amu=mean(allv),asg=sdv(allv,amu);
  let maxDens=0,maxDensZ=0,Mz=3.5;G.forEach(gg=>{gg.counts.forEach(c=>{const d=c/(gg.n*B2.bw);maxDens=Math.max(maxDens,d);maxDensZ=Math.max(maxDensZ,d*gg.sg);});
    Mz=Math.max(Mz,Math.min(6,Math.abs((B2.lo-gg.mu)/gg.sg)),Math.min(6,Math.abs((B2.hi-gg.mu)/gg.sg)));});
  M2={...B2,G,pts:p2,order:shuffle(p2.length,23),stack,Nin:p2.length,amu,asg,
    maxGC:Math.max(...G.flatMap(gg=>gg.counts)),maxStack:Math.max(...stack),maxDens,maxDensZ,Mz};
  // 두 지역 평균 차이 Welch t검정 (전체 값 사용)
  const full=names.map(n=>{const v=sub.filter(d=>d.g===n).map(d=>d.v);const m=mean(v);return {m,s:sdv(v,m),n:v.length};});
  M2.tests=[];for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){const a=full[i],b=full[j];
    const va=a.s*a.s/a.n,vb=b.s*b.s/b.n,se=Math.sqrt(va+vb),t=(a.m-b.m)/se,df=(va+vb)**2/(va*va/(a.n-1)+vb*vb/(b.n-1));
    M2.tests.push({i,j,ma:a.m,mb:b.m,diff:a.m-b.m,se,t,df,p:tP2(t,df)});}
  const sel=$('pair');sel.innerHTML=M2.tests.map((T,k)=>`<option value="${k}">${names[T.i]} vs ${names[T.j]}</option>`).join('');
  let best=0;M2.tests.forEach((T,k)=>{if(Math.abs(T.t)<Math.abs(M2.tests[best].t))best=k;});sel.value=best;
}
function curTest(){return M2&&M2.tests?M2.tests[+$('pair').value||0]:null;}
const ALPHA=()=>+$('alpha').value;
function targetZ(){const m=M1;const x=parseFloat($('ptarget').value);return isFinite(x)?(x-m.mu)/m.sg:2.3;}

/* ---------- 라벨 ---------- */
function L(){const lg=false;const u=lg?`ln(${unitName})`:unitName;
  return uni?{x:`X (${u})`,xs:u,yc:'도수',yd:'밀도 f(x)',z:'Z = (X − μ) / σ',zs:'Z'}
            :{x:`가격 (${u})`,xs:u,yc:'집 수(도수)',yd:'밀도(비율 ÷ 폭)',z:'평균에서 몇 칸(σ) 떨어졌나',zs:'칸(σ)'};}

/* ---------- 뷰(축) ---------- */
function view(x0,x1,y1,xu,yu,xs){return {x0,x1,y1,xu,yu,xs,sx:v=>PL+(v-x0)/(x1-x0)*PW,sy:v=>PT+PH-v/y1*PH};}
function V1(st){const m=M1,l=L(),dF=1/(m.Nin*m.bw);
  if(st==='count')return view(m.lo,m.hi,m.maxC*1.22,l.x,l.yc,l.xs);
  if(st==='dens')return view(m.lo,m.hi,m.maxC*dF*1.22,l.x,l.yd,l.xs);
  const zl=(m.lo-m.mu)/m.sg,zh=(m.hi-m.mu)/m.sg,Mx=Math.min(6,Math.max(3.5,Math.abs(zl),Math.abs(zh)));
  return view(-Mx,Mx,m.maxC*dF*m.sg*1.22,l.z,l.yd,l.zs);}
function R1(st,v,cnts){const m=M1,dF=1/(m.Nin*m.bw);return (cnts||m.counts).map((c,i)=>{let a=m.lo+i*m.bw,b=a+m.bw,h=c;
  if(st!=='count')h=c*dF;if(st==='z'){a=(a-m.mu)/m.sg;b=(b-m.mu)/m.sg;h*=m.sg;}return [v.sx(a),v.sx(b),v.sy(0),v.sy(h)];});}
function C1(st,v){const m=M1,out=[];for(let i=0;i<=240;i++){const x=m.lo+(m.hi-m.lo)*i/240;let y=pdf(x,m.mu,m.sg),xx=x;
  if(st==='count')y*=m.Nin*m.bw;if(st==='z'){xx=(x-m.mu)/m.sg;y*=m.sg;}out.push([v.sx(xx),v.sy(y)]);}return out;}
function V2(st){const m=M2,l=L();
  if(st==='count')return view(m.lo,m.hi,m.maxGC*1.22,l.x,l.yc,l.xs);
  if(st==='stack')return view(m.lo,m.hi,m.maxStack*1.22,l.x,l.yc,l.xs);
  if(st==='dens')return view(m.lo,m.hi,m.maxDens*1.22,l.x,l.yd,l.xs);
  return view(-m.Mz,m.Mz,Math.max(m.maxDensZ,.399)*1.22,l.z,l.yd,l.zs);}
function R2(st,v,part){const m=M2,cum=new Array(m.k).fill(0);
  return m.G.map((gg,gi)=>(part?part[gi]:gg.counts).map((c,i)=>{let a=m.lo+i*m.bw,b=a+m.bw,y0=0,y1=c;
    if(st==='stack'){y0=cum[i];y1=cum[i]+c;cum[i]=y1;}
    if(st==='dens'||st==='z')y1=c/(gg.n*m.bw);
    if(st==='z'){a=(a-gg.mu)/gg.sg;b=(b-gg.mu)/gg.sg;y1*=gg.sg;}
    return [v.sx(a),v.sx(b),v.sy(y0),v.sy(y1)];}));}
function C2(st,v,gi){const m=M2,gg=m.G[gi],out=[];for(let i=0;i<=240;i++){const x=m.lo+(m.hi-m.lo)*i/240;let y=pdf(x,gg.mu,gg.sg),xx=x;
  if(st==='count'||st==='stack')y*=gg.n*m.bw;if(st==='z'){xx=(x-gg.mu)/gg.sg;y*=gg.sg;}out.push([v.sx(xx),v.sy(y)]);}return out;}

  g.font=FB(30);g.fillStyle=K.chalk;g.textAlign='right';g.textBaseline='top';g.fillText(v.xu,PL+PW+20,PT+PH+64);

function bars(R,color,fa,sa){g.fillStyle=rgba(color,fa);g.strokeStyle=rgba(color,sa);g.lineWidth=2;
  R.forEach(([a,b,y0,y1])=>{if(Math.abs(y0-y1)<0.5)return;g.fillRect(a,y1,b-a,y0-y1);g.strokeRect(a+1,y1,b-a-2,y0-y1);});}
function line(P,color,w,frac,dash){const n=Math.max(1,Math.floor(P.length*(frac==null?1:frac)));g.save();g.strokeStyle=color;g.lineWidth=w;g.lineJoin='round';g.setLineDash(dash||[]);
  g.beginPath();for(let i=0;i<n;i++)i?g.lineTo(P[i][0],P[i][1]):g.moveTo(P[i][0],P[i][1]);g.stroke();g.restore();}
function vl(x,y0,y1,color,w,dash){g.save();g.strokeStyle=color;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x,y0);g.lineTo(x,y1);g.stroke();g.restore();}
function txt(s,x,y,font,color,al,bl){g.font=font;g.fillStyle=color;g.textAlign=al||'left';g.textBaseline=bl||'alphabetic';g.fillText(s,x,y);}

function frame(ts){const dt=last?Math.min(.1,(ts-last)/1000):0;last=ts;
  if(playing){const S=STEPS();u+=dt*speed/S[step].d;if(u>=1){if(step<S.length-1){step++;u=0;snap=true;cur=null;}else{u=1;setPlay(false);if(rec&&rec.state==='recording')setTimeout(()=>rec.stop(),600);}}}
  try{scene===1?drawScene1(dt):drawScene2(dt);}catch(e){console.error(e);}
  snap=false;ui();requestAnimationFrame(frame);}

  if(!scrubbing)$('scrub').value=Math.round(el/tot*1000);
  const v=shown.v;if(v){const xs=niceStep(v.x1-v.x0,8),ys=niceStep(v.y1,5);
    setR('rX',`${fmt(v.x0,xs/10)} ~ ${fmt(v.x1,xs/10)}`);setR('rXu',v.xu);setR('rY',`0 ~ ${fmt(v.y1,ys/10)}`);setR('rYu',v.yu);}

  const key=scene+'|'+step+'|'+uni;if(key!==lastUI){lastUI=key;
    $('steps').innerHTML=S.map((s,i)=>`<button data-i="${i}" class="${i===step?'on':i<step?'done':''}">${i+1}. ${uni?s.uni:s.mid}</button>`).join('');
    $('say').textContent=SAY[scene][uni?'uni':'mid'][step];}
  setR('rN',m?(step===0&&scene===scene?'쌓는 중… ':'')+(scene===1?m.N:m.Nin).toLocaleString()+'건':'-');}
const prevVals={};function setR(id,t){const e=$(id);if(e.textContent!==t){e.textContent=t;e.classList.add('chg');clearTimeout(prevVals[id]);prevVals[id]=setTimeout(()=>e.classList.remove('chg'),400);}}

/* ---------- 조작 ---------- */
function setPlay(p){playing=p;$('play').textContent=p?'❚❚ 일시정지':'▶ 재생';}
$('play').onclick=()=>{const S=STEPS();if(!playing&&step===S.length-1&&u>=1){step=0;u=0;snap=true;}setPlay(!playing);};
$('prev').onclick=()=>{if(u>.15)u=0;else step=Math.max(0,step-1),u=0;snap=true;};
$('next').onclick=()=>{const S=STEPS();if(step<S.length-1){step++;u=0;}else u=1;snap=true;};
$('steps').onclick=e=>{const b=e.target.closest('button');if(!b)return;step=+b.dataset.i;u=0;snap=true;};
let scrubbing=false;$('scrub').addEventListener('input',()=>{scrubbing=true;const S=STEPS(),tot=S.reduce((a,s)=>a+s.d,0);let t=$('scrub').value/1000*tot;
  for(let i=0;i<S.length;i++){if(t<=S[i].d||i===S.length-1){step=i;u=clamp(t/S[i].d);break;}t-=S[i].d;}snap=true;});

document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',x===b));});

/* 영상 저장 */
$('rec').onclick=()=>{const msg=$('msg');
  if(!window.MediaRecorder||!cv.captureStream){msg.textContent='이 브라우저는 화면 녹화를 지원하지 않습니다. 크롬이나 엣지에서 열어 주세요.';return;}
  try{const stream=cv.captureStream(30);const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    const chunks=[];rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:8e6}:{});
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    rec.onstop=async()=>{const blob=new Blob(chunks,{type:'video/webm'});const name=`정규분포_${scene===1?'하나':'여러개'}_${uni?'대학':'중학생'}.webm`;rec=null;
      let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(_){dl=null;}
      if(dl){try{await dl.save({filename:name,data:blob});msg.textContent='영상을 저장했습니다: '+name;}
        catch(err){msg.textContent=err&&err.code==='declined'?'저장을 취소했습니다. 다시 녹화하려면 버튼을 누르세요.':'이 화면에서는 저장할 수 없습니다. 다운로드한 HTML 파일을 크롬에서 열어 녹화해 주세요.';}return;}
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
      msg.textContent='녹화가 끝났습니다: '+name+' (다운로드 폴더를 확인하세요)';};
    step=0;u=0;snap=true;rec.start(500);setPlay(true);msg.textContent='녹화 중… 장면이 끝나면 자동으로 저장됩니다.';
  }catch(e){msg.textContent='녹화를 시작하지 못했습니다: '+e.message;}};

/* 시작 */
DATA=sampleData();build();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{snap=true;});
requestAnimationFrame(frame);
})();
</script>
