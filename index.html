<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI부동산통계기초 | 서울사이버대학교 AI부동산학과</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --ink:#1d2433; --muted:#6b7385; --line:#e3e7ef;
    --brand:#1f4e9c; --brand-2:#2f6fd6; --brand-soft:#e8f0fd;
    --graph:#0f8a6a; --graph-soft:#e3f5ef;
    --accent:#1f4e9c; --accent-soft:#e8f0fd;
    --active:#ffb020;
  }
  body.g-graph{ --accent:var(--graph); --accent-soft:var(--graph-soft); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}

  /* ===== 헤더 ===== */
  header{background:linear-gradient(120deg,#163a78,#2f6fd6);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-shrink:0}
  .logo{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:900;font-size:18px}
  header h1{font-size:20px;font-weight:900;letter-spacing:-.5px;cursor:pointer}
  header p{font-size:13px;opacity:.85}
  .menu-toggle{display:none;margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;font-size:20px;border-radius:8px;padding:6px 12px;cursor:pointer}

  .layout{flex:1;display:flex;min-height:0}

  /* ===== 사이드바 ===== */
  aside{width:320px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;min-height:0}
  .group-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
  .group-btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-family:inherit;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px}
  .group-btn .ico{font-size:22px}
  .group-btn:hover{border-color:#c5cee0}
  .group-btn.active[data-group="stat"]{background:var(--brand);border-color:var(--brand);color:#fff}
  .group-btn.active[data-group="graph"]{background:var(--graph);border-color:var(--graph);color:#fff}

  .accordion{flex:1;overflow-y:auto;padding:10px 12px 20px}
  .acc-item{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff}
  .acc-head{width:100%;border:0;background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left}
  .acc-head:hover{background:#f7f9fc}
  .num{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
  .acc-count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
  .acc-arrow{transition:transform .25s;color:var(--muted);font-size:12px}
  .acc-item.open .acc-arrow{transform:rotate(180deg)}
  .acc-item.open .acc-head{background:var(--accent-soft)}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .acc-body ul{list-style:none;padding:4px 8px 10px}
  .acc-body li a{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 16px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
  .acc-body li a:hover{background:#f2f5fa}
  .acc-body li a.current{background:#fff6e0;border-left-color:var(--active);font-weight:700}
  .acc-body li a small{margin-left:auto;color:#a0a7b5;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}

  /* ===== 본문 ===== */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .toolbar{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .toolbar.show{display:flex}
  .toolbar button,.toolbar a{font-family:inherit;font-size:13px;color:var(--accent);background:#fff;text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:8px;white-space:nowrap;cursor:pointer}
  .toolbar button:hover,.toolbar a:hover{background:var(--accent-soft)}
  .toolbar a{margin-left:auto}
  .crumb{font-size:14px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .crumb b{color:var(--ink)}
  iframe{flex:1;width:100%;border:0;background:#fff;display:none}
  iframe.show{display:block}

  .content{flex:1;overflow-y:auto;padding:36px 32px 60px}
  .content.hide{display:none}
  .wrap{max-width:960px;margin:0 auto}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px;margin-bottom:12px}
  .wrap h2{font-size:30px;font-weight:900;letter-spacing:-1px;margin-bottom:12px}
  .lead{color:#3c4456;line-height:1.85;font-size:15.5px;margin-bottom:18px}
  .keybox{background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:16px 20px;margin-bottom:28px}
  .keybox h4{font-size:14px;color:var(--accent);margin-bottom:8px}
  .keybox ul{padding-left:18px;line-height:1.8;font-size:14.5px;color:#3c4456}

  /* 그룹 개요 카드 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.2s}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,40,80,.08);border-color:var(--accent)}
  .card h3{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .card p{font-size:13.5px;color:var(--muted);line-height:1.65;margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:12px}
  .more{font-size:13px;color:var(--accent);font-weight:700;margin-top:12px}

  /* 항목 상세 설명 */
  .topic{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px}
  .topic-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .topic-head h3{font-size:20px;font-weight:900}
  .topic-sum{font-size:15px;font-weight:500;color:var(--accent);margin-bottom:14px}
  .topic p.desc{line-height:1.85;color:#3c4456;font-size:15px;margin-bottom:14px}
  .boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .box{border-radius:10px;padding:13px 15px;font-size:14px;line-height:1.75}
  .box b{display:block;font-size:13px;margin-bottom:4px}
  .box.ex{background:#f3f7ff;border:1px solid #d9e5fb}
  .box.ex b{color:#1f4e9c}
  .box.tip{background:#fff8e8;border:1px solid #f6e2b3}
  .box.tip b{color:#a86b00}
  .go{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .go:hover{filter:brightness(1.1)}
  .go small{font-weight:400;opacity:.8}

  footer{text-align:center;font-size:12px;color:var(--muted);padding:8px;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0}

  @media (max-width:820px){
    .menu-toggle{display:block}
    aside{position:fixed;top:70px;bottom:0;left:0;z-index:20;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.15);width:min(320px,88vw)}
    aside.open{transform:none}
    .content{padding:22px 14px 50px}
    .wrap h2{font-size:23px}
    .boxes{grid-template-columns:1fr}
    .topic{padding:18px 16px}
  }
</style>
</head>
<body class="g-stat">

<header>
  <div class="logo">AI</div>
  <div>
    <h1 id="homeBtn">AI부동산통계기초</h1>
    <p>서울사이버대학교 AI부동산학과</p>
  </div>
  <button class="menu-toggle" id="menuToggle" aria-label="메뉴">☰</button>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="group-tabs">
      <button class="group-btn active" data-group="stat"><span class="ico">📊</span>통계분석</button>
      <button class="group-btn" data-group="graph"><span class="ico">📈</span>그래프 생성과 이해</button>
    </div>
    <nav class="accordion" id="accordion"></nav>
  </aside>

  <main>
    <div class="toolbar" id="toolbar">
      <button id="backBtn">← 설명으로</button>
      <span class="crumb" id="crumb"></span>
      <a id="newTab" href="#" target="_blank" rel="noopener">새 창으로 열기 ↗</a>
    </div>
    <iframe id="viewer" title="학습 콘텐츠"></iframe>
    <section class="content" id="content"><div class="wrap" id="wrap"></div></section>
  </main>
</div>

<footer>© 서울사이버대학교 AI부동산학과 · AI부동산통계기초</footer>

<script>
/* =========================================================
   메뉴 + 설명 데이터 — 내용 수정은 여기만 바꾸면 됩니다.
   t: 표시 이름, f: 연결 파일, s: 한 줄 요약, d: 자세한 설명,
   e: 부동산 예시, c: 체크포인트(주의할 점)
   ========================================================= */
const MENU = {
  stat: {
    title: "통계분석",
    desc: "통계분석은 데이터에서 ‘우연인지, 진짜 차이·관계인지’를 판단하는 도구입니다. 먼저 기술통계로 데이터의 모양을 확인하고, 평균 비교(T-검정·분산분석), 범주 비교(교차분석), 관계 파악(상관분석), 예측·설명(회귀분석) 순서로 학습합니다.",
    keys: [
      "p-값(p-value)이 0.05보다 작으면 ‘통계적으로 유의하다(우연이라 보기 어렵다)’고 판단합니다.",
      "비교할 집단이 2개면 T-검정, 3개 이상이면 분산분석을 사용합니다.",
      "변수가 범주형(예: 주택유형)이면 교차분석, 연속형(예: 가격)이면 상관·회귀분석을 사용합니다."
    ],
    sections: [
      { name: "기술통계",
        intro: "기술통계는 수많은 데이터를 몇 개의 숫자로 요약해 ‘이 데이터가 어떻게 생겼는지’ 보여주는 가장 첫 단계입니다. 아파트 실거래가 1,000건을 하나하나 볼 수는 없으므로 평균, 중앙값, 표준편차 같은 숫자로 특징을 정리합니다. 어떤 분석을 하든 기술통계로 데이터를 먼저 살펴보는 습관이 중요합니다.",
        keys: ["중심(평균·중앙값) → 퍼짐(표준편차·범위) → 모양(왜도·첨도) 순서로 봅니다.", "부동산 가격은 대부분 오른쪽으로 꼬리가 긴 분포여서 정규분포·로그치환 개념이 함께 필요합니다."],
        items: [
          { t:"기술통계량", f:"descriptiv.html",
            s:"데이터의 중심, 퍼짐, 모양을 숫자로 요약합니다.",
            d:"중심을 나타내는 값에는 평균(모두 더해 개수로 나눈 값), 중앙값(크기순으로 줄 세웠을 때 가운데 값), 최빈값(가장 많이 나온 값)이 있습니다. 퍼짐 정도는 분산·표준편차(평균에서 얼마나 떨어져 있나), 범위(최댓값−최솟값), 사분위범위(가운데 50%의 폭)로 나타냅니다. 분포의 모양은 왜도(한쪽으로 치우친 정도)와 첨도(뾰족한 정도)로 표현합니다.",
            e:"어느 구의 아파트 거래 100건 중 초고가 몇 건이 섞이면 평균은 크게 올라가지만 중앙값은 거의 변하지 않습니다. 그래서 부동산 통계에서는 ‘중위 매매가격’을 자주 발표합니다.",
            c:"평균과 중앙값의 차이가 크면 이상치(극단값)나 치우친 분포를 의심하세요." },
          { t:"정규분포란?", f:"normal-distribution.html",
            s:"평균을 중심으로 좌우 대칭인 종 모양의 분포입니다.",
            d:"정규분포는 가운데(평균)에 값이 가장 많이 몰려 있고 양쪽으로 갈수록 적어지는 종 모양입니다. 평균±1 표준편차 안에 약 68%, ±2 표준편차 안에 약 95%, ±3 표준편차 안에 약 99.7%의 자료가 들어갑니다(68-95-99.7 법칙). T-검정, 분산분석, 회귀분석 등 많은 통계기법이 ‘데이터가 정규분포를 따른다’는 가정 위에서 만들어졌기 때문에 꼭 이해해야 하는 개념입니다.",
            e:"같은 단지·같은 평형(예: 전용 84㎡)의 실거래가는 비교적 종 모양에 가깝지만, 서울 전체 아파트 가격을 모으면 고가 쪽으로 꼬리가 길게 늘어집니다.",
            c:"정규성은 히스토그램, QQ플롯, 샤피로-윌크(Shapiro-Wilk) 검정 등으로 확인합니다." },
          { t:"왜? 로그치환할까", f:"log.html",
            s:"한쪽으로 치우친 데이터를 대칭에 가깝게 바꾸는 방법입니다.",
            d:"집값, 임대료, 소득처럼 대부분은 낮은 값에 몰려 있고 일부가 매우 큰 값을 가지는 데이터는 오른쪽 꼬리가 깁니다. 이런 값에 로그(log)를 취하면 큰 값은 많이 줄고 작은 값은 조금 줄어서 분포가 정규분포에 가까워집니다. 이상치의 영향도 줄어들고, 회귀분석에서는 계수를 ‘몇 % 변화’로 해석할 수 있다는 장점이 있습니다.",
            e:"1억→2억과 10억→20억은 금액 차이(1억 vs 10억)는 크지만 둘 다 ‘2배’ 상승입니다. 로그를 취하면 두 변화가 같은 크기로 표현되어 비율 변화를 공정하게 비교할 수 있습니다.",
            c:"0이나 음수에는 로그를 취할 수 없으므로 log(x+1)처럼 보정합니다. 결과를 해석할 때는 원래 단위로 되돌려(지수변환) 설명하세요." }
        ]},
      { name: "T-검정",
        intro: "T-검정은 ‘두 평균의 차이가 우연인지, 의미 있는 차이인지’를 판단하는 방법입니다. 평균이 조금 다르다고 해서 바로 차이가 있다고 말할 수는 없습니다. 표본의 크기와 흩어짐을 함께 고려해 그 차이가 통계적으로 유의한지(p<0.05) 확인합니다.",
        keys: ["비교 대상이 ‘기준값 1개’인지, ‘서로 다른 두 집단’인지, ‘같은 대상의 전·후’인지에 따라 세 종류로 나뉩니다.", "데이터의 정규성 가정을 확인하고, 만족하지 않으면 비모수 검정(윌콕슨, 만-위트니)을 고려합니다."],
        items: [
          { t:"일표본 T-검정", f:"One-sample t-test.html",
            s:"한 집단의 평균이 특정 기준값과 다른지 검정합니다.",
            d:"표본 하나의 평균을 이미 알려진 값(정책 기준, 전국 평균, 목표값 등)과 비교합니다. 귀무가설은 ‘표본 평균 = 기준값’이며, p-값이 0.05보다 작으면 기준값과 다르다고 결론 내립니다.",
            e:"우리 지역 아파트 30개 단지의 평균 전세가율이 전국 평균 70%와 다른지 검정합니다.",
            c:"기준값은 분석 전에 정해야 하며, 표본이 너무 작으면(약 30개 미만) 정규성을 더 꼼꼼히 확인합니다." },
          { t:"독립표본 T-검정", f:"independence.html",
            s:"서로 다른 두 집단의 평균을 비교합니다.",
            d:"두 집단이 서로 겹치지 않는(독립적인) 경우 평균 차이를 검정합니다. 먼저 두 집단의 분산이 같은지(등분산성) 레빈(Levene) 검정으로 확인하고, 분산이 다르면 웰치(Welch) T-검정 결과를 사용합니다.",
            e:"역세권(역 500m 이내) 아파트와 비역세권 아파트의 ㎡당 매매가 평균이 다른지 비교합니다.",
            c:"같은 대상을 두 번 측정한 자료에는 사용하면 안 됩니다(→ 대응표본 T-검정)." },
          { t:"대응표본 T-검정", f:"paired.html",

/* ===================== 동작 코드 ===================== */
const $ = id => document.getElementById(id);
const toUrl = file => encodeURI(file);
let currentGroup = "stat";
let currentSection = -1;

function renderAccordion(group){
  currentGroup = group;
  document.body.className = "g-" + group;
  document.querySelectorAll(".group-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.group === group));

  $("accordion").innerHTML = MENU[group].sections.map((sec, i) => `
    <div class="acc-item" data-idx="${i}">
      <button class="acc-head">
        <span class="num">${i + 1}</span>${sec.name}
        <span class="acc-count">${sec.items.length}</span>
        <span class="acc-arrow">▼</span>
      </button>
      <div class="acc-body"><ul>
        ${sec.items.map((it, j) => `
          <li><a href="${toUrl(it.f)}" data-sec="${i}" data-item="${j}">
            ${it.t}<small>${it.f}</small></a></li>`).join("")}
      </ul></div>
    </div>`).join("");

  document.querySelectorAll(".acc-head").forEach(h =>
    h.addEventListener("click", () => {
      const item = h.parentElement;
      const idx = +item.dataset.idx;
      const wasOpen = item.classList.contains("open");
      setOpen(wasOpen ? -1 : idx);
      if (wasOpen) showGroup(); else showSection(idx);
    }));
  document.querySelectorAll(".acc-body a").forEach(a =>
    a.addEventListener("click", e => { e.preventDefault(); openPage(+a.dataset.sec, +a.dataset.item); }));
}

/* 아코디언: 한 번에 한 섹션만 펼침 */
function setOpen(idx){
  document.querySelectorAll(".acc-item").forEach((it, i) => {
    const body = it.querySelector(".acc-body");
    if (i === idx){ it.classList.add("open"); body.style.maxHeight = body.scrollHeight + "px"; }
    else { it.classList.remove("open"); body.style.maxHeight = null; }
  });
}

function showContent(html){
  $("viewer").classList.remove("show");
  $("viewer").removeAttribute("src");
  $("toolbar").classList.remove("show");
  $("content").classList.remove("hide");
  $("wrap").innerHTML = html;
  $("content").scrollTop = 0;
  document.querySelectorAll(".acc-body a").forEach(x => x.classList.remove("current"));
}

const keyBox = (title, list) => list && list.length
  ? `<div class="keybox"><h4>${title}</h4><ul>${list.map(k => `<li>${k}</li>`).join("")}</ul></div>` : "";

/* 그룹 첫 화면: 대분류 개요 */
function showGroup(){
  currentSection = -1;
  const g = MENU[currentGroup];
  showContent(`
    <span class="tag">서울사이버대학교 AI부동산학과 · AI부동산통계기초</span>
    <h2>${g.title}</h2>
    <p class="lead">${g.desc}</p>
    ${keyBox("📌 먼저 알아두기", g.keys)}
    <div class="cards">
      ${g.sections.map((s, i) => `
        <div class="card" data-idx="${i}">
          <h3><span class="num">${i + 1}</span>${s.name}</h3>
          <p>${s.intro.split(". ")[0]}.</p>
          <div class="chips">${s.items.map(it => `<span class="chip">${it.t}</span>`).join("")}</div>
          <div class="more">자세한 설명 보기 →</div>
        </div>`).join("")}
    </div>`);
  document.querySelectorAll(".card").forEach(c =>
    c.addEventListener("click", () => { setOpen(+c.dataset.idx); showSection(+c.dataset.idx); }));
  history.replaceState(null, "", "#" + currentGroup);
}

/* 대분류 클릭: 하위 항목 자세한 설명 */
function showSection(idx){
  currentSection = idx;
  const g = MENU[currentGroup], s = g.sections[idx];
  showContent(`
    <span class="tag">${g.title} · ${idx + 1}. ${s.name}</span>
    <h2>${s.name}</h2>
    <p class="lead">${s.intro}</p>
    ${keyBox("📌 핵심 포인트", s.keys)}
    ${s.items.map((it, j) => `
      <article class="topic">
        <div class="topic-head"><span class="num">${j + 1}</span><h3>${it.t}</h3></div>
        <div class="topic-sum">${it.s}</div>
        <p class="desc">${it.d}</p>
        <div class="boxes">
          <div class="box ex"><b>🏠 부동산 예시</b>${it.e}</div>
          <div class="box tip"><b>⚠️ 체크포인트</b>${it.c}</div>
        </div>
        <button class="go" data-item="${j}">${it.t} 학습하기 → <small>${it.f}</small></button>
      </article>`).join("")}`);
  document.querySelectorAll(".go").forEach(b =>
    b.addEventListener("click", () => openPage(idx, +b.dataset.item)));
  history.replaceState(null, "", "#" + currentGroup + "/" + idx);
  $("sidebar").classList.remove("open");
}

/* 세부 항목 클릭: 해당 html 열기 */
function openPage(secIdx, itemIdx){
  const g = MENU[currentGroup], s = g.sections[secIdx], it = s.items[itemIdx];
  currentSection = secIdx;
  setOpen(secIdx);
  document.querySelectorAll(".acc-body a").forEach(x =>
    x.classList.toggle("current", +x.dataset.sec === secIdx && +x.dataset.item === itemIdx));
  const url = toUrl(it.f);
  $("viewer").src = url;
  $("viewer").classList.add("show");
  $("content").classList.add("hide");
  $("toolbar").classList.add("show");
  $("crumb").innerHTML = `${g.title} › ${s.name} › <b>${it.t}</b>`;
  $("newTab").href = url;
  history.replaceState(null, "", "#" + currentGroup + "/" + secIdx + "/" + itemIdx);
  $("sidebar").classList.remove("open");
}

/* 이벤트 */
document.querySelectorAll(".group-btn").forEach(b =>
  b.addEventListener("click", () => { renderAccordion(b.dataset.group); showGroup(); }));
$("homeBtn").addEventListener("click", () => { setOpen(-1); showGroup(); });
$("backBtn").addEventListener("click", () => currentSection >= 0 ? showSection(currentSection) : showGroup());
$("menuToggle").addEventListener("click", () => $("sidebar").classList.toggle("open"));

/* 시작: 주소(#그룹/대분류/항목)가 있으면 그 화면 복원 */
(function init(){
  const [g, s, i] = location.hash.slice(1).split("/");
  const group = MENU[g] ? g : "stat";
  renderAccordion(group);
  const sec = MENU[group].sections[+s];
  if (s !== undefined && sec){
    setOpen(+s);
    if (i !== undefined && sec.items[+i]) openPage(+s, +i); else showSection(+s);
  } else showGroup();
})();
</script>
</body>
</html>
