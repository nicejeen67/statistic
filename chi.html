<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const LW=1280,LH=720;
function resize(){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d))}
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 데이터 (가상) : 행 = 연령대(청년/장년), 열 = 주택유형 ---------- */
const O=[[12,13,5],[13,4,13]];
const AGE=['청년','장년'],TYP=['아파트','오피스텔','단독주택'];
const NG=30,N=60;
function tab(types){const M=[[0,0,0],[0,0,0]];types.forEach((t,c)=>M[c<NG?0:1][t]++);return M}
function chiOf(M){const r=M.map(x=>x[0]+x[1]+x[2]),c=[0,1,2].map(j=>M[0][j]+M[1][j]),n=r[0]+r[1];let s=0;
 M.forEach((x,i)=>x.forEach((o,j)=>{const e=r[i]*c[j]/n;s+=(o-e)**2/e}));return s}
const rowT=O.map(x=>x[0]+x[1]+x[2]),colT=[0,1,2].map(j=>O[0][j]+O[1][j]);
const E=O.map((x,i)=>x.map((o,j)=>rowT[i]*colT[j]/N)),minE=Math.min(...E.flat());
const chi=chiOf(O),df=2,V=Math.sqrt(chi/(N*1));
const obsT=[];O.forEach(r=>r.forEach((n,t)=>{for(let q=0;q<n;q++)obsT.push(t)}));
/* 카드 섞기(순열) : 같은 씨앗이면 항상 같은 결과 */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=rng(20261021),R=2000,sims=[],showT=[];
for(let r=0;r<R;r++){const a=obsT.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}sims.push(chiOf(tab(a)));if(r<3)showT.push(a)}
const simShow=sims.slice(0,3),b=sims.filter(v=>v>=chi-1e-9).length,simMean=sims.reduce((x,y)=>x+y,0)/R;
/* 카이제곱 분포 */
function lnG(z){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let x=z,y=z,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)}
function gammq(a,x){if(x<=0)return 1;const gl=lnG(a);
 if(x<a+1){let ap=a,sum=1/a,del=sum;for(let n=0;n<300;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-14)break}return 1-sum*Math.exp(-x+a*Math.log(x)-gl)}
 let bb=x+1-a,c=1e300,d=1/bb,h=d;for(let i=1;i<300;i++){const an=-i*(i-a);bb+=2;d=an*d+bb;if(Math.abs(d)<1e-300)d=1e-300;c=bb+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-14)break}
 return Math.exp(-x+a*Math.log(x)-gl)*h}
const pOf=(x,k=df)=>gammq(k/2,x/2);
let lo=0,hi=50;for(let i=0;i<90;i++){const m=(lo+hi)/2;if(pOf(m)>.05)lo=m;else hi=m}const crit=(lo+hi)/2;
const pval=pOf(chi);
const dens=(x,k=df)=>x<=0?(k===2?.5:0):Math.exp((k/2-1)*Math.log(x)-x/2-(k/2)*Math.log(2)-lnG(k/2));
const f1=v=>v.toFixed(1),f2=v=>v.toFixed(2),f3=v=>v.toFixed(3),pct=v=>(v*100).toFixed(1);

/* ---------- 색과 글꼴 ---------- */
const FELT='#1f5c45',FELT2='#163f31',CREAM='#f6efdf',PAPER='#fbf7ee',INK='#1c2a24',MUT='#6a776f',GOLD='#d9b45a',RED='#c8463c',CMUT='#b9cdbf';
const TC=['#2f6fb3','#8a4fbf','#d9673a'];
const DISP='"Gowun Batang",serif',BODY='"Nanum Gothic",sans-serif',MONO='"Nanum Gothic Coding",monospace';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-((-2*t+2)**2)/2;
const back=t=>{const c=1.70158,c3=c+1;return 1+c3*((t-1)**3)+c*((t-1)**2)};
const lerp=(a,b,m)=>a+(b-a)*m;
const hp=s=>{const x=Math.sin(s*12.9898+78.233)*43758.5453;return x-Math.floor(x)};

/* ---------- 그리기 도구 ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function panel(x,y,w,h,a,o={}){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=22;ctx.shadowOffsetY=8;
 rr(x,y+(1-a)*12,w,h,14);ctx.fillStyle=o.fill||PAPER;ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=2;ctx.strokeStyle=o.stroke||GOLD;ctx.stroke();
 rr(x+6,y+6+(1-a)*12,w-12,h-12,10);ctx.lineWidth=1;ctx.strokeStyle='rgba(185,150,70,.45)';ctx.stroke();ctx.restore()}
function txt(s,x,y,o={}){const a=o.a==null?1:o.a;if(a<=0)return;const sz=o.sz||24;
 ctx.save();ctx.globalAlpha=a;ctx.font=`${o.w||400} ${sz}px ${o.f||BODY}`;ctx.fillStyle=o.c||INK;ctx.textAlign=o.al||'left';ctx.textBaseline=o.bl||'alphabetic';
 if(o.p!=null&&o.p<1){if(o.p<=0){ctx.restore();return}const W=ctx.measureText(s).width;const x0=o.al==='center'?x-W/2:o.al==='right'?x-W:x;ctx.beginPath();ctx.rect(x0-4,y-sz*1.3,W*o.p+6,sz*1.8);ctx.clip()}
 ctx.fillText(s,x,y);ctx.restore()}
function para(s,x,y,maxW,lh,o={}){ctx.save();ctx.font=`${o.w||400} ${o.sz||20}px ${o.f||BODY}`;const words=s.split(' ');const lines=[];let cur='';
 words.forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);ctx.restore();
 lines.forEach((l,i)=>txt(l,x,y+i*lh,o));return lines.length}
function line(x1,y1,x2,y2,o={}){const p=o.p==null?1:clamp(o.p),a=o.a==null?1:o.a;if(p<=0||a<=0)return;
 ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=o.c||INK;ctx.lineWidth=o.w||3;ctx.lineCap='round';if(o.dash)ctx.setLineDash(o.dash);
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p));ctx.stroke();ctx.restore()}
function chip(s,x,y,a,o={}){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font=`700 ${o.sz||20}px ${o.f||DISP}`;const w=ctx.measureText(s).width+30,h=(o.sz||20)+18;
 const X0=o.al==='right'?x-w:o.al==='center'?x-w/2:x;rr(X0,y,w,h,8);ctx.fillStyle=o.fill||GOLD;ctx.fill();
 ctx.fillStyle=o.c||INK;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(s,X0+15,y+h/2+1);ctx.restore()}
/* 카드 한 장 = 사람 한 명 */
const CWd=30,CHt=42;
function pcard(x,y,t,a=1,sx=1,rot=0){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(Math.max(.02,Math.abs(sx)),1);
 ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=5;ctx.shadowOffsetY=2;rr(-CWd/2,-CHt/2,CWd,CHt,4);ctx.fillStyle=CREAM;ctx.fill();ctx.shadowColor='transparent';
 if(t<0){rr(-CWd/2+3,-CHt/2+3,CWd-6,CHt-6,3);ctx.fillStyle=RED;ctx.fill();ctx.strokeStyle=GOLD;ctx.lineWidth=1;ctx.stroke()}
 else{rr(-CWd/2+3,-CHt/2+3,CWd-6,CHt-6,3);ctx.fillStyle=TC[t];ctx.fill();ctx.fillStyle=CREAM;ctx.beginPath();
  if(t===0){ctx.rect(-6,-9,12,17);ctx.fill();ctx.fillStyle=TC[t];for(let q=0;q<3;q++){ctx.fillRect(-4,-6+q*5,3,3);ctx.fillRect(1,-6+q*5,3,3)}}
  else if(t===1){ctx.rect(-5,-11,10,20);ctx.fill();ctx.fillStyle=TC[t];ctx.fillRect(-3,-8,6,14)}
  else{ctx.moveTo(-8,0);ctx.lineTo(0,-8);ctx.lineTo(8,0);ctx.lineTo(6,0);ctx.lineTo(6,8);ctx.lineTo(-6,8);ctx.lineTo(-6,0);ctx.closePath();ctx.fill()}}
 ctx.restore()}

/* ---------- 카드 위치 ---------- */
const slotXY=(g,k)=>[(g?445:105)+(k%6)*38,190+Math.floor(k/6)*54];
const DECK=[390,600];
function slotsOf(types){const pos=new Array(N);[0,1].forEach(g=>{const idx=[];for(let c=g*NG;c<(g+1)*NG;c++)idx.push(c);idx.sort((a,b2)=>types[a]-types[b2]||a-b2);idx.forEach((c,k)=>pos[c]=k)});return pos}
const posObs=slotsOf(obsT),posShow=showT.map(slotsOf);
const posInit=new Array(N);[0,1].forEach(g=>{const ks=[...Array(NG).keys()].sort((a,b2)=>hp(a*7.1+g*3)-hp(b2*7.1+g*3));ks.forEach((k,q)=>posInit[g*NG+q]=k)});
const XY=(c,pos)=>slotXY(c<NG?0:1,pos[c]);
function groupLabels(a,L){[0,1].forEach(g=>{const[x]=slotXY(g,0);txt(`${AGE[g]} ${NG}명`,x-15,160,{f:DISP,w:700,sz:22,c:GOLD,a})})}

/* ---------- 타임라인 ---------- */
const S=[0,8,16,25,34,43,51,60],END=60;
let T=0,playing=true,speed=1,level='mid',autoStop=true;
const sceneIdx=t=>{let k=0;for(let i=0;i<S.length-1;i++)if(t>=S[i])k=i;return k};

/* ---------- 화면 문구 ---------- */
const TX={
 mid:{sub:'카드 1장 = 1명 · 청년 30명 + 장년 30명 · 가상 데이터',
