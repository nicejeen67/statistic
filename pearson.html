<style>
/* Layout: 16:9 플랫 모션그래픽 스테이지(동네 지도 → 산점도) + 컨트롤 + 장면 버튼 + 대본 패널 */
:root{
  --bg:#ece4d3; --surface:#fffaf0; --fg:#1d2b4f; --muted:#5f6784; --line:#cfc4ad;
  --accent:#ef6f5e; --accent-soft:#fbe0d9; --blue:#3d7dd8; --shadow:#1d2b4f;
  --display:"Black Han Sans","Noto Sans KR","Malgun Gothic",sans-serif;

  --mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151b2c; --surface:#1f2740; --fg:#eef0f6; --muted:#a4abc2; --line:#36405e;
  --accent:#ff8676; --accent-soft:#3c2630; --blue:#73a6f0; --shadow:#05070d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151b2c; --surface:#1f2740; --fg:#eef0f6; --muted:#a4abc2; --line:#36405e;
  --accent:#ff8676; --accent-soft:#3c2630; --blue:#73a6f0; --shadow:#05070d; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:36px;line-height:1.1;text-wrap:balance}
.seg{display:inline-flex;border:2px solid var(--fg);border-radius:999px;overflow:hidden;box-shadow:3px 3px 0 var(--shadow)}
.seg button{font:inherit;border:0;background:var(--surface);color:var(--fg);padding:7px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#ece4d3;border:2.5px solid var(--fg);border-radius:14px;overflow:hidden;box-shadow:6px 6px 0 var(--shadow)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}

.btn{font:inherit;font-size:14px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}

.btn.main{background:var(--accent);color:#fff;min-width:96px}
.btn[aria-pressed="true"]{background:var(--accent-soft)}
.btn:focus-visible,.seg button:focus-visible,.scenes button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
select{font:inherit;font-size:14px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);border-radius:10px;padding:5px 8px}
.scrub{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px}
.scrub input{flex:1;min-width:0;accent-color:var(--accent)}
.time{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.scenes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.scenes button{font:inherit;text-align:left;border:2px solid var(--fg);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 9px;cursor:pointer;min-width:0}
.scenes .n{display:block;font-family:var(--display);font-size:15px;color:var(--accent);line-height:1.2}
.scenes .l{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scenes button[aria-current="true"]{background:var(--fg);color:var(--bg)}

.script .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;letter-spacing:.06em;color:var(--muted)}

.now{margin:0;font-size:16px;line-height:1.85;max-width:72ch}
.tip{margin:0;font-size:14px;color:var(--muted);border-left:4px solid var(--accent);padding-left:10px}
details{background:var(--surface);border:2px solid var(--fg);border-radius:14px;padding:10px 16px}
summary{cursor:pointer;font-weight:700}
#sAll{margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:10px}

.foot{margin:0;font-size:13px;color:var(--muted)}

body.rec{background:#000}

<div class="wrap">
  <header class="top">
    <div><p class="eyebrow">AI 부동산 통계 기초 · 강의 영상 자료</p><h1>피어슨 상관분석 동네 지도</h1></div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const LW=1280,LH=720;
function resize(){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d))}
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 데이터 (가상) : 역까지 거리(m), 3.3㎡당 매매가(만원) ---------- */
const X=[120,250,310,400,450,520,600,650,700,780,850,900,980,1050,1120,1200,1280,1350,1430,1500];
const Y=[1634,1356,1527,1376,1552,1256,1352,1440,1109,1293,1152,1393,1071,1150,942,1170,980,1059,935,859];
const n=X.length;
const mx=X.reduce((a,b)=>a+b,0)/n,my=Y.reduce((a,b)=>a+b,0)/n;
let Sxy=0,Sxx=0,Syy=0,posSum=0,negSum=0,posN=0,negN=0;
const prod=X.map((x,i)=>{const p=(x-mx)*(Y[i]-my);Sxy+=p;Sxx+=(x-mx)**2;Syy+=(Y[i]-my)**2;if(p>=0){posSum+=p;posN++}else{negSum+=p;negN++}return p});
const sx=Math.sqrt(Sxx/(n-1)),sy=Math.sqrt(Syy/(n-1)),cov=Sxy/(n-1),r=Sxy/Math.sqrt(Sxx*Syy),r2=r*r,df=n-2;
const tval=r*Math.sqrt(df)/Math.sqrt(1-r2);
/* t분포 : 정규화 불완전 베타함수 */
function lnG(z){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let x=z,y=z,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)}
function bcf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;
 for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;
  aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break}return h}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lnG(a+b)-lnG(a)-lnG(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(a,b,x)/a:1-bt*bcf(b,a,1-x)/b}
const p2=t=>ibeta(df/(df+t*t),df/2,.5);
let lo=0,hi=10;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(p2(m)>.05)lo=m;else hi=m}const tcrit=(lo+hi)/2;
const pval=p2(tval);
const z=Math.atanh(r),se=1/Math.sqrt(n-3),ciL=Math.tanh(z-1.959964*se),ciU=Math.tanh(z+1.959964*se);
const f2=v=>v.toFixed(2),f3=v=>v.toFixed(3),fi=v=>Math.round(v).toLocaleString('ko-KR');
const pTxt=pval<.001?'< .001':f3(pval);

/* ---------- 색과 글꼴 ---------- */
const BG='#ece4d3',INK='#1d2b4f',CORAL='#ef6f5e',BLUE='#3d7dd8',MINT='#2bb39a',YEL='#f5c242',MUT='#6d7491',WHITE='#fffaf0',ROAD='#d9cdb3',PARK='#cfe3c4',WATER='#bcd6ee';
const DISP='"Black Han Sans","Noto Sans KR",sans-serif',BODY='"Noto Sans KR",sans-serif',MONO='"Roboto Mono",monospace';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-((-2*t+2)**2)/2;
const back=t=>{const c=1.70158,c3=c+1;return 1+c3*((t-1)**3)+c*((t-1)**2)};
const lerp=(a,b,m)=>a+(b-a)*m;
const hp=s=>{const x=Math.sin(s*12.9898+78.233)*43758.5453;return (x-Math.floor(x))*2-1};
function mixC(a,b,m){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],m))).join(',')})`}

/* ---------- 그리기 도구 (플랫) ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function card(x,y,w,h,a,o={}){if(a<=0)return;ctx.save();ctx.globalAlpha=a;const s=o.sh==null?7:o.sh;
 rr(x+s,y+s,w,h,o.r||16);ctx.fillStyle=INK;ctx.fill();rr(x,y,w,h,o.r||16);ctx.fillStyle=o.fill||WHITE;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();ctx.restore()}
function txt(s,x,y,o={}){const a=o.a==null?1:o.a;if(a<=0)return;const sz=o.sz||24;
 ctx.save();ctx.globalAlpha=a;ctx.font=`${o.w||500} ${sz}px ${o.f||BODY}`;ctx.fillStyle=o.c||INK;ctx.textAlign=o.al||'left';ctx.textBaseline=o.bl||'alphabetic';
 if(o.p!=null&&o.p<1){if(o.p<=0){ctx.restore();return}const W=ctx.measureText(s).width;const x0=o.al==='center'?x-W/2:o.al==='right'?x-W:x;ctx.beginPath();ctx.rect(x0-4,y-sz*1.3,W*o.p+6,sz*1.8);ctx.clip()}
 ctx.fillText(s,x,y);ctx.restore()}
function line(x1,y1,x2,y2,o={}){const p=o.p==null?1:clamp(o.p),a=o.a==null?1:o.a;if(p<=0||a<=0)return;
 ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=o.c||INK;ctx.lineWidth=o.w||3;ctx.lineCap='round';if(o.dash)ctx.setLineDash(o.dash);
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p));ctx.stroke();ctx.restore()}
function dot(x,y,rad,fill,a=1,sc=1){if(a<=0||sc<=0)return;const R=rad*sc;ctx.save();ctx.globalAlpha=a;
 ctx.fillStyle='rgba(29,43,79,.28)';ctx.beginPath();ctx.arc(x+2.5,y+3,R,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle=INK;ctx.stroke();ctx.restore()}
function house(x,y,s,fill,a=1){if(a<=0||s<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(s,s);
 ctx.lineJoin='round';ctx.lineWidth=2.4/s*s;
 ctx.fillStyle='rgba(29,43,79,.28)';ctx.fillRect(-11+3,-6+3,22,20);
 ctx.fillStyle=fill;ctx.strokeStyle=INK;ctx.beginPath();ctx.rect(-11,-6,22,20);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(-14,-5);ctx.lineTo(0,-18);ctx.lineTo(14,-5);ctx.closePath();ctx.fillStyle=INK;ctx.fill();
 ctx.fillStyle=WHITE;ctx.fillRect(-5,1,4,4);ctx.fillRect(2,1,4,4);ctx.fillRect(-5,8,4,4);ctx.fillRect(2,8,4,4);ctx.restore()}
function pill(s,x,y,a,o={}){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font=`400 ${o.sz||24}px ${DISP}`;const w=ctx.measureText(s).width+36,h=(o.sz||24)+20;
 const X0=o.al==='right'?x-w:x;rr(X0+4,y+4,w,h,h/2);ctx.fillStyle=INK;ctx.fill();rr(X0,y,w,h,h/2);ctx.fillStyle=o.fill||INK;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
 ctx.fillStyle=o.c||WHITE;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(s,X0+18,y+h/2+1);ctx.restore()}

/* ---------- 좌표 ---------- */
const PL=150,PR=790,PT=130,PB=600;
const px=v=>PL+v/1600*(PR-PL),py=v=>PB-(v-800)/1000*(PB-PT);
const MC={x:640,y:410};
const prMin=Math.min(...Y),prMax=Math.max(...Y);
const items=X.map((x,i)=>{const ang=i*2.39996+hp(i+4)*.25,rad=48+x*.16;
 return{i,x,y:Y[i],mx:MC.x+Math.cos(ang)*rad*1.55,my:MC.y+Math.sin(ang)*rad*.92,col:mixC('#9cc3f0','#ef6f5e',(Y[i]-prMin)/(prMax-prMin)),sign:prod[i]>=0?1:-1}});

/* ---------- 타임라인 ---------- */
const S=[0,8,16,25,34,43,51,60],END=60;
let T=0,playing=true,speed=1,level='mid',autoStop=true;
const sceneIdx=t=>{let k=0;for(let i=0;i<S.length-1;i++)if(t>=S[i])k=i;return k};

/* ---------- 화면 문구 ---------- */
const TX={
 mid:{sub:'역세권 아파트 20곳 · 가상 데이터',
  scenes:['상관분석이란?','점으로 찍기','평균선으로 네 칸 나누기','함께 움직이는 정도 r','r 읽는 법','우연일까?','결과표와 주의점'],
  station:'지하철역',ring:'m',low:'가격 낮음',high:'가격 높음',q0:'역에서 멀어지면 집값은?',
  xl:'역까지 거리 (m)',yl:'3.3㎡당 매매가 (만원)',mxl:'평균 거리',myl:'평균 가격',
  quad:['같은 방향 (+)','반대 방향 (−)'],c2:['점마다 (거리 차이) × (가격 차이)',`같은 방향 (+) : ${posN}곳`,`반대 방향 (−) : ${negN}곳`],
  c3t:'함께 움직이는 정도',b1:'같은 방향 합',b2:'반대 방향 합',
  c3:[`합계 ÷ (n−1) = ${fi(cov)}`,'단위가 섞여 크기를 비교하기 어려워요','두 흩어짐으로 나누면 → −1 ~ +1'],gauge:'r',
  spec:'r 은 −1 부터 +1 까지',bands:['강한 반대','보통 반대','거의 없음','보통 같은','강한 같은'],ours:'우리 동네',
  r2t:'r² (결정계수)',r2s:'가격 차이 중 거리와\n함께 설명되는 몫',
  h0:'질문 : 진짜 관계가 없는데 우연히 이렇게 나왔을까?',tl:['관계 점수 r',`자유도 = ${n} − 2 = ${df}`,`t = ${f2(tval)}`,`우연일 확률 p ${pval<.001?'< 0.001':'= '+f3(pval)}`],
